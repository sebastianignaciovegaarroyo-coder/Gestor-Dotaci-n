    <!-- REGISTRO DEL SERVICE WORKER -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('PWA: Service Worker Registrado.'))
            .catch(err => console.log('PWA: Error Service Worker.', err));
        });
      }

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f1f5f9; }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(30, 41, 59, 0.8); }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        
        // MANTENEMOS TUS CREDENCIALES DE FIREBASE EXACTAS
        const firebaseConfig = {
          apiKey: "AIzaSyD_ZlO3treRtz6ZkjY9Vr69wJz2vA...",
          authDomain: "bramaqcloud.firebaseapp.com",
          projectId: "bramaqcloud",
          storageBucket: "bramaqcloud.appspot.com",
          messagingSenderId: "369713509600",
          appId: "1:369713509600:web:b6d878c..."
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function App() {
          const [deferredPrompt, setDeferredPrompt] = useState(null);
          const [isInstallable, setIsInstallable] = useState(false);
          const [showInstallHelp, setShowInstallHelp] = useState(false);

          useEffect(() => {
            const handleBeforeInstallPrompt = (e) => {
              e.preventDefault();
              setDeferredPrompt(e);
              setIsInstallable(true);
            };
            window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
            return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
          }, []);

          const handleInstallClick = async () => {
            if (deferredPrompt) {
              deferredPrompt.prompt();
              const { outcome } = await deferredPrompt.userChoice;
              if (outcome === 'accepted') setIsInstallable(false);
              setDeferredPrompt(null);
            } else {
              setShowInstallHelp(true);
            }
          };

          // ... (AQUÍ IRÍA EL RESTO DE TU LÓGICA DE APP, PERFILES, BITÁCORA, ETC.)
          // HE MANTENIDO LA ESTRUCTURA EXACTA PARA QUE TUS FUNCIONES NO SE ALTEREN.
          
          return (
             /* MANTEN TU ESTRUCTURA DE COMPONENTES AQUÍ */
             <div>
                {/* Asegúrate de que el botón de instalación llame a handleInstallClick */}
                <button onClick={handleInstallClick} className="...">Instalar Aplicación</button>
             </div>
          );
        }
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
