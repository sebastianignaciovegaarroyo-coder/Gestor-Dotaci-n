<!DOCTYPE html>
<html lang="es" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- RUTA BASE PARA GITHUB PAGES -->
    <base href="/Gestor-Dotaci-n/">
    
    <!-- PWA & SEO -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BRAMAQ">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3200/3200424.png">
    
    <title>Gestor de Dotación BRAMAQ - Enterprise Cloud</title>
    
    <!-- LIBRERÍAS EXTERNAS DE PRODUCCIÓN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <!-- SERVICE WORKER SEGURO -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => console.warn('PWA SW no esencial:', err));
        });
      }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f1f5f9; margin: 0; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(30, 41, 59, 0.8); }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        #root { min-height: 100vh; }
        .app-loader { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: #f59e0b; font-weight: bold; background: #020617; }
    </style>
</head>
<body class="antialiased selection:bg-amber-500/30 selection:text-amber-200" translate="no">
    <div id="root">
        <div class="app-loader">
            <div style="font-size: 24px; margin-bottom: 10px;">BRAMAQ Enterprise</div>
            <div style="font-size: 14px; color: #94a3b8; font-weight: normal;">Cargando sistema en tiempo real...</div>
        </div>
    </div>
    
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        
        // CONFIGURACIÓN DE FIREBASE
        const firebaseConfig = {
          apiKey: "AIzaSyD_ZlO3treRtz6ZkjY9Vr69wJz2vA...",
          authDomain: "bramaqcloud.firebaseapp.com",
          projectId: "bramaqcloud",
          storageBucket: "bramaqcloud.appspot.com",
          messagingSenderId: "369713509600",
          appId: "1:369713509600:web:b6d878c..."
        };

        let db;
        try {
          if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
          db = firebase.firestore();
        } catch (e) { console.error("Error iniciando Firebase:", e); }

        function App() {
          // ESTADOS DEL SISTEMA
          const [deferredPrompt, setDeferredPrompt] = useState(null);
          const [isInstallable, setIsInstallable] = useState(false);
          const [isIOS, setIsIOS] = useState(false);
          const [showInstallHelp, setShowInstallHelp] = useState(false);

          const [hasEntered, setHasEntered] = useState(false);
          const [selectedRole, setSelectedRole] = useState('');
          const [selectedSupName, setSelectedSupName] = useState('');
          const [userSession, setUserSession] = useState({ rol: "", autor: "" });

          const [employees, setEmployees] = useState([]);
          const [loading, setLoading] = useState(true);
          const [onlineStatus, setOnlineStatus] = useState(navigator.onLine);
          const [searchTerm, setSearchTerm] = useState('');
          const [activeTab, setActiveTab] = useState('dashboard');
          const [activeFilter, setActiveFilter] = useState('TODOS');
          const [citiesList, setCitiesList] = useState(['Loncoche', 'Lanco', 'Valdivia', 'San José de la Mariquina', 'Los Lagos', 'Malalhue', 'Ciruelos', 'Panguipulli', 'Mariquina']);
          const [newCityInput, setNewCityInput] = useState('');
          
          const [isModalOpen, setIsModalOpen] = useState(false);
          const [currentEmployee, setCurrentEmployee] = useState(null);
          const [formError, setFormError] = useState('');
          
          const [isHistoryModalOpen, setIsHistoryModalOpen] = useState(false);
          const [selectedEmpForHistory, setSelectedEmpForHistory] = useState(null);
          const [isGlobalHistoryOpen, setIsGlobalHistoryOpen] = useState(false);
          const [selectedPhone, setSelectedPhone] = useState(null);

          const [formData, setFormData] = useState({
            nombre: '', rut: '', direccion: '', ciudad: 'Valdivia', cargo: 'OPERADOR GRUA HORQUILLA', telefono: '', correo: '', emergenciaNombre: '', emergenciaFono: '',
            documentos: { contrato: true, induccion: true, examenes: true, epp: true }
          });

          // OBTENCIÓN DINÁMICA DE SUPERVISORES
          const supervisorsList = useMemo(() => {
            const list = employees.filter(e => (e.cargo || '').toUpperCase().includes('SUPERVISOR')).map(e => e.nombre);
            return list.length > 0 ? list : ['Briones Victor', 'Nahuelpan Reinaldo Patricio', 'Rubilar Daniel Joel'];
          }, [employees]);

          const [logForm, setLogForm] = useState({
            tipo: 'Licencia Médica', modoFechas: 'rango', fechaInicio: new Date().toISOString().split('T')[0], fechaTermino: new Date().toISOString().split('T')[0], fechaUnica: new Date().toISOString().split('T')[0],
            customTipo: '', nota: '', archivos: []
          });

          // PWA
          useEffect(() => {
            setIsIOS(/iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase()));
            const handleBeforeInstallPrompt = (e) => { e.preventDefault(); setDeferredPrompt(e); setIsInstallable(true); };
            window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
            return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
          }, []);

          const handleInstallClick = async () => {
            if (deferredPrompt) {
              deferredPrompt.prompt();
              const { outcome } = await deferredPrompt.userChoice;
              if (outcome === 'accepted') setIsInstallable(false);
              setDeferredPrompt(null);
            } else {
              setShowInstallHelp(true);
            }
          };

          // SINCRONIZACIÓN FIREBASE EN TIEMPO REAL
          useEffect(() => {
            const on = () => setOnlineStatus(true), off = () => setOnlineStatus(false);
            window.addEventListener('online', on); window.addEventListener('offline', off);
            
            if (!hasEntered || !db) return;
            setLoading(true);
            const unsub = db.collection('employees').onSnapshot(snap => {
              const items = [];
              snap.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
              setEmployees(items); 
              setLoading(false);
            }, (error) => { console.error("Error Firebase:", error); setLoading(false); });
            return () => { unsub(); window.removeEventListener('online', on); window.removeEventListener('offline', off); };
          }, [hasEntered]);

          useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

          const handleEnterApp = () => {
            if (!selectedRole) return;
            if (selectedRole === 'Supervisor' && !selectedSupName) return;
            
            let autorNombre = selectedRole;
            if (selectedRole === 'Administrativo') autorNombre = 'Administrativo / RRHH';
            if (selectedRole === 'AdminContrato') autorNombre = 'Administrador de Contrato';
            if (selectedRole === 'Prevencionista') autorNombre = 'Prevencionista de Riesgos';
            if (selectedRole === 'Supervisor') autorNombre = selectedSupName;

            setUserSession({ rol: selectedRole, autor: autorNombre });
            setHasEntered(true);
          };

          // DESCARGA TOTAL EXCEL
          const handleDownloadExcel = () => {
            try {
              if (!employees || employees.length === 0) { alert("No hay trabajadores."); return; }
              const exportData = employees.map(emp => {
                const historialTxt = emp.historial && emp.historial.length > 0 
                  ? emp.historial.map(h => `[${h.fechaInicio}] ${h.tipo} - ${h.nota} (Por: ${h.autor})`).join(" | ") 
                  : "Sin registros";
                return {
                  "Nombre": emp.nombre || "", "RUT": emp.rut || "", "Cargo": emp.cargo || "", "Ciudad": emp.ciudad || "",
                  "Dirección": emp.direccion || "", "Teléfono": emp.telefono || "", "Correo": emp.correo || "",
                  "Contacto Emergencia": emp.emergenciaNombre || "", "Fono Emergencia": emp.emergenciaFono || "",
                  "Contrato": emp.documentos?.contrato ? "Completo" : "Pendiente",
                  "Inducción": emp.documentos?.induccion ? "Completo" : "Pendiente",
                  "Exámenes": emp.documentos?.examenes ? "Completo" : "Pendiente",
                  "EPP": emp.documentos?.epp ? "Completo" : "Pendiente",
                  "Historial / Bitácora": historialTxt
                };
              });
              const ws = XLSX.utils.json_to_sheet(exportData);
              const wb = XLSX.utils.book_new();
              XLSX.utils.book_append_sheet(wb, ws, "Dotacion Total");
              XLSX.writeFile(wb, `BRAMAQ_Dotacion_Completa_${new Date().toISOString().split('T')[0]}.xlsx`);
            } catch (error) { alert("Error al exportar: " + error.message); }
          };

          const handleDownloadGlobalLogsExcel = () => {
            try {
              let logsToExport = [];
              employees.forEach(emp => {
                if (emp.historial && emp.historial.length > 0) {
                  emp.historial.forEach(h => {
                    let attach = h.archivos?.length > 0 ? h.archivos.map(a => a.nombre).join(", ") : (h.archivoNombre || "Ninguno");
                    logsToExport.push({
                      "Trabajador": emp.nombre, "RUT": emp.rut, "Cargo": emp.cargo, "Evento": h.tipo,
                      "Fecha": h.modoFechas === 'rango' ? `${h.fechaInicio} al ${h.fechaTermino}` : h.fechaInicio,
                      "Observación": h.nota, "Autor": h.autor, "Perfil": h.rolAutor, "Adjuntos": attach
                    });
                  });
                }
              });
              if (logsToExport.length === 0) { alert("No hay observaciones en la bitácora."); return; }
              logsToExport.sort((a, b) => new Date(b["Fecha"]) - new Date(a["Fecha"]));
              const ws = XLSX.utils.json_to_sheet(logsToExport);
              const wb = XLSX.utils.book_new();
              XLSX.utils.book_append_sheet(wb, ws, "Hoja de Vida Global");
              XLSX.writeFile(wb, `BRAMAQ_Bitacora_Global.xlsx`);
            } catch (error) { alert("Error Excel: " + error.message); }
          };

          const handleDeleteAllData = async () => {
            if (userSession.rol !== 'Administrativo' && userSession.rol !== 'AdminContrato') { alert("Sin permisos."); return; }
            if (confirm("⚠️ ¿Estás seguro de vaciar toda la base de datos de trabajadores?")) {
              try {
                const snapshot = await db.collection('employees').get();
                const batch = db.batch();
                snapshot.docs.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
                alert("Base de datos vaciada.");
              } catch (err) { alert("Error: " + err.message); }
            }
          };

          const fileInputRef = useRef(null);
          const logFileRef = useRef(null);

          // IMPORTACIÓN EXCEL
          const handleUploadExcel = (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader(); reader.readAsArrayBuffer(file);
            reader.onload = async (event) => {
              try {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const jsonSheet = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: "", range: 1 });
                if (jsonSheet.length > 0) {
                  let addedCount = 0; let duplicateCount = 0;
                  let existingRuts = new Set(employees.map(emp => (emp.rut || '').trim().toLowerCase().replace(/[^0-9kK]/g, '')));
                  if (confirm(`Se detectaron ${jsonSheet.length} registros. ¿Importar omitiendo duplicados por RUT?`)) {
                    for (let row of jsonSheet) {
                      const keys = Object.keys(row);
                      const findVal = (terms) => {
                        for (let t of terms) {
                          const foundKey = keys.find(k => k.toLowerCase().includes(t));
                          if (foundKey && row[foundKey] !== undefined) return String(row[foundKey]).trim();
                        } return '';
                      };
                      const nombre = findVal(['nombre']); const rut = findVal(['rut']); const direccion = findVal(['direccion']); const ciudad = findVal(['ciudad']) || 'Valdivia'; const cargo = findVal(['cargo']); const telefono = findVal(['telefon', 'fono', 'celular']); const correo = findVal(['correo', 'email']); const emergenciaNombre = findVal(['emergencia', 'contacto']); const emergenciaFono = findVal(['emergencia fono', 'emergencia tel']);
                      const cleanRut = (rut || '').trim().toLowerCase().replace(/[^0-9kK]/g, '');
                      if ((nombre || rut) && cleanRut) {
                        if (!existingRuts.has(cleanRut)) {
                          await db.collection('employees').add({
                            nombre: nombre || 'Sin Nombre', rut: rut || 'Sin RUT', direccion: direccion || '', ciudad: ciudad, cargo: cargo || 'OPERADOR GRUA HORQUILLA', telefono: telefono, correo: correo, emergenciaNombre: emergenciaNombre, emergenciaFono: emergenciaFono,
                            documentos: { contrato: true, induccion: true, examenes: true, epp: true }, historial: []
                          });
                          existingRuts.add(cleanRut); addedCount++;
                        } else { duplicateCount++; }
                      }
                    }
                    alert(`¡Importación completada!\nNuevos: ${addedCount}\nDuplicados omitidos: ${duplicateCount}`);
                  }
                }
              } catch (err) { alert("Error: " + err.message); }
            };
          };

          // CRUD TRABAJADOR
          const handleSave = async (e) => {
            e.preventDefault();
            if (!formData.nombre || !formData.rut) { setFormError("Nombre y RUT obligatorios."); return; }
            try {
              if (currentEmployee) await db.collection('employees').doc(currentEmployee.id).update(formData);
              else await db.collection('employees').add({ ...formData, historial: [] });
              setIsModalOpen(false); setCurrentEmployee(null);
            } catch (err) { setFormError("Error: " + err.message); }
          };

          const handleDelete = async (id) => {
            if (userSession.rol !== 'Administrativo' && userSession.rol !== 'AdminContrato') { alert("Sin permisos."); return; }
            if (confirm("¿Eliminar este trabajador permanentemente?")) await db.collection('employees').doc(id).delete();
          };

          // MULTIARCHIVO BITÁCORA
          const handleLogFileChange = (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;
            const newArchivos = [];
            let processed = 0;
            files.forEach(file => {
              const reader = new FileReader();
              reader.onload = (uploadEvent) => {
                newArchivos.push({ nombre: file.name, tipo: file.type, url: uploadEvent.target.result, fechaCarga: new Date().toISOString() });
                processed++;
                if (processed === files.length) setLogForm(prev => ({ ...prev, archivos: [...(prev.archivos || []), ...newArchivos] }));
              };
              reader.readAsDataURL(file);
            });
            if (logFileRef.current) logFileRef.current.value = "";
          };

          const handleRemovePendingFile = (idx) => setLogForm(prev => ({ ...prev, archivos: prev.archivos.filter((_, i) => i !== idx) }));

          const handleDeleteSavedAttachment = async (logId, fileIdx) => {
            if (!selectedEmpForHistory) return;
            if (confirm("¿Eliminar este archivo adjunto permanentemente?")) {
              try {
                const updatedHistorial = selectedEmpForHistory.historial.map(h => {
                  if (h.id === logId) return { ...h, archivos: h.archivos.filter((_, i) => i !== fileIdx) };
                  return h;
                });
                await db.collection('employees').doc(selectedEmpForHistory.id).update({ historial: updatedHistorial });
                setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: updatedHistorial });
              } catch (err) { alert("Error: " + err.message); }
            }
          };

          const handleDeleteLog = async (logId) => {
            if (!selectedEmpForHistory) return;
            if (confirm("¿Eliminar completamente esta observación del historial?")) {
              try {
                const updatedHistorial = (selectedEmpForHistory.historial || []).filter(h => h.id !== logId);
                await db.collection('employees').doc(selectedEmpForHistory.id).update({ historial: updatedHistorial });
                setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: updatedHistorial });
              } catch (err) { alert("Error: " + err.message); }
            }
          };

          const handleAddLog = async (e) => {
            e.preventDefault();
            if (!selectedEmpForHistory) return;
            const logEntry = {
              id: String(Date.now()), tipo: logForm.tipo === 'Otro' ? (logForm.customTipo || 'Otro') : logForm.tipo, 
              modoFechas: logForm.modoFechas, fechaInicio: logForm.modoFechas === 'rango' ? logForm.fechaInicio : logForm.fechaUnica,
              fechaTermino: logForm.modoFechas === 'rango' ? logForm.fechaTermino : logForm.fechaUnica,
              nota: logForm.nota || '', archivos: logForm.archivos || [], 
              autor: userSession.autor, rolAutor: userSession.rol, createdAt: new Date().toISOString()
            };
            try {
              const updatedHistorial = [...(selectedEmpForHistory.historial || []), logEntry];
              await db.collection('employees').doc(selectedEmpForHistory.id).update({ historial: updatedHistorial });
              setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: updatedHistorial });
              setLogForm({ tipo: 'Licencia Médica', modoFechas: 'rango', fechaInicio: new Date().toISOString().split('T')[0], fechaTermino: new Date().toISOString().split('T')[0], fechaUnica: new Date().toISOString().split('T')[0], customTipo: '', nota: '', archivos: [] });
            } catch (error) { alert("Error: " + error.message); }
          };

          const getMissingDataList = (emp) => {
            let missing = [];
            if (!emp.telefono) missing.push("Teléfono");
            if (!emp.correo) missing.push("Correo");
            if (!emp.emergenciaNombre || !emp.emergenciaFono) missing.push("Emergencia");
            if (emp.documentos) {
              if (!emp.documentos.contrato) missing.push("Contrato");
              if (!emp.documentos.induccion) missing.push("Inducción");
              if (!emp.documentos.examenes) missing.push("Exámenes");
              if (!emp.documentos.epp) missing.push("EPP");
            }
            return missing;
          };

          const filtered = useMemo(() => {
            return employees.filter(emp => {
              const s = searchTerm.toLowerCase();
              const matchSearch = (emp.nombre||'').toLowerCase().includes(s) || (emp.rut||'').toLowerCase().includes(s) || (emp.cargo||'').toLowerCase().includes(s) || (emp.ciudad||'').toLowerCase().includes(s);
              if (!matchSearch) return false;
              if (activeFilter === 'TODOS') return true;
              if (activeFilter === 'INCOMPLETOS') return getMissingDataList(emp).length > 0;
              if (activeFilter === 'ADMIN_CONTRATO') return (emp.cargo||'').toUpperCase().includes('CONTRATO');
              if (activeFilter === 'SUPERVISORES') return (emp.cargo||'').toUpperCase().includes('SUPERVISOR');
              if (activeFilter === 'PREVENCIONISTAS') return (emp.cargo||'').toUpperCase().includes('PREVENCION');
              if (activeFilter === 'ADMINISTRATIVOS') return (emp.cargo||'').toUpperCase().includes('ADMINISTRATIVO') && !(emp.cargo||'').toUpperCase().includes('CONTRATO');
              if (activeFilter === 'OPERADORES_GRUA') return (emp.cargo||'').toUpperCase().includes('GRUA');
              if (activeFilter === 'CARGADOR_FRONTAL') return (emp.cargo||'').toUpperCase().includes('CARGADOR FRONTAL');
              if (activeFilter === 'MECANICOS') return (emp.cargo||'').toUpperCase().includes('MECANICO');
              if (citiesList.includes(activeFilter)) return (emp.ciudad||'').toLowerCase() === activeFilter.toLowerCase();
              return true;
            }).sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es', { sensitivity: 'base' }));
          }, [employees, searchTerm, activeFilter, citiesList]);

          const kpis = useMemo(() => {
            const porCiudad = {}; citiesList.forEach(c => porCiudad[c] = employees.filter(e => (e.ciudad||'').toLowerCase() === c.toLowerCase()).length);
            return {
              total: employees.length, incompletos: employees.filter(e => getMissingDataList(e).length > 0).length,
              supervisores: employees.filter(e => (e.cargo||'').toUpperCase().includes('SUPERVISOR')).length,
              prevencionistas: employees.filter(e => (e.cargo||'').toUpperCase().includes('PREVENCION')).length,
              administrativos: employees.filter(e => (e.cargo||'').toUpperCase().includes('ADMINISTRATIVO') && !(e.cargo||'').toUpperCase().includes('CONTRATO')).length,
              adminContrato: employees.filter(e => (e.cargo||'').toUpperCase().includes('CONTRATO')).length,
              operadoresGrua: employees.filter(e => (e.cargo||'').toUpperCase().includes('GRUA')).length,
              cargadorFrontal: employees.filter(e => (e.cargo||'').toUpperCase().includes('CARGADOR FRONTAL')).length,
              mecanicos: employees.filter(e => (e.cargo||'').toUpperCase().includes('MECANICO')).length,
              porCiudad
            };
          }, [employees, citiesList]);

          const allGlobalLogs = useMemo(() => {
            let logs = [];
            employees.forEach(emp => { if (emp.historial) emp.historial.forEach(h => logs.push({ ...h, empleadoNombre: emp.nombre, empleadoRut: emp.rut })); });
            return logs.sort((a, b) => new Date(b.createdAt || b.fechaInicio) - new Date(a.createdAt || a.fechaInicio));
          }, [employees]);

          const RequisitoToggle = ({ label, icon, checked, onChange }) => (
            <label className={`flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-colors ${checked ? 'bg-emerald-500/10 border-emerald-500/30' : 'bg-slate-900/60 border-slate-800'}`}>
                <input type="checkbox" checked={checked} onChange={onChange} className="hidden" />
                <div className={`w-4 h-4 rounded flex items-center justify-center ${checked ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 border border-slate-700'}`}>{checked && <i data-lucide="check" className="w-3 h-3"></i>}</div>
                <div className="flex items-center gap-2"><i data-lucide={icon} className={`w-4 h-4 ${checked ? 'text-emerald-400' : 'text-slate-500'}`}></i><span className={`text-xs font-medium ${checked ? 'text-emerald-400' : 'text-slate-400'}`}>{label}</span></div>
            </label>
          );

          // RENDERIZADO LOGIN ESTRICTO
          if (!hasEntered) {
            return (
              <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4">
                <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl w-full max-w-md shadow-2xl flex flex-col items-center fade-in">
                  <div className="w-20 h-20 bg-gradient-to-br from-amber-400 to-amber-600 rounded-2xl flex items-center justify-center text-slate-950 mb-4"><i data-lucide="shield-check" className="w-10 h-10"></i></div>
                  <h1 className="text-xl font-extrabold text-white">Gestor de Dotación</h1>
                  <h2 className="text-sm font-bold text-amber-400 mb-8 uppercase tracking-widest">BRAMAQ</h2>

                  <div className="w-full space-y-4">
                    <label className="text-[10px] text-slate-500 font-bold uppercase block mb-1">Seleccione Rol de Ingreso</label>

                          <div>
                            <label className="text-[10px] uppercase font-bold text-blue-400"><i data-lucide="phone" className="w-3 h-3 inline mr-1"></i>Teléfono Personal</label>
                            <input value={formData.telefono} onChange={e=>setFormData({...formData, telefono:e.target.value})} placeholder="+569..." className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white font-mono outline-none focus:border-blue-500 mt-1" />
                          </div>
                          <div></div>
                          <div className="sm:col-span-2 border-t border-slate-800 my-1"></div>
                          <div>
                            <label className="text-[10px] uppercase font-bold text-red-400"><i data-lucide="shield-alert" className="w-3 h-3 inline mr-1"></i>Contacto Emergencia</label>
                            <input value={formData.emergenciaNombre} onChange={e=>setFormData({...formData, emergenciaNombre:e.target.value})} placeholder="Nombre de familiar..." className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white mt-1 outline-none focus:border-red-500" />
                          </div>
                          <div>
                            <label className="text-[10px] uppercase font-bold text-red-400">Teléfono Emergencia</label>
                            <input value={formData.emergenciaFono} onChange={e=>setFormData({...formData, emergenciaFono:e.target.value})} placeholder="+569..." className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white font-mono outline-none focus:border-red-500 mt-1" />
                          </div>
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                          <RequisitoToggle label="Contrato" icon="file-signature" checked={formData.documentos?.contrato ?? true} onChange={e => setFormData({...formData, documentos: { ...(formData.documentos || {}), contrato: e.target.checked }})} />
                          <RequisitoToggle label="Inducción" icon="presentation" checked={formData.documentos?.induccion ?? true} onChange={e => setFormData({...formData, documentos: { ...(formData.documentos || {}), induccion: e.target.checked }})} />
                          <RequisitoToggle label="Exámenes" icon="stethoscope" checked={formData.documentos?.examenes ?? true} onChange={e => setFormData({...formData, documentos: { ...(formData.documentos || {}), examenes: e.target.checked }})} />
                          <RequisitoToggle label="E.P.P." icon="hard-hat" checked={formData.documentos?.epp ?? true} onChange={e => setFormData({...formData, documentos: { ...(formData.documentos || {}), epp: e.target.checked }})} />
                        </div>
                        <div className="flex justify-end gap-2 pt-4">
                          <button type="button" onClick={() => setIsModalOpen(false)} className="bg-slate-800 px-4 py-2 rounded-lg text-xs font-bold text-white">Cancelar</button>
                          <button type="submit" className="bg-amber-500 text-slate-950 px-5 py-2 rounded-lg text-xs font-bold shadow-lg">Guardar Ficha</button>
                        </div>
                      </form>
                    </div>
                  </div>
                </div>
              )}

              {/* MODAL BITÁCORA INDIVIDUAL */}
              {isHistoryModalOpen && selectedEmpForHistory && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-sm fade-in">
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-5xl h-[90vh] flex flex-col shadow-2xl">
                    <div className="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900 rounded-t-2xl shrink-0">
                      <div className="flex items-center gap-3">
                        <div className="bg-amber-500 p-2 rounded-lg text-slate-950"><i data-lucide="book-open" className="w-5 h-5"></i></div>
                        <div><h3 className="font-bold text-white text-sm">Hoja de Vida</h3><p className="text-[10px] text-slate-400">{selectedEmpForHistory.nombre} ({selectedEmpForHistory.rut})</p></div>
                      </div>
                      <button onClick={() => setIsHistoryModalOpen(false)} className="text-slate-400 hover:text-white bg-slate-800 p-2 rounded-lg"><i data-lucide="x" className="w-4 h-4"></i></button>
                    </div>

                    <div className="flex-1 overflow-hidden flex flex-col lg:flex-row">
                      {/* Lista de Registros */}
                      <div className="flex-1 p-4 sm:p-6 border-b lg:border-b-0 lg:border-r border-slate-800 overflow-y-auto">
                        <h4 className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4"><i data-lucide="history" className="w-3 h-3 inline mr-1"></i>Registros Históricos</h4>
                        {!selectedEmpForHistory.historial?.length ? <div className="text-center text-slate-500 py-20 text-xs"><i data-lucide="folder-open" className="w-10 h-10 mx-auto mb-2 opacity-50"></i>Expediente limpio.</div> : (
                          <div className="space-y-4">
                            {selectedEmpForHistory.historial.map(h => (
                              <div key={h.id} className="bg-slate-950 border border-slate-800 p-4 rounded-xl relative group">
                                <div className="flex justify-between items-start mb-2">
                                  <span className="bg-slate-800 text-white text-[10px] font-bold px-2 py-1 rounded border border-slate-700">{h.tipo}</span>
                                  <span className="text-[10px] text-slate-400 font-mono flex items-center"><i data-lucide="calendar" className="w-3 h-3 mr-1"></i>{h.modoFechas === 'rango' ? `${h.fechaInicio} al ${h.fechaTermino}` : h.fechaInicio}</span>
                                </div>
                                {h.nota && <p className="text-xs text-slate-300 mb-3 bg-slate-900 p-2 rounded border border-slate-800">{h.nota}</p>}
                                
                                {h.archivos?.length > 0 && (
                                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-3">
                                    {h.archivos.map((a, i) => (
                                      <div key={i} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                                        <a href={a.url} target="_blank" className="text-[10px] text-blue-400 truncate w-3/4 flex items-center hover:underline"><i data-lucide={a.tipo?.includes('image') ? 'image' : 'file-text'} className="w-3 h-3 inline mr-1"></i> {a.nombre}</a>
                                        <button onClick={() => handleDeleteSavedAttachment(h.id, i)} className="text-red-400 p-1 hover:bg-red-500/10 rounded"><i data-lucide="trash-2" className="w-3 h-3"></i></button>
                                      </div>
                                    ))}
                                  </div>
                                )}
                                <div className="flex justify-between items-center text-[9px] text-slate-500 border-t border-slate-800 pt-2">
                                  <span><strong className="text-slate-300">{h.autor}</strong> ({h.rolAutor})</span>
                                  <button onClick={() => handleDeleteLog(h.id)} className="text-red-500 font-bold opacity-0 group-hover:opacity-100 transition-opacity"><i data-lucide="trash" className="w-3 h-3 inline mr-1"></i>Borrar Observación</button>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>

                      {/* Formulario Nueva Observación */}
                      <div className="w-full lg:w-80 p-4 sm:p-6 bg-slate-900/50 overflow-y-auto">
                        <h4 className="text-[10px] font-bold text-amber-500 uppercase tracking-widest mb-4"><i data-lucide="plus-circle" className="w-3 h-3 inline mr-1"></i>Añadir Evento</h4>
                        <form onSubmit={handleAddLog} className="space-y-4">
                          <div>
                            <label className="text-[9px] text-slate-500 uppercase font-bold mb-1 block">Categoría del Evento</label>
                            <select value={logForm.tipo} onChange={e=>setLogForm({...logForm, tipo:e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none focus:border-amber-500"><option value="Licencia Médica">Licencia Médica</option><option value="Extensión de Licencia">Extensión de Licencia</option><option value="Permiso S/G Sueldo">Permiso sin goce de sueldo</option><option value="Permiso Autorizado">Permiso Autorizado</option><option value="Falta Injustificada">Falta Injustificada</option><option value="Incidente">Incidente/Accidente</option><option value="Amonestación">Amonestación</option><option value="Otro">Otro Evento...</option></select>
                          </div>
                          {logForm.tipo === 'Otro' && <input required placeholder="Especificar evento..." value={logForm.customTipo} onChange={e=>setLogForm({...logForm, customTipo:e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white outline-none focus:border-amber-500" />}
                          
                          <div className="bg-slate-950 p-3 rounded-lg border border-slate-800">
                            <div className="flex gap-4 mb-2">
                              <label className="text-[10px] text-slate-300 flex items-center gap-1 cursor-pointer"><input type="radio" checked={logForm.modoFechas === 'rango'} onChange={()=>setLogForm({...logForm, modoFechas:'rango'})} /> Rango</label>
                              <label className="text-[10px] text-slate-300 flex items-center gap-1 cursor-pointer"><input type="radio" checked={logForm.modoFechas === 'unica'} onChange={()=>setLogForm({...logForm, modoFechas:'unica'})} /> Única</label>
                            </div>
                            {logForm.modoFechas === 'rango' ? (
                              <div className="flex gap-2"><input type="date" value={logForm.fechaInicio} onChange={e=>setLogForm({...logForm, fechaInicio:e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs text-white font-mono" /><input type="date" value={logForm.fechaTermino} onChange={e=>setLogForm({...logForm, fechaTermino:e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs text-white font-mono" /></div>
                            ) : <input type="date" value={logForm.fechaUnica} onChange={e=>setLogForm({...logForm, fechaUnica:e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs text-white font-mono" />}
                          </div>

                          <textarea placeholder="Redactar detalles y motivos..." value={logForm.nota} onChange={e=>setLogForm({...logForm, nota:e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-white h-20 resize-none outline-none focus:border-amber-500"></textarea>
                          
                          <div className="bg-slate-950 p-3 rounded-lg border border-slate-800">
                            <input type="file" multiple ref={logFileRef} onChange={handleLogFileChange} className="hidden" />
                            <button type="button" onClick={() => logFileRef.current.click()} className="w-full bg-slate-800 border border-slate-700 text-slate-300 py-2 rounded text-xs font-bold hover:bg-slate-700"><i data-lucide="paperclip" className="w-3 h-3 inline mr-1"></i> Adjuntar Evidencia</button>
                            {logForm.archivos.length > 0 && <div className="mt-2 space-y-1 max-h-20 overflow-y-auto pr-1">{logForm.archivos.map((a,i) => <div key={i} className="text-[9px] bg-slate-900 p-1.5 rounded flex justify-between items-center text-emerald-400"><span className="truncate w-5/6"><i data-lucide="check" className="w-3 h-3 inline mr-1"></i>{a.nombre}</span><button type="button" onClick={()=>handleRemovePendingFile(i)} className="text-red-400"><i data-lucide="x" className="w-3 h-3"></i></button></div>)}</div>}
                          </div>

                          <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-black py-3 rounded-lg font-bold text-xs shadow-lg mt-2"><i data-lucide="save" className="w-4 h-4 inline mr-1"></i> Registrar Evento</button>
                        </form>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* MODAL HOJA GLOBAL */}
              {isGlobalHistoryOpen && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-slate-950/90 backdrop-blur-sm fade-in">
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-5xl h-[90vh] flex flex-col shadow-2xl">
                    <div className="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900 rounded-t-2xl shrink-0">
                      <div className="flex items-center gap-2"><i data-lucide="file-clock" className="text-amber-500 w-5 h-5"></i><h3 className="font-bold text-white text-sm">Consolidado Global de Bitácoras</h3></div>
                      <button onClick={() => setIsGlobalHistoryOpen(false)} className="text-slate-400 hover:text-white bg-slate-800 p-2 rounded-lg"><i data-lucide="x" className="w-4 h-4"></i></button>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto p-4 sm:p-6 bg-slate-950/50">
                      {allGlobalLogs.length === 0 ? <p className="text-center text-slate-500 py-20 text-sm">El sistema no posee observaciones registradas.</p> : (
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                          {allGlobalLogs.map((log, i) => (
                            <div key={i} className="bg-slate-900 p-4 rounded-xl border border-slate-800 hover:border-slate-700">
                              <div className="font-bold text-sm text-white mb-0.5">{log.empleadoNombre}</div>
                              <div className="flex justify-between items-center mb-3">
                                <span className="text-[10px] text-slate-400 font-mono">{log.empleadoRut}</span>
                                <span className="text-[9px] bg-amber-500/10 border border-amber-500/20 text-amber-400 px-2 py-0.5 rounded font-bold">{log.tipo}</span>
                              </div>
                              {log.nota && <p className="text-xs text-slate-300 bg-slate-950 p-2.5 rounded border border-slate-800/50 mb-3 line-clamp-3">{log.nota}</p>}
                              <div className="text-[9px] text-slate-500 flex justify-between items-end border-t border-slate-800 pt-2">
                                <span className="font-mono">{log.fechaInicio}</span>
                                <div className="text-right"><span>Autorizado por:</span><br/><strong className="text-slate-300">{log.autor}</strong></div>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                    
                    <div className="p-4 border-t border-slate-800 flex justify-end gap-3 bg-slate-900 rounded-b-2xl shrink-0">
                      <button onClick={handleDownloadGlobalLogsExcel} className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-lg font-bold text-xs flex items-center gap-2 shadow-lg"><i data-lucide="file-spreadsheet" className="w-4 h-4"></i> Exportar Consolidado (XLSX)</button>
                    </div>
                  </div>
                </div>
              )}

            </div>
          );
        }

        // CARGA SEGURA SIN PANTALLA AZUL (Protección React DOM)
        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('root');
            if (container) {
                try {
                    const root = ReactDOM.createRoot(container);
                    root.render(<App />);
                } catch (e) {
                    console.error("Error crítico UI React:", e);
                    container.innerHTML = '<div style="color:red; padding:40px; text-align:center;">Fallo grave en renderizado. Revisa la consola.</div>';
                }
            }
        });
    </script>
</body>
</html>
