<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Dotación BRAMAQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-24">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const firebaseConfig = {
          apiKey: "AIzaSyD_ZlO3treRtz6ZkjY9V...",
          authDomain: "bramaqcloud.firebaseapp.com",
          projectId: "bramaqcloud",
          storageBucket: "bramaqcloud.appspot.com",
          messagingSenderId: "369713509600",
          appId: "1:369713509600:web:b6d878c..."
        };
        let db;
        try {
          if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
          db = firebase.firestore();
        } catch (e) { console.error(e); }

        function App() {
          const [employees, setEmployees] = useState([]);
          const [loading, setLoading] = useState(true);
          const [onlineStatus, setOnlineStatus] = useState(navigator.onLine);
          const [searchTerm, setSearchTerm] = useState('');
          const [activeTab, setActiveTab] = useState('directorio');
          const [citiesList, setCitiesList] = useState(['Valdivia', 'Lanco', 'Loncoche', 'San José de la Mariquina']);
          const [newCityInput, setNewCityInput] = useState('');
          const [isModalOpen, setIsModalOpen] = useState(false);
          const [currentEmployee, setCurrentEmployee] = useState(null);
          const [formError, setFormError] = useState('');
          const [isHistoryModalOpen, setIsHistoryModalOpen] = useState(false);
          const [selectedEmpForHistory, setSelectedEmpForHistory] = useState(null);
          const [isGlobalHistoryOpen, setIsGlobalHistoryOpen] = useState(false);
          
          const [userSession, setUserSession] = useState({
            nombre: "Juan Pérez (Supervisor)",
            rol: "Supervisor"
          });

          const [formData, setFormData] = useState({
            nombre: '', rut: '', direccion: '', ciudad: 'Valdivia', cargo: '', telefono: '', correo: '', emergenciaNombre: '', emergenciaFono: ''
          });

          // Bitácora avanzada con todas las opciones solicitadas
          const [logForm, setLogForm] = useState({
            tipo: 'Licencia Médica',
            modoFechas: 'rango', // 'rango' o 'unica'
            fechaInicio: new Date().toISOString().split('T')[0],
            fechaTermino: new Date().toISOString().split('T')[0],
            fechaUnica: new Date().toISOString().split('T')[0],
            customTipo: '',
            nota: '',
            archivoNombre: '',
            archivoUrl: ''
          });

          const fileInputRef = useRef(null);
          const logFileRef = useRef(null);

          useEffect(() => {
            const on = () => setOnlineStatus(true), off = () => setOnlineStatus(false);
            window.addEventListener('online', on); window.addEventListener('offline', off);
            if (!db) { setLoading(false); return; }
            const unsub = db.collection('employees').onSnapshot(snap => {
              const items = [];
              snap.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
              setEmployees(items); setLoading(false);
            }, () => setLoading(false));
            return () => { unsub(); window.removeEventListener('online', on); window.removeEventListener('offline', off); };
          }, []);

          useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

          const handleDownloadExcel = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(employees, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `bramaq_dotacion_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
          };

          const handleUploadExcel = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.readAsArrayBuffer(file);
            reader.onload = async (event) => {
              try {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                const jsonSheet = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                if (jsonSheet.length > 0) {
                  if (confirm(`Se detectaron ${jsonSheet.length} filas. ¿Importarlas a la nube?`)) {
                    for (let row of jsonSheet) {
                      const keys = Object.keys(row);
                      const findVal = (terms) => {
                        for (let t of terms) {
                          const foundKey = keys.find(k => k.toLowerCase().includes(t));
                          if (foundKey && row[foundKey] !== undefined) return String(row[foundKey]).trim();
                        }
                        return '';
                      };

                      const nombre = findVal(['nombre', 'personal', 'trabajador', 'empleado']);
                      const rut = findVal(['rut', 'dni', 'cedula']);
                      const cargo = findVal(['cargo', 'rol', 'puesto', 'faena']);
                      const ciudad = findVal(['ciudad', 'comuna', 'ubicacion']) || 'Valdivia';
                      const telefono = findVal(['telefono', 'fono', 'celular', 'contacto', 'sms']);
                      const correo = findVal(['correo', 'email', 'mail']);

                      if (nombre || rut) {
                        await db.collection('employees').add({
                          nombre: nombre || 'Sin Nombre',
                          rut: rut || 'Sin RUT',
                          cargo: cargo || 'OPERADOR',
                          ciudad: ciudad,
                          telefono: telefono,
                          correo: correo,
                          emergenciaNombre: '',
                          emergenciaFono: '',
                          historial: []
                        });
                      }
                    }
                    alert("¡Carga masiva completada!");
                  }
                }
              } catch (err) {
                alert("Error al procesar archivo: " + err.message);
              }
            };
          };

          const handleSave = async (e) => {
            e.preventDefault();
            if (!formData.nombre || !formData.rut) { setFormError("Nombre y RUT obligatorios."); return; }
            try {
              if (currentEmployee) {
                await db.collection('employees').doc(currentEmployee.id).update(formData);
              } else {
                await db.collection('employees').add({ ...formData, historial: [] });
              }
              setIsModalOpen(false); setCurrentEmployee(null);
            } catch (err) { setFormError("Error: " + err.message); }
          };

          const handleDelete = async (id) => {
            if (userSession.rol !== 'Administrativo') { alert("Sin permisos de Administrador."); return; }
            if (confirm("¿Eliminar trabajador?")) await db.collection('employees').doc(id).delete();
          };

          // Manejar subida de foto/archivo en la bitácora
          const handleLogFileChange = (e) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = (uploadEvent) => {
                setLogForm({
                  ...logForm,
                  archivoNombre: file.name,
                  archivoUrl: uploadEvent.target.result // Base64 para visualización directa
                });
              };
              reader.readAsDataURL(file);
            }
          };

          const handleAddLog = async (e) => {
            e.preventDefault();
            if (!selectedEmpForHistory) return;

            const tipoFinal = logForm.tipo === 'Otro' ? (logForm.customTipo || 'Otro evento') : logForm.tipo;

            const logEntry = {
              id: Date.now().toString(),
              tipo: tipoFinal,
              modoFechas: logForm.modoFechas,
              fechaInicio: logForm.modoFechas === 'rango' ? logForm.fechaInicio : logForm.fechaUnica,
              fechaTermino: logForm.modoFechas === 'rango' ? logForm.fechaTermino : logForm.fechaUnica,
              nota: logForm.nota,
              archivoNombre: logForm.archivoNombre,
              archivoUrl: logForm.archivoUrl,
              autor: userSession.nombre,
              rolAutor: userSession.rol,
              createdAt: new Date().toISOString()
            };

            try {
              const updatedHistorial = [...(selectedEmpForHistory.historial || []), logEntry];
              await db.collection('employees').doc(selectedEmpForHistory.id).update({
                historial: updatedHistorial
              });
              
              setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: updatedHistorial });
              setLogForm({
                tipo: 'Licencia Médica',
                modoFechas: 'rango',
                fechaInicio: new Date().toISOString().split('T')[0],
                fechaTermino: new Date().toISOString().split('T')[0],
                fechaUnica: new Date().toISOString().split('T')[0],
                customTipo: '',
                nota: '',
                archivoNombre: '',
                archivoUrl: ''
              });
              alert("Bitácora registrada con éxito.");
            } catch (error) {
              alert("Error al registrar bitácora: " + error.message);
            }
          };

          const filtered = useMemo(() => employees.filter(emp => {
            const s = searchTerm.toLowerCase();
            return (emp.nombre||'').toLowerCase().includes(s) || 
                   (emp.rut||'').toLowerCase().includes(s) || 
                   (emp.cargo||'').toLowerCase().includes(s) || 
                   (emp.ciudad||'').toLowerCase().includes(s);
          }), [employees, searchTerm]);

          const kpis = useMemo(() => ({
            total: employees.length,
            supervisores: employees.filter(e => (e.cargo||'').toUpperCase().includes('SUPERVISOR')).length,
            prevencionistas: employees.filter(e => (e.cargo||'').toUpperCase().includes('PREVENCION')).length,
            incompletos: employees.filter(e => !e.telefono || !e.emergenciaNombre).length
          }), [employees]);

          const allGlobalLogs = useMemo(() => {
            let logs = [];
            employees.forEach(emp => {
              if (emp.historial && emp.historial.length > 0) {
                emp.historial.forEach(h => {
                  logs.push({ ...h, empleadoNombre: emp.nombre, empleadoRut: emp.rut });
                });
              }
            });
            return logs.sort((a, b) => new Date(b.fechaInicio || b.createdAt) - new Date(a.fechaInicio || a.createdAt));
          }, [employees]);

          return (
            <div className="min-h-screen bg-slate-950 text-slate-100 pb-24">
              <div className={`text-center text-[11px] py-1 font-bold ${onlineStatus ? 'bg-emerald-950 text-emerald-400' : 'bg-red-950 text-red-400 animate-pulse'}`}>
                {onlineStatus ? '🟢 Conectado a la Nube (Tiempo Real)' : '🔴 Sin Conexión'}
              </div>

              <header className="px-4 pt-4 pb-2 space-y-3 max-w-7xl mx-auto">
                <div className="flex items-center gap-3">
                  <div className="bg-amber-600 px-3 py-2.5 rounded-2xl text-white font-black text-xs shadow-md">
                    BRAMAQ
                  </div>
                  <div>
                    <h1 className="font-bold text-base leading-tight text-white">Gestor de Dotación BRAMAQ</h1>
                    <span className="text-[10px] text-emerald-400 font-semibold tracking-wide">
                      ● MODO PWA INSTALABLE
                    </span>
                  </div>
                </div>

                <div className="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-2 rounded-2xl text-xs">
                  <span className="text-slate-400 font-medium">Perfil / Usuario:</span>
                  <select 
                    value={userSession.rol} 
                    onChange={e => {
                      const rol = e.target.value;
                      let nombre = "Juan Pérez (Supervisor)";
                      if(rol === "Administrativo") nombre = "María Gómez (RRHH / Admin)";
                      if(rol === "Prevencionista") nombre = "Carlos Ruiz (Prevención)";
                      setUserSession({ nombre, rol });
                    }} 
                    className="bg-slate-950 text-amber-400 font-bold px-2 py-1 rounded-xl border border-slate-700 outline-none w-full"
                  >
                    <option value="Administrativo">Administrativo / RRHH</option>
                    <option value="Supervisor">Supervisor de Faena</option>
                    <option value="Prevencionista">Prevencionista</option>
                  </select>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <button 
                    onClick={() => setActiveTab('dashboard')} 
                    className={`py-2.5 rounded-2xl text-xs font-bold transition-all border ${activeTab === 'dashboard' ? 'bg-slate-900 text-white border-slate-700 shadow' : 'bg-slate-900/40 text-slate-400 border-slate-800'}`}
                  >
                    Panel Gerencial
                  </button>
                  <button 
                    onClick={() => setActiveTab('directorio')} 
                    className={`py-2.5 rounded-2xl text-xs font-bold transition-all border ${activeTab === 'directorio' ? 'bg-amber-600 text-white border-amber-500 shadow-lg' : 'bg-slate-900/40 text-slate-400 border-slate-800'}`}
                  >
                    Directorio y Bitácora
                  </button>
                </div>
              </header>

              <main className="max-w-7xl mx-auto px-4 mt-2">
                {loading ? (
                  <div className="text-center py-20 text-slate-500">Cargando base de datos...</div>
                ) : (
                  <>
                    {activeTab === 'dashboard' && (
                      <div className="space-y-4 pt-2">
                        <div className="grid grid-cols-2 gap-3">
                          <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                            <span className="text-slate-400 text-xs">Total Dotación</span>
                            <span className="text-3xl font-bold text-white mt-1 block">{kpis.total}</span>
                          </div>
                          <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                            <span className="text-slate-400 text-xs">Supervisores</span>
                            <span className="text-3xl font-bold text-indigo-400 mt-1 block">{kpis.supervisores}</span>
                          </div>
                          <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                            <span className="text-slate-400 text-xs">Prevención</span>
                            <span className="text-3xl font-bold text-emerald-400 mt-1 block">{kpis.prevencionistas}</span>
                          </div>
                          <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                            <span className="text-red-400 text-xs">Datos Incompletos</span>
                            <span className="text-3xl font-bold text-red-400 mt-1 block">{kpis.incompletos}</span>
                          </div>
                        </div>
                      </div>
                    )}

                    {activeTab === 'directorio' && (
                      <div className="space-y-3">
                        <div className="relative">
                          <i data-lucide="search" className="absolute left-3.5 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400"></i>
                          <input 
                            type="text" 
                            placeholder="Buscar por operador, ciudad o cargo..." 
                            value={searchTerm} 
                            onChange={e => setSearchTerm(e.target.value)} 
                            className="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-800 text-white rounded-2xl text-xs outline-none focus:border-amber-500 shadow-inner" 
                          />
                        </div>

                        {/* 4 BOTONES EXACTOS */}
                        <div className="grid grid-cols-2 gap-2">
                          <button 
                            onClick={() => setIsGlobalHistoryOpen(true)} 
                            className="bg-indigo-600 hover:bg-indigo-700 text-white py-3 px-3 rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-md transition-all"
                          >
                            <i data-lucide="file-text" className="w-4 h-4"></i> Hoja de Vida Global
                          </button>
                          <button 
                            onClick={handleDownloadExcel} 
                            className="bg-emerald-600 hover:bg-emerald-700 text-white py-3 px-3 rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-md transition-all"
                          >
                            <i data-lucide="download" className="w-4 h-4"></i> Descargar Excel
                          </button>
                          
                          <input type="file" ref={fileInputRef} onChange={handleUploadExcel} accept=".xlsx, .xls, .csv" className="hidden" />
                          <button 
                            onClick={() => fileInputRef.current.click()} 
                            className="bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-800 py-3 px-3 rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-md transition-all"
                          >
                            <i data-lucide="upload" className="w-4 h-4"></i> Cargar Excel
                          </button>
                          <button 
                            onClick={() => {
                              setCurrentEmployee(null);
                              setFormData({nombre: '', rut: '', direccion: '', ciudad: citiesList[0], cargo: '', telefono: '', correo: '', emergenciaNombre: '', emergenciaFono: ''});
                              setIsModalOpen(true);
                            }} 
                            className="bg-amber-600 hover:bg-amber-700 text-white py-3 px-3 rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-md transition-all"
                          >
                            <i data-lucide="user-plus" className="w-4 h-4"></i> Nuevo Ingreso
                          </button>
                        </div>

                        <div className="space-y-3 mt-3">
                          {filtered.length === 0 ? (
                            <div className="p-8 text-center text-slate-500 text-xs bg-slate-900 rounded-2xl border border-slate-800">No se encontraron registros.</div>
                          ) : (
                            filtered.map(emp => (
                              <div key={emp.id} className="bg-slate-900 border border-slate-800/80 rounded-2xl p-4 shadow-xl flex items-center justify-between gap-3">
                                <div className="space-y-1 w-1/3 truncate">
                                  <div className="font-bold text-white text-sm leading-snug">{emp.nombre}</div>
                                  <div className="text-[11px] text-slate-400 font-mono">{emp.rut}</div>
                                  <button 
                                    onClick={() => { setSelectedEmpForHistory(emp); setIsHistoryModalOpen(true); }}
                                    className="text-[10px] text-amber-400 bg-amber-950/60 px-2 py-0.5 rounded-lg border border-amber-900 inline-flex items-center gap-1 font-semibold mt-1"
                                  >
                                    📝 Bitácora ({emp.historial ? emp.historial.length : 0})
                                  </button>
                                </div>

                                <div className="w-1/3 text-center flex flex-col items-center justify-center">
                                  <span className="px-2.5 py-1.5 rounded-xl text-[10px] font-bold bg-amber-950/90 text-amber-300 border border-amber-900 block truncate max-w-full shadow-inner">
                                    {emp.cargo || 'SIN CARGO'}
                                  </span>
                                  <div className="text-[10px] text-slate-400 mt-1.5 flex items-center gap-1 truncate">
                                    📍 {emp.ciudad}
                                  </div>
                                </div>

                                <div className="w-1/3 text-right flex flex-col items-end gap-1.5">
                                  <span className="text-xs font-bold text-slate-200">{emp.telefono || 'Sin fono'}</span>
                                  {emp.telefono && (
                                    <a href={`tel:${emp.telefono}`} className="bg-blue-950/80 text-blue-400 px-2.5 py-1 rounded-xl text-[10px] font-bold border border-blue-900 flex items-center gap-1 shadow">
                                      📞 Llamar
                                    </a>
                                  )}
                                  <div className="flex gap-2 mt-1">
                                    <button onClick={() => { setCurrentEmployee(emp); setFormData(emp); setIsModalOpen(true); }} className="text-[10px] text-slate-400 hover:text-amber-400 font-semibold">Editar</button>
                                    {userSession.rol === 'Administrativo' && (
                                      <button onClick={() => handleDelete(emp.id)} className="text-[10px] text-slate-400 hover:text-red-400 font-semibold">Eliminar</button>
                                    )}
                                  </div>
                                </div>
                              </div>
                            ))
                          )}
                        </div>
                      </div>
                    )}
                  </>
                )}
              </main>

              {/* MODAL NUEVO / EDITAR TRABAJADOR */}
              {isModalOpen && (
                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                  <div className="bg-slate-900 p-5 rounded-3xl w-full max-w-lg border border-slate-800 space-y-3 my-auto">
                    <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                      <h3 className="font-bold text-sm text-white">{currentEmployee ? 'Editar Ficha' : 'Nuevo Ingreso de Personal'}</h3>
                      <button onClick={() => setIsModalOpen(false)} className="text-slate-400"><i data-lucide="x" className="w-5 h-5"></i></button>
                    </div>
                    {formError && <div className="text-red-400 text-xs">{formError}</div>}
                    <form onSubmit={handleSave} className="space-y-2.5 text-xs">
                      <div>
                        <label className="text-[10px] text-slate-400 font-bold">Nombre Completo *</label>
                        <input required placeholder="Ej: Juan Pérez" value={formData.nombre} onChange={e=>setFormData({...formData, nombre:e.target.value})} className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs outline-none focus:border-amber-500" />
                      </div>
                      <div>
                        <label className="text-[10px] text-slate-400 font-bold">RUT *</label>
                        <input required placeholder="12.345.678-9" value={formData.rut} onChange={e=>setFormData({...formData, rut:e.target.value})} className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs outline-none focus:border-amber-500" />
                      </div>
                      <div>
                        <label className="text-[10px] text-slate-400 font-bold">Cargo / Faena</label>
                        <input placeholder="Ej: OPERADOR CARGADOR FRONTAL" value={formData.cargo} onChange={e=>setFormData({...formData, cargo:e.target.value})} className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs outline-none focus:border-amber-500" />
                      </div>
                      <div>
                        <label className="text-[10px] text-slate-400 font-bold">Ciudad</label>
                        <select value={formData.ciudad} onChange={e=>setFormData({...formData, ciudad:e.target.value})} className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs outline-none focus:border-amber-500">
                          {citiesList.map(c=><option key={c} value={c}>{c}</option>)}
                        </select>
                      </div>
                      <div className="flex gap-2">
                        <input placeholder="Añadir otra ciudad" value={newCityInput} onChange={e=>setNewCityInput(e.target.value)} className="w-full p-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white" />
                        <button type="button" onClick={()=>{if(newCityInput){setCitiesList([...citiesList, newCityInput]);setFormData({...formData, ciudad:newCityInput});setNewCityInput('');}}} className="bg-slate-800 px-3 py-1 rounded-xl text-xs text-amber-400 font-bold">Añadir</button>
                      </div>
                      <div>
                        <label className="text-[10px] text-slate-400 font-bold">Teléfono</label>
                        <input placeholder="+569..." value={formData.telefono} onChange={e=>setFormData({...formData, telefono:e.target.value})} className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs outline-none" />
                      </div>
                      <div>
                        <label className="text-[10px] text-slate-400 font-bold">Correo</label>
                        <input placeholder="correo@bramaq.cl" value={formData.correo} onChange={e=>setFormData({...formData, correo:e.target.value})} className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs outline-none" />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <input placeholder="Contacto Emergencia" value={formData.emergenciaNombre} onChange={e=>setFormData({...formData, emergenciaNombre:e.target.value})} className="p-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs" />
                        <input placeholder="Fono Emergencia" value={formData.emergenciaFono} onChange={e=>setFormData({...formData, emergenciaFono:e.target.value})} className="p-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs" />
                      </div>
                      <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                        <button type="button" onClick={()=>setIsModalOpen(false)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Cancelar</button>
                        <button type="submit" className="px-5 py-2 bg-amber-600 text-white font-bold rounded-xl shadow">Guardar</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {/* MODAL BITÁCORA / HOJA DE VIDA AVANZADA */}
              {isHistoryModalOpen && selectedEmpForHistory && (
                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                  <div className="bg-slate-900 p-5 rounded-3xl w-full max-w-lg border border-slate-800 space-y-3 my-auto max-h-[90vh] overflow-y-auto">
                    <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                      <div>
                        <h3 className="font-bold text-sm text-white">Hoja de Vida / Bitácora: {selectedEmpForHistory.nombre}</h3>
                        <span className="text-[10px] text-slate-400 font-mono">{selectedEmpForHistory.rut}</span>
                      </div>
                      <button onClick={() => setIsHistoryModalOpen(false)} className="text-slate-400"><i data-lucide="x" className="w-5 h-5"></i></button>
                    </div>

                    {/* LISTADO DE EVENTOS EXISTENTES CON VISUALIZACIÓN DE AUTOR (SUPERVISOR, PREVENCIÓN, RRHH) */}
                    <div className="space-y-2 max-h-48 overflow-y-auto text-xs pr-1">
                      {(!selectedEmpForHistory.historial || selectedEmpForHistory.historial.length === 0) ? (
                        <p className="text-slate-500 text-center py-4">Sin registros en la hoja de vida.</p>
                      ) : (
                        selectedEmpForHistory.historial.map(h => (
                          <div key={h.id} className="bg-slate-950 p-3 rounded-2xl border border-slate-800 space-y-1.5">
                            <div className="flex justify-between items-center">
                              <span className="font-bold text-amber-400 text-xs">{h.tipo}</span>
                              <span className="text-[10px] text-slate-400 font-mono">
                                {h.modoFechas === 'unica' ? `Día: ${h.fechaInicio}` : `Del ${h.fechaInicio} al ${h.fechaTermino}`}
                              </span>
                            </div>
                            {h.nota && <p className="text-slate-300 text-xs">{h.nota}</p>}
                            {h.archivoUrl && (
                              <div className="mt-1">
                                {h.archivoUrl.startsWith('data:image') ? (
                                  <img src={h.archivoUrl} alt="Adjunto" className="max-h-24 rounded-lg border border-slate-700 mt-1" />
                                ) : (
                                  <a href={h.archivoUrl} download={h.archivoName || "archivo_adjunto"} className="text-xs text-blue-400 underline flex items-center gap-1">
                                    📎 Descargar archivo adjunto
                                  </a>
                                )}
                              </div>
                            )}
                            <div className="text-[10px] text-slate-400 text-right pt-1 border-t border-slate-900 flex justify-between">
                              <span className="text-indigo-400 font-medium">Registrado por: {h.autor}</span>
                              <span className="uppercase text-[9px] bg-slate-900 px-2 py-0.5 rounded text-slate-300 font-bold">{h.rolAutor}</span>
                            </div>
                          </div>
                        ))
                      )}
                    </div>

                    {/* FORMULARIO AVANZADO PARA NUEVA ENTRADA EN LA HOJA DE VIDA */}
                    <form onSubmit={handleAddLog} className="space-y-2.5 text-xs pt-3 border-t border-slate-800">
                      <div className="text-[11px] font-bold text-amber-400">Agregar Evento a la Hoja de Vida:</div>
                      
                      <div>
                        <label className="text-[10px] text-slate-400 font-bold">Tipo de Evento</label>
                        <select 
                          value={logForm.tipo} 
                          onChange={e => setLogForm({...logForm, tipo: e.target.value})} 
                          className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs"
                        >
                          <option value="Licencia Médica">Licencia Médica</option>
                          <option value="Extensión de Licencia">Extensión de Licencia</option>
                          <option value="Permiso sin goce de sueldo">Permiso sin goce de sueldo</option>
                          <option value="Enmendaduras">Enmendaduras</option>
                          <option value="Falta a Reunión">Falta a Reunión</option>
                          <option value="Incidente">Incidente</option>
                          <option value="Otro">Otro (Escribir opción...)</option>
                        </select>
                      </div>

                      {logForm.tipo === 'Otro' && (
                        <div>
                          <label className="text-[10px] text-slate-400 font-bold">Especificar otro evento</label>
                          <input 
                            type="text" 
                            placeholder="Ej: Felicitación, Capacitación..." 
                            value={logForm.customTipo} 
                            onChange={e => setLogForm({...logForm, customTipo: e.target.value})} 
                            className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs" 
                          />
                        </div>
                      )}

                      <div>
                        <label className="text-[10px] text-slate-400 font-bold">Duración / Fechas</label>
                        <div className="flex gap-2 mt-1 mb-2">
                          <label className="flex items-center gap-1 cursor-pointer">
                            <input 
                              type="radio" 
                              name="modoFechas" 
                              checked={logForm.modoFechas === 'rango'} 
                              onChange={() => setLogForm({...logForm, modoFechas: 'rango'})} 
                            /> Rango de fechas (Inicio y Término)
                          </label>
                          <label className="flex items-center gap-1 cursor-pointer">
                            <input 
                              type="radio" 
                              name="modoFechas" 
                              checked={logForm.modoFechas === 'unica'} 
                              onChange={() => setLogForm({...logForm, modoFechas: 'unica'})} 
                            /> Fecha única (Día exacto)
                          </label>
                        </div>

                        {logForm.modoFechas === 'rango' ? (
                          <div className="flex gap-2">
                            <div className="w-1/2">
                              <span className="text-[9px] text-slate-500">Fecha Inicio</span>
                              <input type="date" value={logForm.fechaInicio} onChange={e=>setLogForm({...logForm, fechaInicio:e.target.value})} className="w-full p-1.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs" />
                            </div>
                            <div className="w-1/2">
                              <span className="text-[9px] text-slate-500">Fecha Término</span>
                              <input type="date" value={logForm.fechaTermino} onChange={e=>setLogForm({...logForm, fechaTermino:e.target.value})} className="w-full p-1.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs" />
                            </div>
                          </div>
                        ) : (
                          <div>
                            <span className="text-[9px] text-slate-500">Día en que ocurrió</span>
                            <input type="date" value={logForm.fechaUnica} onChange={e=>setLogForm({...logForm, fechaUnica:e.target.value})} className="w-full p-1.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs" />
                          </div>
                        )}
                      </div>

                      <div>
                        <label className="text-[10px] text-slate-400 font-bold">Cuadro de Observación (Opcional)</label>
                        <textarea 
                          placeholder="Escriba comentarios, detalles o acuerdos..." 
                          value={logForm.nota} 
                          onChange={e=>setLogForm({...logForm, nota:e.target.value})} 
                          className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs" 
                          rows="2"
                        ></textarea>
                      </div>

                      <div>
                        <label className="text-[10px] text-slate-400 font-bold">Subir Foto o Archivos Varios</label>
                        <input 
                          type="file" 
                          ref={logFileRef} 
                          onChange={handleLogFileChange} 
                          accept="image/*,application/pdf,.doc,.docx" 
                          className="w-full mt-1 text-[11px] text-slate-400 file:mr-2 file:py-1 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700 cursor-pointer" 
                        />
                        {logForm.archivoNombre && <span className="text-[10px] text-emerald-400 mt-1 block">📎 Adjunto listo: {logForm.archivoNombre}</span>}
                      </div>

                      <div className="flex justify-end gap-2 pt-2">
                        <button type="button" onClick={()=>setIsHistoryModalOpen(false)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Cerrar</button>
                        <button type="submit" className="px-5 py-2 bg-amber-600 text-white font-bold rounded-xl shadow">Registrar en Bitácora</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {/* MODAL HOJA DE VIDA GLOBAL */}
              {isGlobalHistoryOpen && (
                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                  <div className="bg-slate-900 p-5 rounded-3xl w-full max-w-2xl border border-slate-800 space-y-3 my-auto">
                    <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                      <div>
                        <h3 className="font-bold text-sm text-white">Hoja de Vida Global (Consolidado de Bitácoras)</h3>
                        <span className="text-[10px] text-amber-400 font-semibold">Registro histórico por supervisores, administrativo y prevención</span>
                      </div>
                      <button onClick={() => setIsGlobalHistoryOpen(false)} className="text-slate-400"><i data-lucide="x" className="w-5 h-5"></i></button>
                    </div>

                    <div className="space-y-2.5 max-h-80 overflow-y-auto text-xs pr-1">
                      {allGlobalLogs.length === 0 ? (
                        <p className="text-slate-500 text-center py-8">No hay observaciones registradas en ningún trabajador.</p>
                      ) : (
                        allGlobalLogs.map((log, idx) => (
                          <div key={idx} className="bg-slate-950 p-3 rounded-2xl border border-slate-800 space-y-1">
                            <div className="flex justify-between items-center">
                              <span className="font-bold text-white">{log.empleadoNombre} <span className="text-[10px] text-slate-400 font-mono">({log.empleadoRut})</span></span>
                              <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-950 text-amber-300 border border-amber-900">{log.tipo}</span>
                            </div>
                            {log.nota && <p className="text-slate-300 text-xs mt-1">{log.nota}</p>}
                            <div className="flex justify-between text-[10px] text-slate-500 pt-1 border-t border-slate-900 mt-2">
                              <span>Fecha: {log.fechaInicio}</span>
                              <span className="text-indigo-400 font-bold">Agregado por: {log.autor} ({log.rolAutor})</span>
                            </div>
                          </div>
                        ))
                      )}
                    </div>

                    <div className="flex justify-end pt-2 border-t border-slate-800">
                      <button onClick={() => setIsGlobalHistoryOpen(false)} className="px-5 py-2 bg-slate-800 text-slate-300 font-bold rounded-xl">Cerrar</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
