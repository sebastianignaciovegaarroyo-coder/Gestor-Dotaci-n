<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BRAMAQ">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3200/3200424.png">
    
    <title>Gestor de Dotación BRAMAQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
        });
      }
    </script>
</head>
<body class="bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const firebaseConfig = {
          apiKey: "AIzaSyD_ZlO3treRtz6ZkjY9Vr69wJz2vA...",
          authDomain: "bramaqcloud.firebaseapp.com",
          projectId: "bramaqcloud",
          storageBucket: "bramaqcloud.appspot.com",
          messagingSenderId: "369713509600",
          appId: "1:369713509600:web:b6d878c..."
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function App() {
          const [deferredPrompt, setDeferredPrompt] = useState(null);

          useEffect(() => {
            window.addEventListener('beforeinstallprompt', (e) => {
              e.preventDefault();
              setDeferredPrompt(e);
            });
          }, []);

          const handleInstall = () => {
            if (deferredPrompt) {
              deferredPrompt.prompt();
              setDeferredPrompt(null);
            } else {
              alert("Para instalar: En el menú del navegador, busca 'Instalar aplicación' o 'Agregar a pantalla de inicio'.");
            }
          };

          return (
            <div className="flex flex-col items-center justify-center min-h-screen p-4">
              <h1 className="text-2xl font-bold mb-6">BRAMAQ App</h1>
              <button 
                onClick={handleInstall}
                className="bg-emerald-600 px-6 py-3 rounded-xl font-bold text-white shadow-lg"
              >
                Instalar Aplicación
              </button>
            </div>
          );
        }
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
