<!DOCTYPE html>
<html lang="es" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/Gestor-Dotaci-n/">
    <title>Gestor de Dotación BRAMAQ - Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f1f5f9; margin: 0; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(30, 41, 59, 0.8); }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        #root { min-height: 100vh; }
    </style>
</head>
<body class="antialiased selection:bg-amber-500/30 selection:text-amber-200" translate="no">
    <div id="root">
        <div style="display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; color:#f59e0b; font-weight:bold; background:#020617; font-family:sans-serif;">
            Iniciando BRAMAQ Enterprise...
        </div>
    </div>
    
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        
        const firebaseConfig = {
          apiKey: "AIzaSyD_ZlO3treRtz6ZkjY9Vr69wJz2vA...",
          authDomain: "bramaqcloud.firebaseapp.com",
          projectId: "bramaqcloud",
          storageBucket: "bramaqcloud.appspot.com",
          messagingSenderId: "369713509600",
          appId: "1:369713509600:web:b6d878c..."
        };

        let db;
        try {
          if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
          db = firebase.firestore();
        } catch (e) { console.error("Error iniciando Firebase:", e); }

        function App() {
          const [hasEntered, setHasEntered] = useState(false);
          const [gateProfile, setGateProfile] = useState('');
          const [userSession, setUserSession] = useState({ rol: "" });

          const [employees, setEmployees] = useState([]);
          const [loading, setLoading] = useState(true);
          const [onlineStatus, setOnlineStatus] = useState(navigator.onLine);
          const [searchTerm, setSearchTerm] = useState('');
          const [activeTab, setActiveTab] = useState('dashboard');
          const [activeFilter, setActiveFilter] = useState('TODOS');
          const [citiesList, setCitiesList] = useState(['Loncoche', 'Lanco', 'Valdivia', 'San José de la Mariquina', 'Los Lagos', 'Malalhue', 'Ciruelos', 'Panguipulli', 'Mariquina']);
          const [newCityInput, setNewCityInput] = useState('');
          
          const [isModalOpen, setIsModalOpen] = useState(false);
          const [currentEmployee, setCurrentEmployee] = useState(null);
          const [formError, setFormError] = useState('');
          
          const [isHistoryModalOpen, setIsHistoryModalOpen] = useState(false);
          const [selectedEmpForHistory, setSelectedEmpForHistory] = useState(null);
          const [isGlobalHistoryOpen, setIsGlobalHistoryOpen] = useState(false);

          const [selectedPhone, setSelectedPhone] = useState(null);

          const [formData, setFormData] = useState({
            nombre: '', rut: '', direccion: '', ciudad: 'Valdivia', cargo: 'OPERADOR GRUA HORQUILLA', telefono: '', correo: '', emergenciaNombre: '', emergenciaFono: '',
            documentos: { contrato: true, induccion: true, examenes: true, epp: true }
          });

          const supervisorsList = useMemo(() => {
            const list = employees
              .filter(e => (e.cargo || '').toUpperCase().includes('SUPERVISOR'))
              .map(e => e.nombre);
            return list.length > 0 ? list : ['Briones Victor', 'Nahuelpan Nahuelpan Reinaldo Patricio', 'Rubilar Rubilar Daniel Joel'];
          }, [employees]);

          const [logForm, setLogForm] = useState({
            tipo: 'Licencia Médica', modoFechas: 'rango', fechaInicio: new Date().toISOString().split('T')[0], fechaTermino: new Date().toISOString().split('T')[0], fechaUnica: new Date().toISOString().split('T')[0],
            customTipo: '', nota: '', archivos: [], 
            autorBitacora: '', rolBitacora: ''
          });

          const syncProfileLogic = (rolActivo) => {
            if (rolActivo === 'Administrativo') {
              setLogForm(prev => ({ ...prev, autorBitacora: 'Administrativo / RRHH', rolBitacora: 'Administrativo' }));
            } else if (rolActivo === 'AdminContrato') {
              setLogForm(prev => ({ ...prev, autorBitacora: 'Administrador de Contrato', rolBitacora: 'AdminContrato' }));
            } else if (rolActivo === 'Prevencionista') {
              setLogForm(prev => ({ ...prev, autorBitacora: 'Prevencionista de Riesgos', rolBitacora: 'Prevencionista' }));
            } else if (rolActivo === 'Supervisor') {
              const defaultSup = supervisorsList[0] || 'Briones Victor';
              setLogForm(prev => ({ ...prev, autorBitacora: defaultSup, rolBitacora: 'Supervisor' }));
            }
          };

          useEffect(() => {
            if (hasEntered) syncProfileLogic(userSession.rol);
          }, [userSession.rol, supervisorsList, hasEntered]);

          const fileInputRef = useRef(null);
          const logFileRef = useRef(null);

          useEffect(() => {
            const on = () => setOnlineStatus(true), off = () => setOnlineStatus(false);
            window.addEventListener('online', on); window.addEventListener('offline', off);
            
            if (!hasEntered || !db) return;
            
            setLoading(true);
            const unsub = db.collection('employees').onSnapshot(snap => {
              const items = [];
              snap.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
              setEmployees(items); 
              setLoading(false);
            }, (error) => {
              console.error("Error cargando base de datos:", error);
              setLoading(false);
            });
            return () => { unsub(); window.removeEventListener('online', on); window.removeEventListener('offline', off); };
          }, [hasEntered]);

          useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

          const handleEnterApp = () => {
            if (!gateProfile) return;
            setUserSession({ rol: gateProfile });
            syncProfileLogic(gateProfile);
            setHasEntered(true);
          };

          const handleDownloadExcel = () => {
            try {
              if (!employees || employees.length === 0) {
                alert("No hay trabajadores registrados en la base de datos para exportar.");
                return;
              }
              const exportData = employees.map(emp => ({
                "Nombre": emp.nombre || "",
                "RUT": emp.rut || "",
                "Cargo": emp.cargo || "",
                "Ciudad": emp.ciudad || "",
                "Dirección": emp.direccion || "",
                "Teléfono": emp.telefono || "",
                "Correo": emp.correo || "",
                "Contacto de Emergencia": emp.emergenciaNombre || "",
                "Teléfono Emergencia": emp.emergenciaFono || "",
                "Contrato": emp.documentos?.contrato ? "Completo" : "Pendiente",
                "Inducción S.S.O.": emp.documentos?.induccion ? "Completo" : "Pendiente",
                "Exámenes Ocupacionales": emp.documentos?.examenes ? "Completo" : "Pendiente",
                "EPP": emp.documentos?.epp ? "Completo" : "Pendiente"
              }));

              const ws = XLSX.utils.json_to_sheet(exportData);
              const wb = XLSX.utils.book_new();
              XLSX.utils.book_append_sheet(wb, ws, "Dotacion Completa");
              const dateStr = new Date().toISOString().split('T')[0];
              XLSX.writeFile(wb, `BRAMAQ_Dotacion_Completa_${dateStr}.xlsx`);
              alert("Descarga realizada correctamente.");
            } catch (error) {
              alert("Error al generar la descarga: " + error.message);
              console.error(error);
            }
          };

          const handleDownloadGlobalLogsExcel = () => {
            try {
              let logsToExport = [];
              employees.forEach(emp => {
                if (emp.historial && emp.historial.length > 0) {
                  emp.historial.forEach(h => {
                    let attachmentsText = "Ninguno";
                    if (h.archivos && h.archivos.length > 0) {
                      attachmentsText = h.archivos.map(a => a.nombre).join(", ");
                    } else if (h.archivoNombre) {
                      attachmentsText = h.archivoNombre; 
                    }
                    logsToExport.push({
                      "Trabajador": emp.nombre || "Desconocido",
                      "RUT": emp.rut || "",
                      "Cargo": emp.cargo || "",
                      "Tipo de Evento": h.tipo || "",
                      "Fecha Inicio": h.fechaInicio || "",
                      "Fecha Término": h.fechaTermino || "",
                      "Observación": h.nota || "",
                      "Autor": h.autor || "",
                      "Perfil del Autor": h.rolAutor || "",
                      "Fecha de Registro": new Date(h.createdAt || h.fechaInicio).toLocaleString('es-CL'),
                      "Archivo Adjunto": attachmentsText
                    });
                  });
                }
              });

              if (logsToExport.length === 0) {
                alert("No hay registros ni observaciones en la bitácora para descargar.");
                return;
              }

              logsToExport.sort((a, b) => new Date(b["Fecha de Registro"]) - new Date(a["Fecha de Registro"]));

              const ws = XLSX.utils.json_to_sheet(logsToExport);
              const wb = XLSX.utils.book_new();
              XLSX.utils.book_append_sheet(wb, ws, "Hoja de Vida Global");
              const dateStr = new Date().toISOString().split('T')[0];
              XLSX.writeFile(wb, `BRAMAQ_Hoja_de_Vida_Global_${dateStr}.xlsx`);
              alert("Descarga realizada correctamente.");
            } catch (error) {
              alert("Error al generar la descarga: " + error.message);
              console.error(error);
            }
          };

          const handleDeleteAllData = async () => {
            if (userSession.rol !== 'Administrativo' && userSession.rol !== 'AdminContrato') {
              alert("Sin permisos suficientes para realizar borrado masivo."); return;
            }
            if (confirm("⚠️ ACCIÓN CRÍTICA: ¿Estás seguro de vaciar toda la base de datos para cargar desde cero?")) {
              try {
                const batchSize = 400;
                let snapshot = await db.collection('employees').limit(batchSize).get();
                while (!snapshot.empty) {
                  const batch = db.batch();
                  snapshot.docs.forEach(doc => batch.delete(doc.ref));
                  await batch.commit();
                  snapshot = await db.collection('employees').limit(batchSize).get();
                }
                alert("Base de datos vaciada con éxito.");
              } catch (err) { alert("Error: " + err.message); }
            }
          };

          const handleUploadExcel = (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader(); reader.readAsArrayBuffer(file);
            reader.onload = async (event) => {
              try {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                const jsonSheet = XLSX.utils.sheet_to_json(worksheet, { defval: "", range: 1 });

                if (jsonSheet.length > 0) {
                  let addedCount = 0; let duplicateCount = 0;
                  let existingRuts = new Set(employees.map(emp => (emp.rut || '').trim().toLowerCase().replace(/[^0-9kK]/g, '')));

                  if (confirm(`Se leyeron ${jsonSheet.length} registros. ¿Importar omitiendo duplicados por RUT?`)) {
                    for (let row of jsonSheet) {
                      const keys = Object.keys(row);
                      const findVal = (terms) => {
                        for (let t of terms) {
                          const foundKey = keys.find(k => k.toLowerCase().includes(t));
                          if (foundKey && row[foundKey] !== undefined) return String(row[foundKey]).trim();
                        } return '';
                      };
                      const nombre = findVal(['nombre']); const rut = findVal(['rut']); const direccion = findVal(['direccion']); const ciudad = findVal(['ciudad']) || 'Valdivia'; const cargo = findVal(['cargo']); const telefono = findVal(['n telefonico', 'telefono', 'fono', 'celular']); const correo = findVal(['correo', 'email']); const emergenciaNombre = findVal(['nombre emergencia', 'emergencia', 'contacto emergencia']); const emergenciaFono = findVal(['fono emergencia', 'telefono emergencia', 'emergencia fono']);
                      const cleanRut = (rut || '').trim().toLowerCase().replace(/[^0-9kK]/g, '');

                      if ((nombre || rut) && cleanRut) {
                        if (!existingRuts.has(cleanRut)) {
                          await db.collection('employees').add({
                            nombre: nombre || 'Sin Nombre', rut: rut || 'Sin RUT', direccion: direccion || '', ciudad: ciudad, cargo: cargo || 'OPERADOR GRUA HORQUILLA', telefono: telefono, correo: correo, emergenciaNombre: emergenciaNombre, emergenciaFono: emergenciaFono,
                            documentos: { contrato: true, induccion: true, examenes: true, epp: true }, historial: []
                          });
                          existingRuts.add(cleanRut); addedCount++;
                        } else { duplicateCount++; }
                      }
                    }
                    alert(`¡Importación completada!\n- Agregados: ${addedCount}\n- Duplicados omitidos: ${duplicateCount}`);
                  }
                }
              } catch (err) { alert("Error: " + err.message); }
            };
          };

          const handleSave = async (e) => {
            e.preventDefault();
            if (!formData.nombre || !formData.rut) { setFormError("El Nombre y RUT son obligatorios."); return; }
            try {
              if (currentEmployee) {
                await db.collection('employees').doc(currentEmployee.id).update(formData);
              } else {
                await db.collection('employees').add({ ...formData, historial: [] });
              }
              setIsModalOpen(false); setCurrentEmployee(null);
            } catch (err) { setFormError("Error: " + err.message); }
          };

          const handleDelete = async (id) => {
            if (userSession.rol !== 'Administrativo' && userSession.rol !== 'AdminContrato') { alert("Sin permisos suficientes."); return; }
            if (confirm("¿Eliminar este trabajador permanentemente del sistema?")) await db.collection('employees').doc(id).delete();
          };

          const handleLogFileChange = (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            const newArchivos = [];
            let processed = 0;

            files.forEach(file => {
              const reader = new FileReader();
              reader.onload = (uploadEvent) => {
                newArchivos.push({
                  nombre: file.name,
                  tipo: file.type,
                  url: uploadEvent.target.result,
                  fechaCarga: new Date().toISOString()
                });
                processed++;
                if (processed === files.length) {
                  setLogForm(prev => ({
                    ...prev,
                    archivos: [...(prev.archivos || []), ...newArchivos]
                  }));
                }
              };
              reader.readAsDataURL(file);
            });
            if (logFileRef.current) logFileRef.current.value = "";
          };

          const handleRemovePendingFile = (indexToRemove) => {
            setLogForm(prev => ({
              ...prev,
              archivos: prev.archivos.filter((_, idx) => idx !== indexToRemove)
            }));
          };

          const handleDeleteSavedAttachment = async (logId, attachmentIndex, isOldFormat) => {
            if (!selectedEmpForHistory) return;
            if (confirm("¿Está seguro de eliminar este archivo adjunto? (No eliminará la observación)")) {
              try {
                const updatedHistorial = selectedEmpForHistory.historial.map(h => {
                  if (h.id === logId) {
                    if (isOldFormat) {
                      return { ...h, archivoUrl: '', archivoNombre: '' };
                    } else {
                      const newArchivos = h.archivos.filter((_, i) => i !== attachmentIndex);
                      return { ...h, archivos: newArchivos };
                    }
                  }
                  return h;
                });
                await db.collection('employees').doc(selectedEmpForHistory.id).update({ historial: updatedHistorial });
                setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: updatedHistorial });
              } catch (err) { alert("Error al eliminar archivo: " + err.message); }
            }
          };

          const handleDeleteLog = async (logId) => {
            if (!selectedEmpForHistory) return;
            if (confirm("¿Estás seguro de eliminar completamente esta observación del historial?")) {
              try {
                const updatedHistorial = (selectedEmpForHistory.historial || []).filter(h => h.id !== logId);
                await db.collection('employees').doc(selectedEmpForHistory.id).update({ historial: updatedHistorial });
                setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: updatedHistorial });
              } catch (err) { alert("Error al eliminar la bitácora: " + err.message); }
            }
          };

          const handleAddLog = async (e) => {
            e.preventDefault();
            if (!selectedEmpForHistory) return;
            const tipoFinal = logForm.tipo === 'Otro' ? (logForm.customTipo || 'Otro evento') : logForm.tipo;
            
            const logEntry = {
              id: String(Date.now()), 
              tipo: String(tipoFinal), 
              modoFechas: String(logForm.modoFechas),
              fechaInicio: String(logForm.modoFechas === 'rango' ? logForm.fechaInicio : logForm.fechaUnica),
              fechaTermino: String(logForm.modoFechas === 'rango' ? logForm.fechaTermino : logForm.fechaUnica),
              nota: String(logForm.nota || ''), 
              archivos: logForm.archivos || [], 
              autor: String(logForm.autorBitacora), 
              rolAutor: String(logForm.rolBitacora), 
              createdAt: new Date().toISOString()
            };

            try {
              const updatedHistorial = [...(selectedEmpForHistory.historial || []), logEntry];
              await db.collection('employees').doc(selectedEmpForHistory.id).update({ historial: updatedHistorial });
              setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: updatedHistorial });
              
              setLogForm({
                tipo: 'Licencia Médica', modoFechas: 'rango', fechaInicio: new Date().toISOString().split('T')[0], fechaTermino: new Date().toISOString().split('T')[0], fechaUnica: new Date().toISOString().split('T')[0],
                customTipo: '', nota: '', archivos: [],
                autorBitacora: userSession.rol === 'Supervisor' ? (supervisorsList[0] || '') : logForm.autorBitacora,
                rolBitacora: userSession.rol
              });
              alert("Bitácora registrada con éxito.");
            } catch (error) { alert("Error al registrar: " + error.message); }
          };

          const getMissingDataList = (emp) => {
            let missing = [];
            if (!emp.telefono) missing.push("Teléfono");
            if (!emp.correo) missing.push("Correo");
            if (!emp.emergenciaNombre || !emp.emergenciaFono) missing.push("Emergencia");
            if (emp.documentos) {
              if (!emp.documentos.contrato) missing.push("Contrato");
              if (!emp.documentos.induccion) missing.push("Inducción");
              if (!emp.documentos.examenes) missing.push("Exámenes");
              if (!emp.documentos.epp) missing.push("EPP");
            }
            return missing;
          };

          const filtered = useMemo(() => {
            const seenRuts = new Set(); const uniqueEmployees = [];
            for (const emp of employees) {
              const cleanR = (emp.rut || '').trim().toLowerCase().replace(/[^0-9kK]/g, '');
              if (cleanR) { if (!seenRuts.has(cleanR)) { seenRuts.add(cleanR); uniqueEmployees.push(emp); } } 
              else { uniqueEmployees.push(emp); }
            }
            const list = uniqueEmployees.filter(emp => {
              const s = searchTerm.toLowerCase();
              const matchSearch = (emp.nombre||'').toLowerCase().includes(s) || (emp.rut||'').toLowerCase().includes(s) || (emp.cargo||'').toLowerCase().includes(s) || (emp.ciudad||'').toLowerCase().includes(s);
              if (!matchSearch) return false;
              if (activeFilter === 'TODOS') return true;
              if (activeFilter === 'INCOMPLETOS') return getMissingDataList(emp).length > 0;
              if (activeFilter === 'ADMIN_CONTRATO') { const c = (emp.cargo || '').toUpperCase(); return c.includes('ADMINISTRADOR DE CONTRATO') || c.includes('ADMIN. CONTRATO') || c.includes('ADMINISTRADOR'); }
              if (activeFilter === 'SUPERVISORES') return (emp.cargo||'').toUpperCase().includes('SUPERVISOR');
              if (activeFilter === 'PREVENCIONISTAS') return (emp.cargo||'').toUpperCase().includes('PREVENCION');
              if (activeFilter === 'ADMINISTRATIVOS') return (emp.cargo||'').toUpperCase().includes('ADMINISTRATIVO') && !(emp.cargo||'').toUpperCase().includes('CONTRATO');
              if (activeFilter === 'OPERADORES_GRUA') return (emp.cargo||'').toUpperCase().includes('GRUA');
              if (activeFilter === 'CARGADOR_FRONTAL') return (emp.cargo||'').toUpperCase().includes('CARGADOR FRONTAL');
              if (activeFilter === 'MECANICOS') return (emp.cargo||'').toUpperCase().includes('MECANICO');
              if (citiesList.includes(activeFilter)) return (emp.ciudad||'').toLowerCase() === activeFilter.toLowerCase();
              return true;
            });
            return list.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es', { sensitivity: 'base' }));
          }, [employees, searchTerm, activeFilter, citiesList]);

          const kpis = useMemo(() => {
            const total = filtered.length;
            const supervisores = employees.filter(e => (e.cargo||'').toUpperCase().includes('SUPERVISOR')).length;
            const prevencionistas = employees.filter(e => (e.cargo||'').toUpperCase().includes('PREVENCION')).length;
            const administrativos = employees.filter(e => (e.cargo||'').toUpperCase().includes('ADMINISTRATIVO') && !(e.cargo||'').toUpperCase().includes('CONTRATO')).length;
            const adminContrato = employees.filter(e => { const c = (e.cargo || '').toUpperCase(); return c.includes('ADMINISTRADOR DE CONTRATO') || c.includes('ADMIN. CONTRATO') || c.includes('ADMINISTRADOR'); }).length;
            const operadoresGrua = employees.filter(e => (e.cargo||'').toUpperCase().includes('GRUA')).length;
            const cargadorFrontal = employees.filter(e => (e.cargo||'').toUpperCase().includes('CARGADOR FRONTAL')).length;
            const mecanicos = employees.filter(e => (e.cargo||'').toUpperCase().includes('MECANICO')).length;
            const incompletos = employees.filter(e => getMissingDataList(e).length > 0).length;
            const porCiudad = {};
            citiesList.forEach(c => { porCiudad[c] = employees.filter(e => (e.ciudad||'').toLowerCase() === c.toLowerCase()).length; });
            return { total: employees.length, supervisores, prevencionistas, administrativos, adminContrato, operadoresGrua, cargadorFrontal, mecanicos, incompletos, porCiudad };
          }, [employees, citiesList, filtered]);

          const allGlobalLogs = useMemo(() => {
            let logs = [];
            employees.forEach(emp => {
              if (emp.historial && emp.historial.length > 0) { emp.historial.forEach(h => { logs.push({ ...h, empleadoNombre: emp.nombre, empleadoRut: emp.rut, empleadoCargo: emp.cargo }); }); }
            });
            return logs.sort((a, b) => new Date(b.createdAt || b.fechaInicio) - new Date(a.createdAt || a.fechaInicio));
          }, [employees]);

          const RequisitoToggle = ({ label, icon, checked, onChange }) => (
            <label className={`flex items-center gap-3 p-3.5 rounded-xl border transition-all cursor-pointer ${checked ? 'bg-emerald-500/10 border-emerald-500/30' : 'bg-slate-900/60 border-slate-800 hover:border-slate-700'}`}>
                <input type="checkbox" checked={checked} onChange={onChange} className="hidden" />
                <div className={`w-5 h-5 rounded flex items-center justify-center transition-colors ${checked ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 border border-slate-700'}`}>
                    {checked && <i data-lucide="check" className="w-3.5 h-3.5"></i>}
                </div>
                <div className="flex items-center gap-2">
                  <i data-lucide={icon} className={`w-4 h-4 ${checked ? 'text-emerald-400' : 'text-slate-500'}`}></i>
                  <span className={`text-sm font-medium ${checked ? 'text-emerald-400' : 'text-slate-400'}`}>{label}</span>
                </div>

                                                </div>
                                                {(userSession.rol === 'Administrativo' || userSession.rol === 'AdminContrato' || userSession.rol === h.rolAutor) && (
                                                  <button type="button" onClick={() => handleDeleteSavedAttachment(h.id, fIdx, false)} className="p-1.5 text-slate-500 hover:text-red-400 hover:bg-slate-900 rounded-lg transition-colors" title="Eliminar archivo"><i data-lucide="trash-2" className="w-3.5 h-3.5"></i></button>
                                                )}
                                              </div>
                                            </div>
                                          );
                                        })}
                                      </div>
                                    </div>
                                  ) : h.archivoUrl && (
                                    <div className="mb-4 space-y-2">
                                      <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Documento Adjunto (Legado)</span>
                                      <div className="flex flex-col sm:flex-row sm:items-center justify-between p-3 bg-slate-950 rounded-xl border border-slate-800 gap-3">
                                        <div className="flex items-center gap-3 overflow-hidden w-full sm:w-auto">
                                          {h.archivoUrl.startsWith('data:image') ? (
                                            <div className="w-10 h-10 rounded-lg overflow-hidden shrink-0 border border-slate-800"><img src={h.archivoUrl} alt="Adjunto" className="w-full h-full object-cover" /></div>
                                          ) : (
                                            <div className="w-10 h-10 rounded-lg bg-slate-900 flex items-center justify-center shrink-0 border border-slate-800"><i data-lucide="file" className="w-5 h-5 text-blue-400"></i></div>
                                          )}
                                          <div className="flex flex-col truncate flex-1">
                                            <span className="text-xs text-slate-300 font-semibold truncate" title={h.archivoNombre || 'Archivo adjunto'}>{h.archivoNombre || 'Archivo adjunto'}</span>
                                          </div>
                                        </div>
                                        <div className="flex items-center gap-1.5 shrink-0 justify-end w-full sm:w-auto border-t sm:border-t-0 border-slate-800/80 pt-2 sm:pt-0">
                                          <a href={h.archivoUrl} target="_blank" rel="noreferrer" className="flex items-center gap-1 px-2.5 py-1.5 text-[10px] font-bold bg-slate-800 text-slate-300 hover:text-white rounded transition-colors"><i data-lucide="external-link" className="w-3 h-3"></i> Abrir</a>
                                          <a href={h.archivoUrl} download={h.archivoNombre || "archivo"} className="flex items-center gap-1 px-2.5 py-1.5 text-[10px] font-bold bg-slate-800 text-slate-300 hover:text-emerald-400 rounded transition-colors"><i data-lucide="download" className="w-3 h-3"></i> Bajar</a>
                                          {(userSession.rol === 'Administrativo' || userSession.rol === 'AdminContrato' || userSession.rol === h.rolAutor) && (
                                            <button type="button" onClick={() => handleDeleteSavedAttachment(h.id, 0, true)} className="p-1.5 text-slate-500 hover:text-red-400 hover:bg-slate-900 rounded-lg transition-colors" title="Eliminar archivo"><i data-lucide="trash-2" className="w-3.5 h-3.5"></i></button>
                                          )}
                                        </div>
                                      </div>
                                    </div>
                                  )}
                                  
                                  <div className="flex items-center justify-between text-[11px] pt-3 border-t border-slate-800/80">
                                    <div className="flex items-center gap-2 text-slate-400 font-medium">
                                      <i data-lucide="user-check" className="w-3.5 h-3.5 text-slate-500"></i>
                                      <span>Autorizado por: <strong className="text-white ml-1">{h.autor}</strong></span>
                                    </div>
                                    <span className="uppercase text-[9px] bg-slate-950 px-2 py-1 rounded border border-slate-700 text-slate-300 font-bold tracking-wider">{h.rolAutor}</span>
                                  </div>
                                </div>
                              </div>
                            </div>
                          )}
                        </div>
                      </div>

                      <div className="w-full lg:w-[380px] xl:w-[420px] p-6 bg-slate-900 flex flex-col">
                        <h4 className="text-xs font-bold text-amber-500 uppercase tracking-widest mb-6 flex items-center gap-2"><i data-lucide="file-plus-2" className="w-4 h-4"></i> Registrar Evento</h4>
                        
                        <form onSubmit={handleAddLog} className="space-y-5 flex-1 flex flex-col">
                          
                          <div>
                            <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Perfil de Autoría (Sesión)</label>
                            {userSession.rol === 'Supervisor' ? (
                              <div className="relative">
                                <select 
                                  value={logForm.autorBitacora} 
                                  onChange={e => setLogForm({...logForm, autorBitacora: e.target.value, rolBitacora: 'Supervisor'})} 
                                  className="w-full appearance-none bg-slate-950 border border-amber-500/40 rounded-xl pl-4 pr-10 py-3 text-sm font-bold text-amber-400 focus:outline-none focus:ring-1 focus:ring-amber-500 shadow-inner cursor-pointer"
                                >
                                  {supervisorsList.map(sup => (
                                    <option key={sup} value={sup}>{sup}</option>
                                  ))}
                                </select>
                                <i data-lucide="chevron-down" className="w-4 h-4 text-amber-500/60 absolute right-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                              </div>
                            ) : (
                              <div className="flex items-center gap-3 px-4 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-sm font-bold text-slate-400 cursor-not-allowed shadow-inner">
                                <i data-lucide="lock" className="w-4 h-4 text-slate-500"></i>
                                {userSession.rol === 'Prevencionista' ? "Prevencionista de Riesgos" :
                                 userSession.rol === 'AdminContrato' ? "Administrador de Contrato" :
                                 "Administrativo / RRHH"}
                              </div>
                            )}
                          </div>

                          <div className="border-t border-slate-800 pt-5">
                            <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Categoría del Evento *</label>
                            <div className="relative">
                              <select 
                                value={logForm.tipo} 
                                onChange={e => setLogForm({...logForm, tipo: e.target.value})} 
                                className="w-full appearance-none bg-slate-950 border border-slate-700 rounded-xl pl-4 pr-10 py-3 text-sm font-semibold text-slate-200 focus:outline-none focus:border-amber-500 transition-shadow shadow-inner cursor-pointer"
                              >
                                <option value="Licencia Médica">Licencia Médica</option>
                                <option value="Extensión de Licencia">Extensión de Licencia</option>
                                <option value="Permiso sin goce de sueldo">Permiso sin goce de sueldo</option>
                                <option value="Enmendaduras">Enmendaduras</option>
                                <option value="Falta a Reunión">Falta a Reunión</option>
                                <option value="Incidente">Incidente</option>
                                <option value="Otro">Especificar otro evento...</option>
                              </select>
                              <i data-lucide="chevron-down" className="w-4 h-4 text-slate-500 absolute right-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                            </div>
                          </div>

                          {logForm.tipo === 'Otro' && (
                            <div className="animate-fadeIn">
                              <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Especificar *</label>
                              <input required type="text" placeholder="Ej: Capacitación interna..." value={logForm.customTipo} onChange={e => setLogForm({...logForm, customTipo: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-amber-500 transition-shadow shadow-inner" />
                            </div>
                          )}

                          <div className="bg-slate-950/50 p-4 rounded-2xl border border-slate-800/80">
                            <div className="flex gap-4 mb-4 pb-3 border-b border-slate-800">
                              <label className="flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-300">
                                <input type="radio" name="modoFechas" checked={logForm.modoFechas === 'rango'} onChange={() => setLogForm({...logForm, modoFechas: 'rango'})} className="text-amber-500 focus:ring-amber-500 bg-slate-900 border-slate-700 w-4 h-4" /> Rango de Días
                              </label>
                              <label className="flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-300">
                                <input type="radio" name="modoFechas" checked={logForm.modoFechas === 'unica'} onChange={() => setLogForm({...logForm, modoFechas: 'unica'})} className="text-amber-500 focus:ring-amber-500 bg-slate-900 border-slate-700 w-4 h-4" /> Día Único
                              </label>
                            </div>

                            {logForm.modoFechas === 'rango' ? (
                              <div className="grid grid-cols-2 gap-3">
                                <div>
                                  <span className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Día Inicio</span>
                                  <input type="date" value={logForm.fechaInicio} onChange={e=>setLogForm({...logForm, fechaInicio:e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-2 text-xs font-mono text-slate-200 focus:outline-none focus:border-amber-500" />
                                </div>
                                <div>
                                  <span className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Día Término</span>
                                  <input type="date" value={logForm.fechaTermino} onChange={e=>setLogForm({...logForm, fechaTermino:e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-2 text-xs font-mono text-slate-200 focus:outline-none focus:border-amber-500" />
                                </div>
                              </div>
                            ) : (
                              <div>
                                <span className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Fecha Exacta</span>
                                <input type="date" value={logForm.fechaUnica} onChange={e=>setLogForm({...logForm, fechaUnica:e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-2 text-xs font-mono text-slate-200 focus:outline-none focus:border-amber-500" />
                              </div>
                            )}
                          </div>

                          <div>
                            <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Detalles u Observaciones</label>
                            <textarea placeholder="Redacte los acuerdos o motivos del registro..." value={logForm.nota} onChange={e=>setLogForm({...logForm, nota:e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-amber-500 transition-shadow resize-none shadow-inner" rows="4"></textarea>
                          </div>

                          <div className="space-y-2">
                            <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Evidencia / Adjuntos Múltiples</label>
                            
                            {logForm.archivos && logForm.archivos.length > 0 && (
                              <div className="space-y-2 mb-3 max-h-32 overflow-y-auto pr-1">
                                {logForm.archivos.map((file, idx) => (
                                  <div key={idx} className="flex justify-between items-center bg-slate-950 px-3 py-2 rounded-lg border border-slate-800 text-xs shadow-sm">
                                    <span className="truncate text-slate-300 font-medium max-w-[180px] sm:max-w-[200px]"><i data-lucide="check" className="w-3 h-3 inline text-emerald-500 mr-1.5"></i>{file.nombre}</span>
                                    <button type="button" onClick={() => handleRemovePendingFile(idx)} className="text-slate-500 hover:text-red-400 p-1.5 bg-slate-900 rounded border border-slate-800 transition-colors" title="Quitar archivo"><i data-lucide="trash-2" className="w-3.5 h-3.5"></i></button>
                                  </div>
                                ))}
                              </div>
                            )}

                            <div className="relative group">
                                <input type="file" multiple ref={logFileRef} onChange={handleLogFileChange} accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx" className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                                <div className="w-full bg-slate-950 border-2 border-dashed border-slate-700 rounded-xl px-4 py-5 text-center flex flex-col items-center justify-center group-hover:bg-slate-900 group-hover:border-amber-500/50 transition-colors">
                                  <div className="w-10 h-10 bg-slate-800 rounded-full flex items-center justify-center mb-2 text-slate-400 group-hover:text-amber-500 group-hover:bg-amber-500/10 transition-colors">
                                    <i data-lucide="upload-cloud" className="w-5 h-5"></i>
                                  </div>
                                  <span className="text-xs font-bold text-slate-300">Añadir Documentos o Fotos</span>
                                  <span className="text-[10px] text-slate-500 mt-1">Permite JPG, PNG, PDF, DOC, XLS</span>
                                </div>
                            </div>
                          </div>

                          <div className="pt-4 mt-auto">
                            <button type="submit" className="w-full py-3.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold text-sm uppercase tracking-wider rounded-xl shadow-[0_0_15px_rgba(245,158,11,0.2)] transition-colors flex justify-center items-center gap-2">
                              <i data-lucide="save" className="w-4 h-4"></i> Guardar Evento
                            </button>
                          </div>
                        </form>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {isGlobalHistoryOpen && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-slate-950/80 backdrop-blur-md fade-in">
                  <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-5xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
                    <div className="flex justify-between items-center px-6 py-5 border-b border-slate-800 bg-slate-900/80">
                      <div>
                        <h3 className="font-extrabold text-lg text-white flex items-center gap-2.5">
                          <div className="p-1.5 bg-amber-500/10 text-amber-500 rounded-lg"><i data-lucide="file-bar-chart" className="w-5 h-5"></i></div>
                          Consolidado Global de Auditoría
                        </h3>
                        <p className="text-xs text-slate-400 mt-1 font-medium">Visualización maestra de eventos históricos a nivel dotación.</p>
                      </div>
                      <button onClick={() => setIsGlobalHistoryOpen(false)} className="text-slate-400 hover:text-white p-2 rounded-xl hover:bg-slate-800 transition-colors"><i data-lucide="x" className="w-6 h-6"></i></button>
                    </div>

                    <div className="flex-1 overflow-y-auto p-6 bg-slate-950/50">
                      {allGlobalLogs.length === 0 ? (
                        <div className="flex flex-col items-center justify-center py-32 text-slate-500 space-y-4">
                          <div className="w-20 h-20 bg-slate-900 rounded-full flex items-center justify-center border border-slate-800">
                            <i data-lucide="clipboard-list" className="w-10 h-10 opacity-40"></i>
                          </div>
                          <p className="text-sm font-semibold">Sistema limpio. No se detectaron anotaciones globales en ningún trabajador.</p>
                        </div>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                          {allGlobalLogs.map((log, idx) => (
                            <div key={idx} className="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-lg flex flex-col h-full hover:border-slate-700 transition-colors">
                              <div className="flex justify-between items-start mb-4">
                                <div className="pr-3">
                                  <h4 className="font-bold text-white text-sm leading-tight mb-0.5">{log.empleadoNombre}</h4>
                                  <span className="text-[10px] font-mono font-medium text-slate-400 bg-slate-950 px-1.5 py-0.5 rounded border border-slate-800">{log.empleadoRut}</span>
                                </div>
                                <span className="px-2.5 py-1 bg-amber-500/10 border border-amber-500/20 text-amber-400 text-[9px] font-bold rounded-lg shrink-0 text-right uppercase tracking-wider">{log.tipo}</span>
                              </div>
                              <div className="flex-1">
                                {log.nota && <p className="text-xs text-slate-300 leading-relaxed bg-slate-950/80 p-3.5 rounded-xl border border-slate-800/50 mb-4">{log.nota}</p>}
                              </div>
                              <div className="flex items-end justify-between mt-auto pt-4 border-t border-slate-800/80">
                                <div className="text-[11px] text-slate-400 font-mono font-medium bg-slate-950 px-2 py-1 rounded-md border border-slate-800">
                                  <i data-lucide="calendar" className="w-3 h-3 inline mr-1 text-slate-500"></i> {log.fechaInicio}
                                </div>
                                <div className="text-right">
                                  <p className="text-[9px] text-slate-500 uppercase tracking-widest font-bold mb-0.5">Autorizado</p>
                                  <p className="text-[11px] font-semibold text-indigo-400">{log.autor}</p>
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    <div className="px-6 py-5 border-t border-slate-800 bg-slate-900/80 flex flex-col sm:flex-row justify-between items-center gap-4">
                      <button onClick={handleDownloadGlobalLogsExcel} className="w-full sm:w-auto px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-sm flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/20 transition-all">
                        <i data-lucide="file-spreadsheet" className="w-4 h-4"></i> Exportar a Excel (XLSX)
                      </button>
                      <button onClick={() => setIsGlobalHistoryOpen(false)} className="w-full sm:w-auto px-8 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-sm transition-colors">Cerrar</button>
                    </div>
                  </div>
                </div>
              )}

            </div>
          );
        }

        window.addEventListener('load', () => {
            const container = document.getElementById('root');
            if (container) {
                try {
                    const root = ReactDOM.createRoot(container);
                    root.render(<App />);
                } catch (e) {
                    console.error("Error crítico de renderizado:", e);
                    ReactDOM.render(<App />, container);
                }
            }
        });
    </script>
</body>
</html>
