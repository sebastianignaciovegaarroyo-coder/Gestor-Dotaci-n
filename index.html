<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Dotación BRAMAQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-24">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const firebaseConfig = {
          apiKey: "AIzaSyD_ZlO3treRtz6ZkjY9V...",
          authDomain: "bramaqcloud.firebaseapp.com",
          projectId: "bramaqcloud",
          storageBucket: "bramaqcloud.appspot.com",
          messagingSenderId: "369713509600",
          appId: "1:369713509600:web:b6d878c..."
        };
        let db;
        try {
          if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
          db = firebase.firestore();
        } catch (e) { console.error(e); }

        function App() {
          const [employees, setEmployees] = useState([]);
          const [loading, setLoading] = useState(true);
          const [onlineStatus, setOnlineStatus] = useState(navigator.onLine);
          const [searchTerm, setSearchTerm] = useState('');
          const [activeTab, setActiveTab] = useState('dashboard');
          const [activeFilter, setActiveFilter] = useState('TODOS');
          const [citiesList] = useState(['Loncoche', 'Lanco', 'Valdivia', 'San José de la Mariquina', 'Los Lagos', 'Malalhue', 'Ciruelos', 'Panguipulli', 'Mariquina']);
          const [newCityInput, setNewCityInput] = useState('');
          
          const [isModalOpen, setIsModalOpen] = useState(false);
          const [currentEmployee, setCurrentEmployee] = useState(null);
          const [formError, setFormError] = useState('');
          
          const [isHistoryModalOpen, setIsHistoryModalOpen] = useState(false);
          const [selectedEmpForHistory, setSelectedEmpForHistory] = useState(null);
          const [isGlobalHistoryOpen, setIsGlobalHistoryOpen] = useState(false);

          const [selectedPhone, setSelectedPhone] = useState(null);
          
          // Perfil activo en la cabecera
          const [userSession, setUserSession] = useState({
            rol: "Administrativo"
          });

          const [formData, setFormData] = useState({
            nombre: '', rut: '', direccion: '', ciudad: 'Valdivia', cargo: 'OPERADOR GRUA HORQUILLA', telefono: '', correo: '', emergenciaNombre: '', emergenciaFono: '',
            documentos: { contrato: true, induccion: true, examenes: true, epp: true }
          });

          // Lista de supervisores extraídos de los empleados
          const supervisorsList = useMemo(() => {
            const list = employees
              .filter(e => (e.cargo || '').toUpperCase().includes('SUPERVISOR'))
              .map(e => e.nombre);
            return list.length > 0 ? list : ['Briones Victor', 'Nahuelpan Nahuelpan Reinaldo Patricio', 'Rubilar Rubilar Daniel Joel'];
          }, [employees]);

          const [logForm, setLogForm] = useState({
            tipo: 'Licencia Médica',
            modoFechas: 'rango',
            fechaInicio: new Date().toISOString().split('T')[0],
            fechaTermino: new Date().toISOString().split('T')[0],
            fechaUnica: new Date().toISOString().split('T')[0],
            customTipo: '',
            nota: '',
            archivoNombre: '',
            archivoUrl: '',
            autorBitacora: 'Administrativo / RRHH',
            rolBitacora: 'Administrativo'
          });

          // Sincronizar automáticamente el autor de la bitácora según el rol de la sesión de manera aislada
          useEffect(() => {
            if (userSession.rol === 'Administrativo') {
              setLogForm(prev => ({ ...prev, autorBitacora: 'Administrativo / RRHH', rolBitacora: 'Administrativo' }));
            } else if (userSession.rol === 'AdminContrato') {
              setLogForm(prev => ({ ...prev, autorBitacora: 'Administrador de Contrato', rolBitacora: 'AdminContrato' }));
            } else if (userSession.rol === 'Prevencionista') {
              setLogForm(prev => ({ ...prev, autorBitacora: 'Prevencionista de Riesgos', rolBitacora: 'Prevencionista' }));
            } else if (userSession.rol === 'Supervisor') {
              const defaultSup = supervisorsList[0] || 'Briones Victor';
              setLogForm(prev => ({ ...prev, autorBitacora: defaultSup, rolBitacora: 'Supervisor' }));
            }
          }, [userSession.rol, supervisorsList]);

          const fileInputRef = useRef(null);
          const logFileRef = useRef(null);

          useEffect(() => {
            const on = () => setOnlineStatus(true), off = () => setOnlineStatus(false);
            window.addEventListener('online', on); window.addEventListener('offline', off);
            if (!db) { setLoading(false); return; }
            const unsub = db.collection('employees').onSnapshot(snap => {
              const items = [];
              snap.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
              setEmployees(items); setLoading(false);
            }, () => setLoading(false));
            return () => { unsub(); window.removeEventListener('online', on); window.removeEventListener('offline', off); };
          }, []);

          useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

          const handleDownloadExcel = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(employees, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `bramaq_dotacion_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
          };

          const handleDownloadGlobalLogsExcel = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allGlobalLogs, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `bramaq_hoja_de_vida_global_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
          };

          const handleDeleteAllData = async () => {
            if (userSession.rol !== 'Administrativo' && userSession.rol !== 'AdminContrato') {
              alert("Sin permisos suficientes para realizar borrado masivo.");
              return;
            }
            if (confirm("⚠️ ATENCIÓN: ¿Estás seguro de eliminar TODOS los registros de la base de datos de la nube para vaciar y volver a cargar desde cero?")) {
              try {
                const batchSize = 400;
                let snapshot = await db.collection('employees').limit(batchSize).get();
                while (!snapshot.empty) {
                  const batch = db.batch();
                  snapshot.docs.forEach((doc) => {
                    batch.delete(doc.ref);
                  });
                  await batch.commit();
                  snapshot = await db.collection('employees').limit(batchSize).get();
                }
                alert("¡Base de datos vaciada con éxito! Ya puedes cargar tu archivo Excel nuevo.");
              } catch (err) {
                alert("Error al vaciar la base de datos: " + err.message);
              }
            }
          };

          const handleUploadExcel = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.readAsArrayBuffer(file);
            reader.onload = async (event) => {
              try {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                const jsonSheet = XLSX.utils.sheet_to_json(worksheet, { defval: "", range: 1 });

                if (jsonSheet.length > 0) {
                  let addedCount = 0;
                  let duplicateCount = 0;
                  let existingRuts = new Set(employees.map(emp => (emp.rut || '').trim().toLowerCase().replace(/[^0-9kK]/g, '')));

                  if (confirm(`Se leyeron ${jsonSheet.length} filas del archivo. ¿Deseas importar omitiendo duplicados por RUT?`)) {
                    for (let row of jsonSheet) {
                      const keys = Object.keys(row);
                      const findVal = (terms) => {
                        for (let t of terms) {
                          const foundKey = keys.find(k => k.toLowerCase().includes(t));
                          if (foundKey && row[foundKey] !== undefined) return String(row[foundKey]).trim();
                        }
                        return '';
                      };

                      const nombre = findVal(['nombre']);
                      const rut = findVal(['rut']);
                      const direccion = findVal(['direccion']);
                      const ciudad = findVal(['ciudad']) || 'Valdivia';
                      const cargo = findVal(['cargo']);
                      const telefono = findVal(['n telefonico', 'telefono', 'fono', 'celular']);
                      const correo = findVal(['correo', 'email']);
                      const emergenciaNombre = findVal(['nombre emergencia', 'emergencia', 'contacto emergencia']);
                      const emergenciaFono = findVal(['fono emergencia', 'telefono emergencia', 'emergencia fono']);

                      const cleanRut = (rut || '').trim().toLowerCase().replace(/[^0-9kK]/g, '');

                      if ((nombre || rut) && cleanRut) {
                        if (!existingRuts.has(cleanRut)) {
                          await db.collection('employees').add({
                            nombre: nombre || 'Sin Nombre',
                            rut: rut || 'Sin RUT',
                            direccion: direccion || '',
                            ciudad: ciudad,
                            cargo: cargo || 'OPERADOR GRUA HORQUILLA',
                            telefono: telefono,
                            correo: correo,
                            emergenciaNombre: emergenciaNombre,
                            emergenciaFono: emergenciaFono,
                            documentos: { contrato: true, induccion: true, examenes: true, epp: true },
                            historial: []
                          });
                          existingRuts.add(cleanRut);
                          addedCount++;
                        } else {
                          duplicateCount++;
                        }
                      }
                    }
                    alert(`¡Importación completada!\n- Nuevos trabajadores únicos agregados: ${addedCount}\n- Duplicados detectados y eliminados/omitidos: ${duplicateCount}`);
                  }
                }
              } catch (err) {
                alert("Error al procesar archivo: " + err.message);
              }
            };
          };

          const handleSave = async (e) => {
            e.preventDefault();
            if (!formData.nombre || !formData.rut) { setFormError("Nombre y RUT obligatorios."); return; }
            try {
              if (currentEmployee) {
                await db.collection('employees').doc(currentEmployee.id).update(formData);
              } else {
                await db.collection('employees').add({ ...formData, historial: [] });
              }
              setIsModalOpen(false); setCurrentEmployee(null);
            } catch (err) { setFormError("Error: " + err.message); }
          };

          const handleDelete = async (id) => {
            if (userSession.rol !== 'Administrativo' && userSession.rol !== 'AdminContrato') { alert("Sin permisos suficientes."); return; }
            if (confirm("¿Eliminar trabajador?")) await db.collection('employees').doc(id).delete();
          };

          const handleDeleteLog = async (logId) => {
            if (!selectedEmpForHistory) return;
            if (confirm("¿Estás seguro de eliminar esta observación de la hoja de vida?")) {
              try {
                const updatedHistorial = (selectedEmpForHistory.historial || []).filter(h => h.id !== logId);
                await db.collection('employees').doc(selectedEmpForHistory.id).update({
                  historial: updatedHistorial
                });
                setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: updatedHistorial });
                alert("Observación eliminada correctamente.");
              } catch (err) {
                alert("Error al eliminar observación: " + err.message);
              }
            }
          };

          const handleLogFileChange = (e) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = (uploadEvent) => {
                setLogForm({
                  ...logForm,
                  archivoNombre: file.name,
                  archivoUrl: uploadEvent.target.result
                });
              };
              reader.readAsDataURL(file);
            }
          };

          const handleAddLog = async (e) => {
            e.preventDefault();
            if (!selectedEmpForHistory) return;

            const tipoFinal = logForm.tipo === 'Otro' ? (logForm.customTipo || 'Otro evento') : logForm.tipo;

            const logEntry = {
              id: String(Date.now()),
              tipo: String(tipoFinal),
              modoFechas: String(logForm.modoFechas),
              fechaInicio: String(logForm.modoFechas === 'rango' ? logForm.fechaInicio : logForm.fechaUnica),
              fechaTermino: String(logForm.modoFechas === 'rango' ? logForm.fechaTermino : logForm.fechaUnica),
              nota: String(logForm.nota || ''),
              archivoNombre: String(logForm.archivoNombre || ''),
              archivoUrl: String(logForm.archivoUrl || ''),
              autor: String(logForm.autorBitacora),
              rolAutor: String(logForm.rolBitacora),
              createdAt: new Date().toISOString()
            };

            try {
              const updatedHistorial = [...(selectedEmpForHistory.historial || []), logEntry];
              await db.collection('employees').doc(selectedEmpForHistory.id).update({
                historial: updatedHistorial
              });
              
              setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: updatedHistorial });
              setLogForm({
                tipo: 'Licencia Médica',
                modoFechas: 'rango',
                fechaInicio: new Date().toISOString().split('T')[0],
                fechaTermino: new Date().toISOString().split('T')[0],
                fechaUnica: new Date().toISOString().split('T')[0],
                customTipo: '',
                nota: '',
                archivoNombre: '',
                archivoUrl: '',
                autorBitacora: userSession.rol === 'Supervisor' ? (supervisorsList[0] || '') : logForm.autorBitacora,
                rolBitacora: userSession.rol
              });
              alert("Bitácora registrada con éxito.");
            } catch (error) {
              alert("Error al registrar bitácora: " + error.message);
            }
          };

          const getMissingDataList = (emp) => {
            let missing = [];
            if (!emp.telefono) missing.push("Teléfono");
            if (!emp.correo) missing.push("Correo");
            if (!emp.emergenciaNombre || !emp.emergenciaFono) missing.push("Contacto de Emergencia");
            if (emp.documentos) {
              if (!emp.documentos.contrato) missing.push("Contrato");
              if (!emp.documentos.induccion) missing.push("Inducción S.S.O.");
              if (!emp.documentos.examenes) missing.push("Exámenes Ocupacionales");
              if (!emp.documentos.epp) missing.push("Entrega de EPP");
            }
            return missing;
          };

          const filtered = useMemo(() => {
            const seenRuts = new Set();
            const uniqueEmployees = [];
            for (const emp of employees) {
              const cleanR = (emp.rut || '').trim().toLowerCase().replace(/[^0-9kK]/g, '');
              if (cleanR) {
                if (!seenRuts.has(cleanR)) {
                  seenRuts.add(cleanR);
                  uniqueEmployees.push(emp);
                }
              } else {
                uniqueEmployees.push(emp);
              }
            }

            const list = uniqueEmployees.filter(emp => {
              const s = searchTerm.toLowerCase();
              const matchSearch = (emp.nombre||'').toLowerCase().includes(s) || 
                                    (emp.rut||'').toLowerCase().includes(s) || 
                                    (emp.cargo||'').toLowerCase().includes(s) || 
                                    (emp.ciudad||'').toLowerCase().includes(s);

              if (!matchSearch) return false;

              if (activeFilter === 'TODOS') return true;
              if (activeFilter === 'INCOMPLETOS') {
                return getMissingDataList(emp).length > 0;
              }
              if (activeFilter === 'ADMIN_CONTRATO') {
                const c = (emp.cargo || '').toUpperCase();
                return c.includes('ADMINISTRADOR DE CONTRATO') || c.includes('ADMIN. CONTRATO') || c.includes('ADMINISTRADOR');
              }
              if (activeFilter === 'SUPERVISORES') return (emp.cargo||'').toUpperCase().includes('SUPERVISOR');
              if (activeFilter === 'PREVENCIONISTAS') return (emp.cargo||'').toUpperCase().includes('PREVENCION');
              if (activeFilter === 'ADMINISTRATIVOS') return (emp.cargo||'').toUpperCase().includes('ADMINISTRATIVO') && !(emp.cargo||'').toUpperCase().includes('CONTRATO');
              if (activeFilter === 'OPERADORES_GRUA') return (emp.cargo||'').toUpperCase().includes('GRUA');
              if (activeFilter === 'CARGADOR_FRONTAL') return (emp.cargo||'').toUpperCase().includes('CARGADOR FRONTAL');
              if (activeFilter === 'MECANICOS') return (emp.cargo||'').toUpperCase().includes('MECANICO');
              
              if (citiesList.includes(activeFilter)) {
                return (emp.ciudad||'').toLowerCase() === activeFilter.toLowerCase();
              }

              return true;
            });

            return list.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es', { sensitivity: 'base' }));
          }, [employees, searchTerm, activeFilter, citiesList]);

          const kpis = useMemo(() => {
            const total = filtered.length;
            const supervisores = employees.filter(e => (e.cargo||'').toUpperCase().includes('SUPERVISOR')).length;
            const prevencionistas = employees.filter(e => (e.cargo||'').toUpperCase().includes('PREVENCION')).length;
            const administrativos = employees.filter(e => (e.cargo||'').toUpperCase().includes('ADMINISTRATIVO') && !(e.cargo||'').toUpperCase().includes('CONTRATO')).length;
            const adminContrato = employees.filter(e => {
              const c = (e.cargo || '').toUpperCase();
              return c.includes('ADMINISTRADOR DE CONTRATO') || c.includes('ADMIN. CONTRATO') || c.includes('ADMINISTRADOR');
            }).length;
            const operadoresGrua = employees.filter(e => (e.cargo||'').toUpperCase().includes('GRUA')).length;
            const cargadorFrontal = employees.filter(e => (e.cargo||'').toUpperCase().includes('CARGADOR FRONTAL')).length;
            const mecanicos = employees.filter(e => (e.cargo||'').toUpperCase().includes('MECANICO')).length;
            
            const incompletos = employees.filter(e => getMissingDataList(e).length > 0).length;

            const porCiudad = {};
            citiesList.forEach(c => {
              porCiudad[c] = employees.filter(e => (e.ciudad||'').toLowerCase() === c.toLowerCase()).length;
            });

            return { total: employees.length, supervisores, prevencionistas, administrativos, adminContrato, operadoresGrua, cargadorFrontal, mecanicos, incompletos, porCiudad };
          }, [employees, citiesList, filtered]);

          const allGlobalLogs = useMemo(() => {
            let logs = [];
            employees.forEach(emp => {
              if (emp.historial && emp.historial.length > 0) {
                emp.historial.forEach(h => {
                  logs.push({ ...h, empleadoNombre: emp.nombre, empleadoRut: emp.rut });
                });
              }
            });
            return logs.sort((a, b) => new Date(b.fechaInicio || b.createdAt) - new Date(a.fechaInicio || a.createdAt));
          }, [employees]);

          return (
            <div className="min-h-screen bg-slate-950 text-slate-100 pb-24">
              <div className={`text-center text-[11px] py-1 font-bold ${onlineStatus ? 'bg-emerald-950 text-emerald-400' : 'bg-red-950 text-red-400 animate-pulse'}`}>
                {onlineStatus ? '🟢 Conectado a la Nube (Tiempo Real)' : '🔴 Sin Conexión'}
              </div>

              {/* CABECERA */}
              <header className="px-4 pt-4 pb-2 space-y-3 max-w-7xl mx-auto">
                <div className="flex items-center gap-3">
                  <div className="bg-amber-600 px-3 py-2.5 rounded-2xl text-white font-black text-xs shadow-md">
                    BRAMAQ
                  </div>
                  <div>
                    <h1 className="font-bold text-base leading-tight text-white">Gestor de Dotación BRAMAQ</h1>
                    <span className="text-[10px] text-emerald-400 font-semibold tracking-wide">
                      ● MODO PWA INSTALABLE
                    </span>
                  </div>
                </div>

                <div className="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-2 rounded-2xl text-xs">
                  <span className="text-slate-400 font-medium">Perfil:</span>
                  <select 
                    value={userSession.rol} 
                    onChange={e => {
                      const rol = e.target.value;
                      setUserSession({ rol });
                    }} 
                    className="bg-slate-950 text-amber-400 font-bold px-2 py-1 rounded-xl border border-slate-700 outline-none w-full"
                  >
                    <option value="Administrativo">Administrativo / RRHH</option>
                    <option value="AdminContrato">Administrador de Contrato</option>
                    <option value="Supervisor">Supervisor de Faena</option>
                    <option value="Prevencionista">Prevencionista</option>
                  </select>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <button 
                    onClick={() => setActiveTab('dashboard')} 
                    className={`py-2.5 rounded-2xl text-xs font-bold transition-all border ${activeTab === 'dashboard' ? 'bg-amber-600 text-white border-amber-500 shadow-lg' : 'bg-slate-900/40 text-slate-400 border-slate-800'}`}
                  >
                    Panel Gerencial
                  </button>
                  <button 
                    onClick={() => setActiveTab('directorio')} 
                    className={`py-2.5 rounded-2xl text-xs font-bold transition-all border ${activeTab === 'directorio' ? 'bg-amber-600 text-white border-amber-500 shadow-lg' : 'bg-slate-900/40 text-slate-400 border-slate-800'}`}
                  >
                    Directorio y Bitácora
                  </button>
                </div>
              </header>

              <main className="max-w-7xl mx-auto px-4 mt-2">
                {loading ? (
                  <div className="text-center py-20 text-slate-500">Cargando base de datos...</div>
                ) : (
                  <>
                    {/* PANEL GERENCIAL */}
                    {activeTab === 'dashboard' && (
                      <div className="space-y-4 pt-2">
                        <div className="bg-slate-900/80 p-4 rounded-3xl border border-slate-800 space-y-2">
                          <h2 className="text-sm font-bold text-white">Panel de Control de Dotación BRAMAQ</h2>
                          <p className="text-[11px] text-slate-400">Haz clic en cualquier tarjeta para ver inmediatamente el personal filtrado.</p>
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                          <div onClick={() => { setActiveFilter('TODOS'); setActiveTab('directorio'); }} className="bg-slate-900 p-4 rounded-2xl border border-amber-500/80 cursor-pointer shadow-lg hover:border-amber-400 transition-all">
                            <span className="text-slate-400 text-xs font-medium block">Total Dotación</span>
                            <span className="text-3xl font-bold text-white mt-1 block">{kpis.total}</span>
                            <span className="text-[10px] text-amber-400 mt-2 block font-semibold">Ver todos →</span>
                          </div>

                          <div onClick={() => { setActiveFilter('INCOMPLETOS'); setActiveTab('directorio'); }} className="bg-slate-900 p-4 rounded-2xl border border-red-950/80 cursor-pointer shadow-lg hover:border-red-500 transition-all">
                            <span className="text-red-400 text-xs font-medium block">Incompletos</span>
                            <span className="text-3xl font-bold text-red-400 mt-1 block">{kpis.incompletos}</span>
                            <span className="text-[10px] text-red-400 mt-2 block font-semibold">Filtrar →</span>
                          </div>

                          <div onClick={() => { setActiveFilter('ADMIN_CONTRATO'); setActiveTab('directorio'); }} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 cursor-pointer shadow-lg hover:border-slate-700 transition-all">
                            <span className="text-slate-400 text-xs font-medium block">Administrador de Contrato</span>
                            <span className="text-3xl font-bold text-amber-400 mt-1 block">{kpis.adminContrato}</span>
                            <span className="text-[10px] text-amber-400 mt-2 block font-semibold">Filtrar →</span>
                          </div>

                          <div onClick={() => { setActiveFilter('SUPERVISORES'); setActiveTab('directorio'); }} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 cursor-pointer shadow-lg hover:border-slate-700 transition-all">
                            <span className="text-slate-400 text-xs font-medium block">Supervisores</span>
                            <span className="text-3xl font-bold text-indigo-400 mt-1 block">{kpis.supervisores}</span>
                            <span className="text-[10px] text-indigo-400 mt-2 block font-semibold">Filtrar →</span>
                          </div>

                                  <img src={h.archivoUrl} alt="Adjunto" className="max-h-24 rounded-lg border border-slate-700 mt-1" />
                                ) : (
                                  <a href={h.archivoUrl} download={h.archivoName || "archivo_adjunto"} className="text-xs text-blue-400 underline flex items-center gap-1">
                                    📎 Descargar archivo adjunto
                                  </a>
                                )}
                              </div>
                            )}
                            <div className="text-[10px] text-slate-400 text-right pt-1 border-t border-slate-900 flex justify-between">
                              <span className="text-indigo-400 font-medium">Registrado por: {h.autor}</span>
                              <span className="uppercase text-[9px] bg-slate-900 px-2 py-0.5 rounded text-slate-300 font-bold">{h.rolAutor}</span>
                            </div>
                          </div>
                        ))
                      )}
                    </div>

                    <form onSubmit={handleAddLog} className="space-y-2.5 text-xs pt-3 border-t border-slate-800">
                      <div className="text-[11px] font-bold text-amber-400">Agregar Evento a la Hoja de Vida:</div>
                      
                      {/* REGLA ESTRICTA DE AUTORÍA SEGÚN PERFIL ACTIVO */}
                      <div>
                        <label className="text-[10px] text-slate-400 font-bold">Registrar observación como (Según perfil activo)</label>
                        {userSession.rol === 'Supervisor' ? (
                          <select 
                            value={logForm.autorBitacora} 
                            onChange={e => setLogForm({...logForm, autorBitacora: e.target.value, rolBitacora: 'Supervisor'})} 
                            className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-amber-400 font-bold text-xs"
                          >
                            {supervisorsList.map(sup => (
                              <option key={sup} value={sup}>{sup} (Supervisor)</option>
                            ))}
                          </select>
                        ) : userSession.rol === 'Prevencionista' ? (
                          <input 
                            disabled 
                            value="Prevencionista de Riesgos" 
                            className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-emerald-400 font-bold text-xs cursor-not-allowed" 
                          />
                        ) : userSession.rol === 'AdminContrato' ? (
                          <input 
                            disabled 
                            value="Administrador de Contrato" 
                            className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-amber-400 font-bold text-xs cursor-not-allowed" 
                          />
                        ) : (
                          <input 
                            disabled 
                            value="Administrativo / RRHH" 
                            className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-indigo-400 font-bold text-xs cursor-not-allowed" 
                          />
                        )}
                      </div>

                      <div>
                        <label className="text-[10px] text-slate-400 font-bold">Tipo de Evento</label>
                        <select 
                          value={logForm.tipo} 
                          onChange={e => setLogForm({...logForm, tipo: e.target.value})} 
                          className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs"
                        >
                          <option value="Licencia Médica">Licencia Médica</option>
                          <option value="Extensión de Licencia">Extensión de Licencia</option>
                          <option value="Permiso sin goce de sueldo">Permiso sin goce de sueldo</option>
                          <option value="Enmendaduras">Enmendaduras</option>
                          <option value="Falta a Reunión">Falta a Reunión</option>
                          <option value="Incidente">Incidente</option>
                          <option value="Otro">Otro (Escribir opción...)</option>
                        </select>
                      </div>

                      {logForm.tipo === 'Otro' && (
                        <div>
                          <label className="text-[10px] text-slate-400 font-bold">Especificar otro evento</label>
                          <input 
                            type="text" 
                            placeholder="Ej: Felicitación, Capacitación..." 
                            value={logForm.customTipo} 
                            onChange={e => setLogForm({...logForm, customTipo: e.target.value})} 
                            className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs" 
                          />
                        </div>
                      )}

                      <div>
                        <label className="text-[10px] text-slate-400 font-bold">Duración / Fechas</label>
                        <div className="flex gap-2 mt-1 mb-2">
                          <label className="flex items-center gap-1 cursor-pointer">
                            <input 
                              type="radio" 
                              name="modoFechas" 
                              checked={logForm.modoFechas === 'rango'} 
                              onChange={() => setLogForm({...logForm, modoFechas: 'rango'})} 
                            /> Rango de fechas
                          </label>
                          <label className="flex items-center gap-1 cursor-pointer">
                            <input 
                              type="radio" 
                              name="modoFechas" 
                              checked={logForm.modoFechas === 'unica'} 
                              onChange={() => setLogForm({...logForm, modoFechas: 'unica'})} 
                            /> Fecha única
                          </label>
                        </div>

                        {logForm.modoFechas === 'rango' ? (
                          <div className="flex gap-2">
                            <div className="w-1/2">
                              <span className="text-[9px] text-slate-500">Fecha Inicio</span>
                              <input type="date" value={logForm.fechaInicio} onChange={e=>setLogForm({...logForm, fechaInicio:e.target.value})} className="w-full p-1.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs" />
                            </div>
                            <div className="w-1/2">
                              <span className="text-[9px] text-slate-500">Fecha Término</span>
                              <input type="date" value={logForm.fechaTermino} onChange={e=>setLogForm({...logForm, fechaTermino:e.target.value})} className="w-full p-1.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs" />
                            </div>
                          </div>
                        ) : (
                          <div>
                            <span className="text-[9px] text-slate-500">Día en que ocurrió</span>
                            <input type="date" value={logForm.fechaUnica} onChange={e=>setLogForm({...logForm, fechaUnica:e.target.value})} className="w-full p-1.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs" />
                          </div>
                        )}
                      </div>

                      <div>
                        <label className="text-[10px] text-slate-400 font-bold">Cuadro de Observación (Opcional)</label>
                        <textarea 
                          placeholder="Escriba comentarios, detalles o acuerdos..." 
                          value={logForm.nota} 
                          onChange={e=>setLogForm({...logForm, nota:e.target.value})} 
                          className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs" 
                          rows="2"
                        ></textarea>
                      </div>

                      <div>
                        <label className="text-[10px] text-slate-400 font-bold">Subir Foto o Archivos Varios</label>
                        <input 
                          type="file" 
                          ref={logFileRef} 
                          onChange={handleLogFileChange} 
                          accept="image/*,application/pdf,.doc,.docx" 
                          className="w-full mt-1 text-[11px] text-slate-400 file:mr-2 file:py-1 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700 cursor-pointer" 
                        />
                        {logForm.archivoNombre && <span className="text-[10px] text-emerald-400 mt-1 block">📎 Adjunto listo: {logForm.archivoNombre}</span>}
                      </div>

                      <div className="flex justify-end gap-2 pt-2">
                        <button type="button" onClick={()=>setIsHistoryModalOpen(false)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Cancelar</button>
                        <button type="submit" className="px-5 py-2 bg-amber-600 text-white font-bold rounded-xl shadow">Registrar en Bitácora</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {/* MODAL HOJA DE VIDA GLOBAL */}
              {isGlobalHistoryOpen && (
                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                  <div className="bg-slate-900 p-5 rounded-3xl w-full max-w-2xl border border-slate-800 space-y-3 my-auto">
                    <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                      <div>
                        <h3 className="text-sm font-bold text-white">Hoja de Vida Global (Consolidado de Bitácoras)</h3>
                        <span className="text-[10px] text-amber-400 font-semibold">Registro histórico por supervisores, administrativo y prevención</span>
                      </div>
                      <button onClick={() => setIsGlobalHistoryOpen(false)} className="text-slate-400"><i data-lucide="x" className="w-5 h-5"></i></button>
                    </div>

                    <div className="space-y-2.5 max-h-80 overflow-y-auto text-xs pr-1">
                      {allGlobalLogs.length === 0 ? (
                        <p className="text-slate-500 text-center py-8">No hay observaciones registradas en ningún trabajador.</p>
                      ) : (
                        allGlobalLogs.map((log, idx) => (
                          <div key={idx} className="bg-slate-950 p-3 rounded-2xl border border-slate-800 space-y-1">
                            <div className="flex justify-between items-center">
                              <span className="font-bold text-white">{log.empleadoNombre} <span className="text-[10px] text-slate-400 font-mono">({log.empleadoRut})</span></span>
                              <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-950 text-amber-300 border border-amber-900">{log.tipo}</span>
                            </div>
                            {log.nota && <p className="text-slate-300 text-xs mt-1">{log.nota}</p>}
                            <div className="flex justify-between text-[10px] text-slate-500 pt-1 border-t border-slate-900 mt-2">
                              <span>Fecha: {log.fechaInicio}</span>
                              <span className="text-indigo-400 font-bold">Agregado por: {log.autor} ({log.rolAutor})</span>
                            </div>
                          </div>
                        ))
                      )}
                    </div>

                    <div className="flex justify-between pt-2 border-t border-slate-800">
                      <button onClick={handleDownloadGlobalLogsExcel} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs flex items-center gap-1.5 shadow">
                        <i data-lucide="download" className="w-4 h-4"></i> Descargar Hoja Global
                      </button>
                      <button onClick={() => setIsGlobalHistoryOpen(false)} className="px-5 py-2 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs">Cerrar</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
