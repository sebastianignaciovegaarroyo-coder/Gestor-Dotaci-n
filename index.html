<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Dotación BRAMAQ - Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        /* Custom scrollbar for professional feel */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-16 antialiased selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const firebaseConfig = {
          apiKey: "AIzaSyD_ZlO3treRtz6ZkjY9V...",
          authDomain: "bramaqcloud.firebaseapp.com",
          projectId: "bramaqcloud",
          storageBucket: "bramaqcloud.appspot.com",
          messagingSenderId: "369713509600",
          appId: "1:369713509600:web:b6d878c..."
        };
        let db;
        try {
          if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
          db = firebase.firestore();
        } catch (e) { console.error(e); }

        function App() {
          const [employees, setEmployees] = useState([]);
          const [loading, setLoading] = useState(true);
          const [onlineStatus, setOnlineStatus] = useState(navigator.onLine);
          const [searchTerm, setSearchTerm] = useState('');
          const [activeTab, setActiveTab] = useState('dashboard');
          const [activeFilter, setActiveFilter] = useState('TODOS');
          const [citiesList] = useState(['Loncoche', 'Lanco', 'Valdivia', 'San José de la Mariquina', 'Los Lagos', 'Malalhue', 'Ciruelos', 'Panguipulli', 'Mariquina']);
          const [newCityInput, setNewCityInput] = useState('');
          
          const [isModalOpen, setIsModalOpen] = useState(false);
          const [currentEmployee, setCurrentEmployee] = useState(null);
          const [formError, setFormError] = useState('');
          
          const [isHistoryModalOpen, setIsHistoryModalOpen] = useState(false);
          const [selectedEmpForHistory, setSelectedEmpForHistory] = useState(null);
          const [isGlobalHistoryOpen, setIsGlobalHistoryOpen] = useState(false);

          const [selectedPhone, setSelectedPhone] = useState(null);
          
          // Perfil activo exacto (Administrativo, AdminContrato, Supervisor, Prevencionista)
          const [userSession, setUserSession] = useState({
            rol: "Administrativo"
          });

          const [formData, setFormData] = useState({
            nombre: '', rut: '', direccion: '', ciudad: 'Valdivia', cargo: 'OPERADOR GRUA HORQUILLA', telefono: '', correo: '', emergenciaNombre: '', emergenciaFono: '',
            documentos: { contrato: true, induccion: true, examenes: true, epp: true }
          });

          // Lista estricta de supervisores extraídos de la dotación
          const supervisorsList = useMemo(() => {
            const list = employees
              .filter(e => (e.cargo || '').toUpperCase().includes('SUPERVISOR'))
              .map(e => e.nombre);
            return list.length > 0 ? list : ['Briones Victor', 'Nahuelpan Nahuelpan Reinaldo Patricio', 'Rubilar Rubilar Daniel Joel'];
          }, [employees]);

          const [logForm, setLogForm] = useState({
            tipo: 'Licencia Médica',
            modoFechas: 'rango',
            fechaInicio: new Date().toISOString().split('T')[0],
            fechaTermino: new Date().toISOString().split('T')[0],
            fechaUnica: new Date().toISOString().split('T')[0],
            customTipo: '',
            nota: '',
            archivoNombre: '',
            archivoUrl: '',
            autorBitacora: 'Administrativo / RRHH',
            rolBitacora: 'Administrativo'
          });

          // Sincronización estricta del autor de la bitácora según el rol activo
          useEffect(() => {
            if (userSession.rol === 'Administrativo') {
              setLogForm(prev => ({ ...prev, autorBitacora: 'Administrativo / RRHH', rolBitacora: 'Administrativo' }));
            } else if (userSession.rol === 'AdminContrato') {
              setLogForm(prev => ({ ...prev, autorBitacora: 'Administrador de Contrato', rolBitacora: 'AdminContrato' }));
            } else if (userSession.rol === 'Prevencionista') {
              setLogForm(prev => ({ ...prev, autorBitacora: 'Prevencionista de Riesgos', rolBitacora: 'Prevencionista' }));
            } else if (userSession.rol === 'Supervisor') {
              const defaultSup = supervisorsList[0] || 'Briones Victor';
              setLogForm(prev => ({ ...prev, autorBitacora: defaultSup, rolBitacora: 'Supervisor' }));
            }
          }, [userSession.rol, supervisorsList]);

          const fileInputRef = useRef(null);
          const logFileRef = useRef(null);

          useEffect(() => {
            const on = () => setOnlineStatus(true), off = () => setOnlineStatus(false);
            window.addEventListener('online', on); window.addEventListener('offline', off);
            if (!db) { setLoading(false); return; }
            const unsub = db.collection('employees').onSnapshot(snap => {
              const items = [];
              snap.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
              setEmployees(items); setLoading(false);
            }, () => setLoading(false));
            return () => { unsub(); window.removeEventListener('online', on); window.removeEventListener('offline', off); };
          }, []);

          useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

          const handleDownloadExcel = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(employees, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `bramaq_dotacion_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
          };

          const handleDownloadGlobalLogsExcel = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allGlobalLogs, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `bramaq_hoja_de_vida_global_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
          };

          const handleDeleteAllData = async () => {
            if (userSession.rol !== 'Administrativo' && userSession.rol !== 'AdminContrato') {
              alert("Sin permisos suficientes para realizar borrado masivo.");
              return;
            }
            if (confirm("⚠️ ATENCIÓN CRÍTICA: ¿Estás seguro de eliminar TODOS los registros de la base de datos de la nube para vaciar y volver a cargar desde cero?")) {
              try {
                const batchSize = 400;
                let snapshot = await db.collection('employees').limit(batchSize).get();
                while (!snapshot.empty) {
                  const batch = db.batch();
                  snapshot.docs.forEach((doc) => {
                    batch.delete(doc.ref);
                  });
                  await batch.commit();
                  snapshot = await db.collection('employees').limit(batchSize).get();
                }
                alert("¡Base de datos vaciada con éxito! Ya puedes cargar tu archivo Excel nuevo.");
              } catch (err) {
                alert("Error al vaciar la base de datos: " + err.message);
              }
            }
          };

          const handleUploadExcel = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.readAsArrayBuffer(file);
            reader.onload = async (event) => {
              try {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                const jsonSheet = XLSX.utils.sheet_to_json(worksheet, { defval: "", range: 1 });

                if (jsonSheet.length > 0) {
                  let addedCount = 0;
                  let duplicateCount = 0;
                  let existingRuts = new Set(employees.map(emp => (emp.rut || '').trim().toLowerCase().replace(/[^0-9kK]/g, '')));

                  if (confirm(`Se leyeron ${jsonSheet.length} filas del archivo. ¿Deseas importar omitiendo duplicados por RUT?`)) {
                    for (let row of jsonSheet) {
                      const keys = Object.keys(row);
                      const findVal = (terms) => {
                        for (let t of terms) {
                          const foundKey = keys.find(k => k.toLowerCase().includes(t));
                          if (foundKey && row[foundKey] !== undefined) return String(row[foundKey]).trim();
                        }
                        return '';
                      };

                      const nombre = findVal(['nombre']);
                      const rut = findVal(['rut']);
                      const direccion = findVal(['direccion']);
                      const ciudad = findVal(['ciudad']) || 'Valdivia';
                      const cargo = findVal(['cargo']);
                      const telefono = findVal(['n telefonico', 'telefono', 'fono', 'celular']);
                      const correo = findVal(['correo', 'email']);
                      const emergenciaNombre = findVal(['nombre emergencia', 'emergencia', 'contacto emergencia']);
                      const emergenciaFono = findVal(['fono emergencia', 'telefono emergencia', 'emergencia fono']);

                      const cleanRut = (rut || '').trim().toLowerCase().replace(/[^0-9kK]/g, '');

                      if ((nombre || rut) && cleanRut) {
                        if (!existingRuts.has(cleanRut)) {
                          await db.collection('employees').add({
                            nombre: nombre || 'Sin Nombre',
                            rut: rut || 'Sin RUT',
                            direccion: direccion || '',
                            ciudad: ciudad,
                            cargo: cargo || 'OPERADOR GRUA HORQUILLA',
                            telefono: telefono,
                            correo: correo,
                            emergenciaNombre: emergenciaNombre,
                            emergenciaFono: emergenciaFono,
                            documentos: { contrato: true, induccion: true, examenes: true, epp: true },
                            historial: []
                          });
                          existingRuts.add(cleanRut);
                          addedCount++;
                        } else {
                          duplicateCount++;
                        }
                      }
                    }
                    alert(`¡Importación completada!\n- Nuevos trabajadores únicos agregados: ${addedCount}\n- Duplicados detectados y eliminados/omitidos: ${duplicateCount}`);
                  }
                }
              } catch (err) {
                alert("Error al procesar archivo: " + err.message);
              }
            };
          };

          const handleSave = async (e) => {
            e.preventDefault();
            if (!formData.nombre || !formData.rut) { setFormError("Nombre y RUT obligatorios."); return; }
            try {
              if (currentEmployee) {
                await db.collection('employees').doc(currentEmployee.id).update(formData);
              } else {
                await db.collection('employees').add({ ...formData, historial: [] });
              }
              setIsModalOpen(false); setCurrentEmployee(null);
            } catch (err) { setFormError("Error: " + err.message); }
          };

          const handleDelete = async (id) => {
            if (userSession.rol !== 'Administrativo' && userSession.rol !== 'AdminContrato') { alert("Sin permisos suficientes."); return; }
            if (confirm("¿Eliminar trabajador del sistema?")) await db.collection('employees').doc(id).delete();
          };

          const handleDeleteLog = async (logId) => {
            if (!selectedEmpForHistory) return;
            if (confirm("¿Estás seguro de eliminar esta observación de la hoja de vida?")) {
              try {
                const updatedHistorial = (selectedEmpForHistory.historial || []).filter(h => h.id !== logId);
                await db.collection('employees').doc(selectedEmpForHistory.id).update({
                  historial: updatedHistorial
                });
                setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: updatedHistorial });
                alert("Observación eliminada correctamente.");
              } catch (err) {
                alert("Error al eliminar observación: " + err.message);
              }
            }
          };

          const handleLogFileChange = (e) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = (uploadEvent) => {
                setLogForm({
                  ...logForm,
                  archivoNombre: file.name,
                  archivoUrl: uploadEvent.target.result
                });
              };
              reader.readAsDataURL(file);
            }
          };

          const handleAddLog = async (e) => {
            e.preventDefault();
            if (!selectedEmpForHistory) return;

            const tipoFinal = logForm.tipo === 'Otro' ? (logForm.customTipo || 'Otro evento') : logForm.tipo;

            const logEntry = {
              id: String(Date.now()),
              tipo: String(tipoFinal),
              modoFechas: String(logForm.modoFechas),
              fechaInicio: String(logForm.modoFechas === 'rango' ? logForm.fechaInicio : logForm.fechaUnica),
              fechaTermino: String(logForm.modoFechas === 'rango' ? logForm.fechaTermino : logForm.fechaUnica),
              nota: String(logForm.nota || ''),
              archivoNombre: String(logForm.archivoNombre || ''),
              archivoUrl: String(logForm.archivoUrl || ''),
              autor: String(logForm.autorBitacora),
              rolAutor: String(logForm.rolBitacora),
              createdAt: new Date().toISOString()
            };

            try {
              const updatedHistorial = [...(selectedEmpForHistory.historial || []), logEntry];
              await db.collection('employees').doc(selectedEmpForHistory.id).update({
                historial: updatedHistorial
              });
              
              setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: updatedHistorial });
              setLogForm({
                tipo: 'Licencia Médica',
                modoFechas: 'rango',
                fechaInicio: new Date().toISOString().split('T')[0],
                fechaTermino: new Date().toISOString().split('T')[0],
                fechaUnica: new Date().toISOString().split('T')[0],
                customTipo: '',
                nota: '',
                archivoNombre: '',
                archivoUrl: '',
                autorBitacora: userSession.rol === 'Supervisor' ? (supervisorsList[0] || '') : logForm.autorBitacora,
                rolBitacora: userSession.rol
              });
              alert("Bitácora registrada con éxito.");
            } catch (error) {
              alert("Error al registrar bitácora: " + error.message);
            }
          };

          const getMissingDataList = (emp) => {
            let missing = [];
            if (!emp.telefono) missing.push("Teléfono");
            if (!emp.correo) missing.push("Correo");
            if (!emp.emergenciaNombre || !emp.emergenciaFono) missing.push("Contacto de Emergencia");
            if (emp.documentos) {
              if (!emp.documentos.contrato) missing.push("Contrato");
              if (!emp.documentos.induccion) missing.push("Inducción S.S.O.");
              if (!emp.documentos.examenes) missing.push("Exámenes Ocupacionales");
              if (!emp.documentos.epp) missing.push("Entrega de EPP");
            }
            return missing;
          };

          const filtered = useMemo(() => {
            const seenRuts = new Set();
            const uniqueEmployees = [];
            for (const emp of employees) {
              const cleanR = (emp.rut || '').trim().toLowerCase().replace(/[^0-9kK]/g, '');
              if (cleanR) {
                if (!seenRuts.has(cleanR)) {
                  seenRuts.add(cleanR);
                  uniqueEmployees.push(emp);
                }
              } else {
                uniqueEmployees.push(emp);
              }
            }

            const list = uniqueEmployees.filter(emp => {
              const s = searchTerm.toLowerCase();
              const matchSearch = (emp.nombre||'').toLowerCase().includes(s) || 
                                    (emp.rut||'').toLowerCase().includes(s) || 
                                    (emp.cargo||'').toLowerCase().includes(s) || 
                                    (emp.ciudad||'').toLowerCase().includes(s);

              if (!matchSearch) return false;

              if (activeFilter === 'TODOS') return true;
              if (activeFilter === 'INCOMPLETOS') {
                return getMissingDataList(emp).length > 0;
              }
              if (activeFilter === 'ADMIN_CONTRATO') {
                const c = (emp.cargo || '').toUpperCase();
                return c.includes('ADMINISTRADOR DE CONTRATO') || c.includes('ADMIN. CONTRATO') || c.includes('ADMINISTRADOR');
              }
              if (activeFilter === 'SUPERVISORES') return (emp.cargo||'').toUpperCase().includes('SUPERVISOR');
              if (activeFilter === 'PREVENCIONISTAS') return (emp.cargo||'').toUpperCase().includes('PREVENCION');
              if (activeFilter === 'ADMINISTRATIVOS') return (emp.cargo||'').toUpperCase().includes('ADMINISTRATIVO') && !(emp.cargo||'').toUpperCase().includes('CONTRATO');
              if (activeFilter === 'OPERADORES_GRUA') return (emp.cargo||'').toUpperCase().includes('GRUA');
              if (activeFilter === 'CARGADOR_FRONTAL') return (emp.cargo||'').toUpperCase().includes('CARGADOR FRONTAL');
              if (activeFilter === 'MECANICOS') return (emp.cargo||'').toUpperCase().includes('MECANICO');
              
              if (citiesList.includes(activeFilter)) {
                return (emp.ciudad||'').toLowerCase() === activeFilter.toLowerCase();
              }

              return true;
            });

            return list.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es', { sensitivity: 'base' }));
          }, [employees, searchTerm, activeFilter, citiesList]);

          const kpis = useMemo(() => {
            const total = filtered.length;
            const supervisores = employees.filter(e => (e.cargo||'').toUpperCase().includes('SUPERVISOR')).length;
            const prevencionistas = employees.filter(e => (e.cargo||'').toUpperCase().includes('PREVENCION')).length;
            const administrativos = employees.filter(e => (e.cargo||'').toUpperCase().includes('ADMINISTRATIVO') && !(e.cargo||'').toUpperCase().includes('CONTRATO')).length;
            const adminContrato = employees.filter(e => {
              const c = (e.cargo || '').toUpperCase();
              return c.includes('ADMINISTRADOR DE CONTRATO') || c.includes('ADMIN. CONTRATO') || c.includes('ADMINISTRADOR');
            }).length;
            const operadoresGrua = employees.filter(e => (e.cargo||'').toUpperCase().includes('GRUA')).length;
            const cargadorFrontal = employees.filter(e => (e.cargo||'').toUpperCase().includes('CARGADOR FRONTAL')).length;
            const mecanicos = employees.filter(e => (e.cargo||'').toUpperCase().includes('MECANICO')).length;
            
            const incompletos = employees.filter(e => getMissingDataList(e).length > 0).length;

            const porCiudad = {};
            citiesList.forEach(c => {
              porCiudad[c] = employees.filter(e => (e.ciudad||'').toLowerCase() === c.toLowerCase()).length;
            });

            return { total: employees.length, supervisores, prevencionistas, administrativos, adminContrato, operadoresGrua, cargadorFrontal, mecanicos, incompletos, porCiudad };
          }, [employees, citiesList, filtered]);

          const allGlobalLogs = useMemo(() => {
            let logs = [];
            employees.forEach(emp => {
              if (emp.historial && emp.historial.length > 0) {
                emp.historial.forEach(h => {
                  logs.push({ ...h, empleadoNombre: emp.nombre, empleadoRut: emp.rut });
                });
              }
            });
            return logs.sort((a, b) => new Date(b.fechaInicio || b.createdAt) - new Date(a.fechaInicio || a.createdAt));
          }, [employees]);

          return (
            <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
              
              {/* ENCABEZADO EMPRESARIAL PROFESIONAL */}
              <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 shadow-xl">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                  
                  {/* LOGO E IDENTIDAD BRAMAQ */}
                  <div className="flex items-center gap-3">
                    <div className="bg-gradient-to-br from-amber-500 to-amber-700 p-2.5 rounded-xl text-slate-950 font-black text-xs shadow-md tracking-wider flex items-center gap-1.5">
                      <i data-lucide="hard-hat" className="w-5 h-5 text-slate-950"></i>
                      <span>BRAMAQ</span>
                    </div>
                    <div>
                      <div className="font-bold text-sm sm:text-base tracking-tight text-white flex items-center gap-2">
                        <span>Gestor de Dotación</span>
                        <span className="hidden sm:inline-block px-2 py-0.5 bg-amber-500/10 text-amber-400 text-[10px] font-bold rounded border border-amber-500/30">Enterprise</span>
                      </div>
                      <div className="flex items-center gap-1.5 text-xs text-slate-400">
                        <span className={`w-2 h-2 rounded-full ${onlineStatus ? 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]' : 'bg-red-500 animate-ping'}`}></span>
                        <span>{onlineStatus ? 'Conectado a la Nube (Tiempo Real)' : 'Sin Conexión'}</span>
                      </div>
                    </div>
                  </div>

                  {/* SELECTOR DE PERFIL EMPRESARIAL */}
                  <div className="flex items-center gap-3">
                    <div className="hidden md:flex flex-col text-right">
                      <span className="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Perfil Activo</span>
                      <span className="text-xs font-bold text-amber-400">
                        {userSession.rol === 'Administrativo' && 'Administrativo / RRHH'}
                        {userSession.rol === 'AdminContrato' && 'Administrador de Contrato'}
                        {userSession.rol === 'Supervisor' && 'Supervisor de Faena'}
                        {userSession.rol === 'Prevencionista' && 'Prevencionista'}
                      </span>
                    </div>
                    <div className="bg-slate-950 border border-slate-800 rounded-xl p-1 flex items-center shadow-inner">
                      <select 
                        value={userSession.rol} 
                        onChange={e => setUserSession({ rol: e.target.value })} 
                        className="bg-transparent text-amber-400 font-semibold text-xs py-1.5 px-3 outline-none cursor-pointer"
                      >
                        <option value="Administrativo" className="bg-slate-900 text-slate-200">Administrativo / RRHH</option>
                        <option value="AdminContrato" className="bg-slate-900 text-slate-200">Administrador de Contrato</option>
                        <option value="Supervisor" className="bg-slate-900 text-slate-200">Supervisor de Faena</option>
                        <option value="Prevencionista" className="bg-slate-900 text-slate-200">Prevencionista</option>
                      </select>
                    </div>
                  </div>

                </div>

                {/* NAVEGACIÓN PRINCIPAL PROFESIONAL */}
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex gap-2 border-t border-slate-800/60 py-2">
                  <button 
                    onClick={() => setActiveTab('dashboard')} 
                    className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-semibold transition-all ${activeTab === 'dashboard' ? 'bg-amber-500 text-slate-950 font-bold shadow-lg shadow-amber-500/20' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'}`}
                  >
                    <i data-lucide="layout-dashboard" className="w-4 h-4"></i>
                    <span>Panel Gerencial</span>
                  </button>
                  <button 
                    onClick={() => setActiveTab('directorio')} 
                    className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-semibold transition-all ${activeTab === 'directorio' ? 'bg-amber-500 text-slate-950 font-bold shadow-lg shadow-amber-500/20' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'}`}
                  >
                    <i data-lucide="users" className="w-4 h-4"></i>
                    <span>Directorio y Bitácora</span>
                  </button>
                </div>
              </header>

              {/* CONTENIDO PRINCIPAL */}
              <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 flex-1 w-full">
                {loading ? (
                  <div className="flex flex-col items-center justify-center py-32 space-y-4">
                    <div className="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
                    <p className="text-sm text-slate-400 font-medium">Sincronizando base de datos corporativa...</p>

                      <p className="text-xs font-mono text-amber-400 mt-1">{selectedPhone}</p>
                    </div>
                    <div className="space-y-2 pt-2">
                      <a href={`tel:${selectedPhone}`} className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-bold text-xs flex items-center justify-center gap-2 shadow transition-all">
                        <i data-lucide="phone" className="w-4 h-4"></i> Llamar Directamente
                      </a>
                      <a href={`sms:${selectedPhone}`} className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold text-xs flex items-center justify-center gap-2 shadow transition-all">
                        <i data-lucide="message-square" className="w-4 h-4"></i> Enviar Mensaje de Texto (SMS)
                      </a>
                      <a href={`https://wa.me/${selectedPhone.replace(/[^0-9]/g, '')}`} target="_blank" rel="noopener noreferrer" className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-bold text-xs flex items-center justify-center gap-2 shadow transition-all">
                        <i data-lucide="send" className="w-4 h-4"></i> Enviar WhatsApp
                      </a>
                    </div>
                    <button onClick={() => setSelectedPhone(null)} className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-2xl text-xs font-bold mt-2 transition-all">
                      Cancelar
                    </button>
                  </div>
                </div>
              )}

              {/* MODAL NUEVO / EDITAR FICHA */}
              {isModalOpen && (
                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                  <div className="bg-slate-900 p-6 rounded-3xl w-full max-w-xl border border-slate-800 space-y-4 my-auto max-h-[90vh] overflow-y-auto shadow-2xl">
                    <div className="flex justify-between items-center pb-3 border-b border-slate-800">
                      <h3 className="font-bold text-sm text-white flex items-center gap-2">
                        <i data-lucide="user-cog" className="w-4 h-4 text-amber-400"></i>
                        <span>{currentEmployee ? 'Editar Ficha de Personal' : 'Nuevo Ingreso de Personal'}</span>
                      </h3>
                      <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                    </div>
                    {formError && <div className="text-red-400 text-xs bg-red-950/40 p-3 rounded-xl border border-red-900">{formError}</div>}
                    <form onSubmit={handleSave} className="space-y-4 text-xs">
                      
                      <div className="space-y-3">
                        <div className="font-bold text-amber-400 uppercase text-[10px] tracking-wider">1. Información Personal y Laboral</div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div>
                            <label className="text-[10px] text-slate-400 font-bold">Nombre Completo *</label>
                            <input required placeholder="Ej: Juan Pérez" value={formData.nombre} onChange={e=>setFormData({...formData, nombre:e.target.value})} className="w-full mt-1 p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs outline-none focus:border-amber-500" />
                          </div>
                          <div>
                            <label className="text-[10px] text-slate-400 font-bold">RUT *</label>
                            <input required placeholder="12.345.678-9" value={formData.rut} onChange={e=>setFormData({...formData, rut:e.target.value})} className="w-full mt-1 p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs outline-none focus:border-amber-500 font-mono" />
                          </div>
                        </div>

                        <div>
                          <label className="text-[10px] text-slate-400 font-bold">Cargo / Faena *</label>
                          <select 
                            value={formData.cargo} 
                            onChange={e=>setFormData({...formData, cargo:e.target.value})} 
                            className="w-full mt-1 p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs outline-none focus:border-amber-500 font-medium"
                          >
                            <option value="OPERADOR CARGADOR FRONTAL">OPERADOR CARGADOR FRONTAL</option>
                            <option value="OPERADOR GRUA HORQUILLA">OPERADOR GRUA HORQUILLA</option>
                            <option value="SUPERVISOR TURNO">SUPERVISOR TURNO</option>
                            <option value="MECANICO FAENA">MECÁNICO FAENA</option>
                            <option value="ADMINISTRATIVO FAENA">ADMINISTRATIVO FAENA</option>
                            <option value="ADMINISTRADOR DE CONTRATO">ADMINISTRADOR DE CONTRATO</option>
                            <option value="PREVENCIONISTA DE RIESGOS">PREVENCIONISTA DE RIESGOS</option>
                          </select>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div>
                            <label className="text-[10px] text-slate-400 font-bold">Ciudad</label>
                            <select value={formData.ciudad} onChange={e=>setFormData({...formData, ciudad:e.target.value})} className="w-full mt-1 p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs outline-none focus:border-amber-500">
                              {citiesList.map(c=><option key={c} value={c}>{c}</option>)}
                            </select>
                          </div>
                          <div>
                            <label className="text-[10px] text-slate-400 font-bold">Dirección</label>
                            <input placeholder="Calle o sector" value={formData.direccion} onChange={e=>setFormData({...formData, direccion:e.target.value})} className="w-full mt-1 p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs outline-none" />
                          </div>
                        </div>
                      </div>

                      <div className="space-y-3 pt-2 border-t border-slate-800">
                        <div className="font-bold text-amber-400 uppercase text-[10px] tracking-wider">2. Contacto y Emergencia</div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div>
                            <label className="text-[10px] text-slate-400 font-bold">Teléfono Personal</label>
                            <input placeholder="+569..." value={formData.telefono} onChange={e=>setFormData({...formData, telefono:e.target.value})} className="w-full mt-1 p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs outline-none font-mono" />
                          </div>
                          <div>
                            <label className="text-[10px] text-slate-400 font-bold">Correo Electrónico</label>
                            <input placeholder="correo@bramaq.cl" value={formData.correo} onChange={e=>setFormData({...formData, correo:e.target.value})} className="w-full mt-1 p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs outline-none" />
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div>
                            <label className="text-[10px] text-slate-400 font-bold">Nombre Contacto Emergencia</label>
                            <input placeholder="Familiar o cercano" value={formData.emergenciaNombre} onChange={e=>setFormData({...formData, emergenciaNombre:e.target.value})} className="w-full mt-1 p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs outline-none" />
                          </div>
                          <div>
                            <label className="text-[10px] text-slate-400 font-bold">Fono Emergencia</label>
                            <input placeholder="+569..." value={formData.emergenciaFono} onChange={e=>setFormData({...formData, emergenciaFono:e.target.value})} className="w-full mt-1 p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs outline-none font-mono" />
                          </div>
                        </div>
                      </div>

                      <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-2">
                        <label className="text-[10px] text-amber-400 font-bold block uppercase tracking-wider">Control de Documentación y Requisitos S.S.O.:</label>
                        <div className="grid grid-cols-2 gap-3 pt-1">
                          <label className="flex items-center gap-2 cursor-pointer text-slate-300">
                            <input type="checkbox" checked={formData.documentos?.contrato ?? true} onChange={e => setFormData({...formData, documentos: { ...(formData.documentos || {}), contrato: e.target.checked }})} className="rounded bg-slate-900 border-slate-700 text-amber-500 focus:ring-0" /> Contrato Firmado
                          </label>
                          <label className="flex items-center gap-2 cursor-pointer text-slate-300">
                            <input type="checkbox" checked={formData.documentos?.induccion ?? true} onChange={e => setFormData({...formData, documentos: { ...(formData.documentos || {}), induccion: e.target.checked }})} className="rounded bg-slate-900 border-slate-700 text-amber-500 focus:ring-0" /> Inducción S.S.O.
                          </label>
                          <label className="flex items-center gap-2 cursor-pointer text-slate-300">
                            <input type="checkbox" checked={formData.documentos?.examenes ?? true} onChange={e => setFormData({...formData, documentos: { ...(formData.documentos || {}), examenes: e.target.checked }})} className="rounded bg-slate-900 border-slate-700 text-amber-500 focus:ring-0" /> Exámenes Ocup.
                          </label>
                          <label className="flex items-center gap-2 cursor-pointer text-slate-300">
                            <input type="checkbox" checked={formData.documentos?.epp ?? true} onChange={e => setFormData({...formData, documentos: { ...(formData.documentos || {}), epp: e.target.checked }})} className="rounded bg-slate-900 border-slate-700 text-amber-500 focus:ring-0" /> Entrega EPP
                          </label>
                        </div>
                      </div>

                      <div className="flex justify-end gap-3 pt-3 border-t border-slate-800">
                        <button type="button" onClick={()=>setIsModalOpen(false)} className="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-semibold transition-all">Cancelar</button>
                        <button type="submit" className="px-6 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl shadow-lg transition-all">Guardar Ficha</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {/* MODAL BITÁCORA / HOJA DE VIDA */}
              {isHistoryModalOpen && selectedEmpForHistory && (
                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                  <div className="bg-slate-900 p-6 rounded-3xl w-full max-w-xl border border-slate-800 space-y-4 my-auto max-h-[90vh] overflow-y-auto shadow-2xl">
                    <div className="flex justify-between items-center pb-3 border-b border-slate-800">
                      <div>
                        <h3 className="font-bold text-sm text-white">Hoja de Vida / Bitácora: {selectedEmpForHistory.nombre}</h3>
                        <span className="text-xs text-slate-400 font-mono">{selectedEmpForHistory.rut}</span>
                      </div>
                      <button onClick={() => setIsHistoryModalOpen(false)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                    </div>

                    <div className="space-y-3 max-h-56 overflow-y-auto pr-1">
                      {(!selectedEmpForHistory.historial || selectedEmpForHistory.historial.length === 0) ? (
                        <div className="p-8 text-center text-slate-500 text-xs bg-slate-950 rounded-2xl border border-slate-800">
                          Sin registros previos en la hoja de vida.
                        </div>
                      ) : (
                        selectedEmpForHistory.historial.map(h => (
                          <div key={h.id} className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-2 relative shadow-inner">
                            <div className="flex justify-between items-center">
                              <span className="font-bold text-amber-400 text-xs px-2.5 py-0.5 bg-amber-500/10 rounded-lg border border-amber-500/20">{h.tipo}</span>
                              <div className="flex items-center gap-3">
                                <span className="text-[11px] text-slate-400 font-mono">
                                  {h.modoFechas === 'unica' ? `Día: ${h.fechaInicio}` : `Del ${h.fechaInicio} al ${h.fechaTermino}`}
                                </span>
                                {(userSession.rol === 'Administrativo' || userSession.rol === 'AdminContrato') && (
                                  <button 
                                    onClick={() => handleDeleteLog(h.id)} 
                                    className="text-red-400 hover:text-red-300 p-1 rounded-lg bg-slate-900 border border-slate-800 transition-colors" 
                                    title="Eliminar observación"
                                  >
                                    <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                                  </button>
                                )}
                              </div>
                            </div>
                            {h.nota && <p className="text-slate-300 text-xs leading-relaxed">{h.nota}</p>}
                            {h.archivoUrl && (
                              <div className="mt-1">
                                {h.archivoUrl.startsWith('data:image') ? (
                                  <img src={h.archivoUrl} alt="Adjunto" className="max-h-28 rounded-xl border border-slate-800 mt-1 shadow" />
                                ) : (
                                  <a href={h.archivoUrl} download={h.archivoName || "archivo_adjunto"} className="text-xs text-blue-400 underline flex items-center gap-1 font-semibold">
                                    📎 Descargar archivo adjunto
                                  </a>
                                )}
                              </div>
                            )}
                            <div className="text-[11px] text-slate-400 pt-2 border-t border-slate-900 flex justify-between items-center">
                              <span className="text-indigo-400 font-medium">Registrado por: {h.autor}</span>
                              <span className="uppercase text-[9px] bg-slate-900 px-2 py-0.5 rounded text-slate-300 font-bold border border-slate-800">{h.rolAutor}</span>
                            </div>
                          </div>
                        ))
                      )}
                    </div>

                    <form onSubmit={handleAddLog} className="space-y-3 text-xs pt-3 border-t border-slate-800">
                      <div className="text-xs font-bold text-amber-400 flex items-center gap-1.5">
                        <i data-lucide="plus-circle" className="w-4 h-4"></i>
                        <span>Registrar Nuevo Evento en Historial</span>
                      </div>
                      
                      {/* AISLAMIENTO ESTRICTO: SUPERVISOR CON DESPLEGABLE DE NOMBRE, LOS DEMÁS SIN NOMBRE */}
                      <div>
                        <label className="text-[10px] text-slate-400 font-bold">Responsable / Perfil de Ingreso</label>
                        {userSession.rol === 'Supervisor' ? (
                          <select 
                            value={logForm.autorBitacora} 
                            onChange={e => setLogForm({...logForm, autorBitacora: e.target.value, rolBitacora: 'Supervisor'})} 
                            className="w-full mt-1 p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-amber-400 font-bold text-xs"
                          >
                            {supervisorsList.map(sup => (
                              <option key={sup} value={sup}>{sup} (Supervisor)</option>
                            ))}
                          </select>
                        ) : userSession.rol === 'Prevencionista' ? (
                          <input 
                            disabled 
                            value="Prevencionista de Riesgos" 
                            className="w-full mt-1 p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-emerald-400 font-bold text-xs cursor-not-allowed" 
                          />
                        ) : userSession.rol === 'AdminContrato' ? (
                          <input 
                            disabled 
                            value="Administrador de Contrato" 
                            className="w-full mt-1 p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-amber-400 font-bold text-xs cursor-not-allowed" 
                          />
                        ) : (
                          <input 
                            disabled 
                            value="Administrativo / RRHH" 
                            className="w-full mt-1 p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-indigo-400 font-bold text-xs cursor-not-allowed" 
                          />
                        )}
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="text-[10px] text-slate-400 font-bold">Tipo de Evento</label>
                          <select 
                            value={logForm.tipo} 
                            onChange={e => setLogForm({...logForm, tipo: e.target.value})} 
                            className="w-full mt-1 p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs"
                          >
                            <option value="Licencia Médica">Licencia Médica</option>
                            <option value="Extensión de Licencia">Extensión de Licencia</option>
                            <option value="Permiso sin goce de sueldo">Permiso sin goce de sueldo</option>
                            <option value="Enmendaduras">Enmendaduras</option>
                            <option value="Falta a Reunión">Falta a Reunión</option>
                            <option value="Incidente">Incidente</option>
                            <option value="Otro">Otro (Especificar)</option>
                          </select>
                        </div>
                        <div>
                          <label className="text-[10px] text-slate-400 font-bold">Modo de Duración</label>
                          <div className="flex gap-4 mt-2 text-slate-300">
                            <label className="flex items-center gap-1.5 cursor-pointer">
                              <input type="radio" name="modoFechas" checked={logForm.modoFechas === 'rango'} onChange={() => setLogForm({...logForm, modoFechas: 'rango'})} className="text-amber-500 focus:ring-0" /> Rango
                            </label>
                            <label className="flex items-center gap-1.5 cursor-pointer">
                              <input type="radio" name="modoFechas" checked={logForm.modoFechas === 'unica'} onChange={() => setLogForm({...logForm, modoFechas: 'unica'})} className="text-amber-500 focus:ring-0" /> Fecha única
                            </label>
                          </div>
                        </div>
                      </div>

                      {logForm.tipo === 'Otro' && (
                        <div>
                          <label className="text-[10px] text-slate-400 font-bold">Especificar otro evento</label>
                          <input type="text" placeholder="Ej: Felicitación, Capacitación..." value={logForm.customTipo} onChange={e => setLogForm({...logForm, customTipo: e.target.value})} className="w-full mt-1 p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs" />
                        </div>
                      )}

                      {logForm.modoFechas === 'rango' ? (
                        <div className="grid grid-cols-2 gap-3">
                          <div>
                            <span className="text-[10px] text-slate-400 font-bold">Fecha Inicio</span>
                            <input type="date" value={logForm.fechaInicio} onChange={e=>setLogForm({...logForm, fechaInicio:e.target.value})} className="w-full mt-1 p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs" />
                          </div>
                          <div>
                            <span className="text-[10px] text-slate-400 font-bold">Fecha Término</span>
                            <input type="date" value={logForm.fechaTermino} onChange={e=>setLogForm({...logForm, fechaTermino:e.target.value})} className="w-full mt-1 p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs" />
                          </div>
                        </div>
                      ) : (
                        <div>
                          <span className="text-[10px] text-slate-400 font-bold">Día del evento</span>
                          <input type="date" value={logForm.fechaUnica} onChange={e=>setLogForm({...logForm, fechaUnica:e.target.value})} className="w-full mt-1 p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs" />
                        </div>
                      )}

                      <div>
                        <label className="text-[10px] text-slate-400 font-bold">Observación u Observaciones (Opcional)</label>
                        <textarea placeholder="Escriba detalles, acuerdos o comentarios..." value={logForm.nota} onChange={e=>setLogForm({...logForm, nota:e.target.value})} className="w-full mt-1 p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs" rows="2"></textarea>
                      </div>

                      <div className="flex justify-end gap-3 pt-2">
                        <button type="button" onClick={()=>setIsHistoryModalOpen(false)} className="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-semibold transition-all">Cerrar</button>
                        <button type="submit" className="px-6 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl shadow-lg transition-all">Registrar Evento</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {/* MODAL HOJA DE VIDA GLOBAL */}
              {isGlobalHistoryOpen && (
                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                  <div className="bg-slate-900 p-6 rounded-3xl w-full max-w-2xl border border-slate-800 space-y-4 my-auto shadow-2xl">
                    <div className="flex justify-between items-center pb-3 border-b border-slate-800">
                      <div>
                        <h3 className="text-sm font-bold text-white">Hoja de Vida Global (Consolidado de Bitácoras)</h3>
                        <span className="text-xs text-slate-400">Historial general de eventos por supervisores y administración</span>
                      </div>
                      <button onClick={() => setIsGlobalHistoryOpen(false)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                    </div>

                    <div className="space-y-3 max-h-96 overflow-y-auto pr-1">
                      {allGlobalLogs.length === 0 ? (
                        <div className="p-12 text-center text-slate-500 text-xs bg-slate-950 rounded-2xl border border-slate-800">
                          No hay observaciones registradas en ningún trabajador.
                        </div>
                      ) : (
                        allGlobalLogs.map((log, idx) => (
                          <div key={idx} className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-2 shadow-inner">
                            <div className="flex justify-between items-center">
                              <span className="font-bold text-white text-xs">{log.empleadoNombre} <span className="text-[11px] text-slate-400 font-mono">({log.empleadoRut})</span></span>
                              <span className="px-2.5 py-0.5 rounded-lg text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20">{log.tipo}</span>
                            </div>
                            {log.nota && <p className="text-slate-300 text-xs">{log.nota}</p>}
                            <div className="flex justify-between text-[11px] text-slate-500 pt-2 border-t border-slate-900">
                              <span>Fecha: {log.fechaInicio}</span>
                              <span className="text-indigo-400 font-bold">Registrado por: {log.autor} ({log.rolAutor})</span>
                            </div>
                          </div>
                        ))
                      )}
                    </div>

                    <div className="flex justify-between pt-3 border-t border-slate-800">
                      <button onClick={handleDownloadGlobalLogsExcel} className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs flex items-center gap-2 shadow transition-all">
                        <i data-lucide="download" className="w-4 h-4"></i> Descargar Historial Global
                      </button>
                      <button onClick={() => setIsGlobalHistoryOpen(false)} className="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs transition-all">Cerrar</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
