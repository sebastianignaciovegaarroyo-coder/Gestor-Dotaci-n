<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAMAQ - Gestor Enterprise Master Cloud</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDKs (Compat / Modular via CDN para máxima estabilidad inmediata) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-12">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ==========================================
        // CONFIGURACIÓN DE FIREBASE (NUBE EN TIEMPO REAL)
        // ==========================================
        // Reemplaza estas credenciales con las de tu proyecto real de Firebase Console
        const firebaseConfig = {
          apiKey: "TU_API_KEY_AQUI",
          authDomain: "tu-proyecto.firebaseapp.com",
          projectId: "tu-proyecto",
          storageBucket: "tu-proyecto.appspot.com",
          messagingSenderId: "123456789",
          appId: "1:123456789:web:abcde"
        };

        // Inicializar Firebase de forma segura (con manejo si ya está inicializada)
        let db;
        try {
          if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
          }
          db = firebase.firestore();
          // Habilitar persistencia offline para evitar pérdida de datos sin internet
          db.enablePersistence().catch((err) => {
            console.warn("Persistencia offline no disponible en este entorno:", err.code);
          });
        } catch (error) {
          console.error("Error inicializando Firebase:", error);
        }

        function App() {
          const [employees, setEmployees] = useState([]);
          const [loading, setLoading] = useState(true);
          const [onlineStatus, setOnlineStatus] = useState(navigator.onLine);
          const [searchTerm, setSearchTerm] = useState('');
          const [activeFilter, setActiveFilter] = useState('TODOS');
          const [activeTab, setActiveTab] = useState('directorio');
          
          // Modales y Estados de Formulario
          const [isModalOpen, setIsModalOpen] = useState(false);
          const [currentEmployee, setCurrentEmployee] = useState(null);
          const [formError, setFormError] = useState('');
          const [isHistoryModalOpen, setIsHistoryModalOpen] = useState(false);
          const [selectedEmpForHistory, setSelectedEmpForHistory] = useState(null);
          
          // Control de Roles Simulado / Real
          const [userSession, setUserSession] = useState({
            nombre: "Administrador General",
            rol: "Administrativo" // Administrativo, Supervisor, Prevencionista
          });

          const [formData, setFormData] = useState({
            nombre: '', rut: '', direccion: '', ciudad: 'Valdivia', cargo: '', telefono: '', correo: '', emergenciaNombre: '', emergenciaFono: ''
          });

          const [newLog, setNewLog] = useState({
            tipo: 'Licencia Médica',
            fechaInicio: new Date().toISOString().split('T')[0],
            fechaTermino: new Date().toISOString().split('T')[0],
            nota: ''
          });

          // ==========================================
          // SINCRONIZACIÓN EN TIEMPO REAL CON FIRESTORE
          // ==========================================
          useEffect(() => {
            const handleOnline = () => setOnlineStatus(true);
            const handleOffline = () => setOnlineStatus(false);
            window.addEventListener('online', handleOnline);
            window.addEventListener('offline', handleOffline);

            if (!db) {
              setLoading(false);
              return;
            }

            // onSnapshot escucha cambios en tiempo real desde la nube sin requerir F5
            const unsubscribe = db.collection('employees').onSnapshot((snapshot) => {
              const items = [];
              snapshot.forEach((doc) => {
                items.push({ id: doc.id, ...doc.data() });
              });
              setEmployees(items);
              setLoading(false);
            }, (error) => {
              console.error("Error al sincronizar en tiempo real:", error);
              setFormError("Error de sincronización con la nube. Verifique su conexión.");
              setLoading(false);
            });

            return () => {
              unsubscribe();
              window.removeEventListener('online', handleOnline);
              window.removeEventListener('offline', handleOffline);
            };
          }, []);

          useEffect(() => {
            if (window.lucide) window.lucide.createIcons();
          });

          // ==========================================
          // OPERACIONES CRUD EN LA NUBE
          // ==========================================
          const handleSaveEmployee = async (e) => {
            e.preventDefault();
            setFormError('');

            if (!formData.nombre || !formData.rut) {
              setFormError("El Nombre y el RUT son obligatorios.");
              return;
            }

            try {
              if (currentEmployee) {
                // Actualizar registro existente
                await db.collection('employees').doc(currentEmployee.id).update({
                  ...formData,
                  updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
              } else {
                // Crear nuevo registro
                await db.collection('employees').add({
                  ...formData,
                  historial: [],
                  createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
              }
              setIsModalOpen(false);
              setCurrentEmployee(null);
            } catch (error) {
              setFormError("Error al guardar en la nube: " + error.message);
            }
          };

          const handleDeleteEmployee = async (id) => {
            if (userSession.rol !== 'Administrativo') {
              alert("No cuenta con permisos de Administrador para eliminar registros.");
              return;
            }
            if (confirm("¿Está seguro de eliminar este trabajador del sistema central?")) {
              try {
                await db.collection('employees').doc(id).delete();
              } catch (error) {
                alert("Error al eliminar: " + error.message);
              }
            }
          };

          // Agregar evento a la Hoja de Vida (Bitácora) en tiempo real
          const handleAddLog = async (e) => {
            e.preventDefault();
            if (!selectedEmpForHistory) return;

            const logEntry = {
              id: Date.now().toString(),
              tipo: newLog.tipo,
              fechaInicio: newLog.fechaInicio,
              fechaTermino: newLog.fechaTermino,
              nota: newLog.nota,
              autor: userSession.nombre,
              rolAutor: userSession.rol,
              createdAt: new Date().toISOString()
            };

            try {
              const updatedHistorial = [...(selectedEmpForHistory.historial || []), logEntry];
              await db.collection('employees').doc(selectedEmpForHistory.id).update({
                historial: updatedHistorial
              });
              
              setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: updatedHistorial });
              setNewLog({ tipo: 'Licencia Médica', fechaInicio: new Date().toISOString().split('T')[0], fechaTermino: new Date().toISOString().split('T')[0], nota: '' });
              alert("Evento agregado correctamente a la Hoja de Vida.");
            } catch (error) {
              alert("Error al registrar evento: " + error.message);
            }
          };

          // Filtros inteligentes y KPIs
          const filteredEmployees = useMemo(() => {
            return employees.filter(emp => {
              const matchesSearch = (emp.nombre || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                                    (emp.rut || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                                    (emp.cargo || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                                    (emp.ciudad || '').toLowerCase().includes(searchTerm.toLowerCase());
              
              if (activeFilter === 'INCOMPLETOS') return matchesSearch && (!emp.telefono || !emp.correo || !emp.emergenciaNombre);
              if (activeFilter === 'SUPERVISORES') return matchesSearch && (emp.cargo || '').toUpperCase().includes('SUPERVISOR');
              if (activeFilter === 'PREVENCION') return matchesSearch && (emp.cargo || '').toUpperCase().includes('PREVENCION');
              return matchesSearch;
            }).sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));
          }, [employees, searchTerm, activeFilter]);

          const kpis = useMemo(() => {
            const total = employees.length;
            const supervisores = employees.filter(e => (e.cargo || '').toUpperCase().includes('SUPERVISOR')).length;
            const prevencionistas = employees.filter(e => (e.cargo || '').toUpperCase().includes('PREVENCION')).length;
            const incompletos = employees.filter(e => !e.telefono || !e.emergenciaNombre).length;
            return { total, supervisores, prevencionistas, incompletos };
          }, [employees]);

          return (
            <div className="min-h-screen bg-slate-950 text-slate-100">
              {/* BARRA DE ESTADO DE CONEXIÓN */}
              <div className={`text-center text-xs py-1 font-bold ${onlineStatus ? 'bg-emerald-950 text-emerald-400 border-b border-emerald-900' : 'bg-red-950 text-red-400 border-b border-red-950 animate-pulse'}`}>
                {onlineStatus ? '🟢 Sistema Conectado a la Nube en Tiempo Real (Multi-Usuario Activo)' : '🔴 Sin Conexión a Internet - Trabajando en Modo Local (Se sincronizará al reconectar)'}
              </div>

              {/* NAVEGACIÓN PRINCIPAL */}
              <nav className="bg-slate-900 border-b border-slate-800 sticky top-0 z-20 shadow-xl">
                <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
                  <div className="flex items-center gap-3">
                    <div className="bg-amber-600 p-2.5 rounded-xl text-white font-black text-sm shadow">🏗️ BRAMAQ CLOUD</div>
                    <div>
                      <h1 className="font-bold text-lg text-white leading-tight">Gestor Enterprise Master</h1>
                      <span className="text-[10px] text-slate-400 uppercase tracking-widest font-semibold">Web & Desktop Sync Engine</span>
                    </div>
                  </div>

                  {/* SELECTOR DE ROL Y USUARIO */}
                  <div className="flex items-center gap-3 bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700 text-xs">
                    <span className="font-bold text-slate-300">Rol Activo:</span>
                    <select 
                      value={userSession.rol} 
                      onChange={(e) => setUserSession({ ...userSession, rol: e.target.value })} 
                      className="bg-slate-950 font-bold text-amber-400 px-2 py-1 rounded border border-slate-700 outline-none cursor-pointer"
                    >
                      <option value="Administrativo">Administrador (Control Total)</option>
                      <option value="Supervisor">Supervisor de Faena</option>
                      <option value="Prevencionista">Prevencionista de Riesgos</option>
                    </select>
                  </div>

                  <div className="flex gap-2">
                    <button onClick={() => setActiveTab('dashboard')} className={`px-4 py-2 rounded-xl text-sm font-medium transition-all ${activeTab === 'dashboard' ? 'bg-amber-600 text-white font-bold' : 'text-slate-300 hover:bg-slate-800'}`}>Panel</button>
                    <button onClick={() => setActiveTab('directorio')} className={`px-4 py-2 rounded-xl text-sm font-medium transition-all ${activeTab === 'directorio' ? 'bg-amber-600 text-white font-bold' : 'text-slate-300 hover:bg-slate-800'}`}>Directorio en Vivo</button>
                  </div>
                </div>
              </nav>

              <main className="max-w-7xl mx-auto px-4 mt-6">
                {loading ? (
                  <div className="flex justify-center items-center py-24">
                    <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-amber-500"></div>
                  </div>
                ) : (
                  <>
                    {activeTab === 'dashboard' && (
                      <div className="space-y-6">
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                          <div onClick={() => setActiveFilter('TODOS')} className="bg-slate-900 p-5 rounded-2xl border border-slate-800 cursor-pointer hover:border-amber-500 transition-all">
                            <span className="text-slate-400 text-xs font-medium block">Total Dotación Nube</span>
                            <span className="text-3xl font-bold text-white mt-1 block">{kpis.total}</span>
                          </div>
                          <div onClick={() => setActiveFilter('SUPERVISORES')} className="bg-slate-900 p-5 rounded-2xl border border-slate-800 cursor-pointer hover:border-amber-500 transition-all">
                            <span className="text-slate-400 text-xs font-medium block">Supervisores</span>
                            <span className="text-3xl font-bold text-indigo-400 mt-1 block">{kpis.supervisores}</span>
                          </div>
                          <div onClick={() => setActiveFilter('PREVENCION')} className="bg-slate-900 p-5 rounded-2xl border border-slate-800 cursor-pointer hover:border-amber-500 transition-all">
                            <span className="text-slate-400 text-xs font-medium block">Prevención</span>
                            <span className="text-3xl font-bold text-emerald-400 mt-1 block">{kpis.prevencionistas}</span>
                          </div>
                          <div onClick={() => setActiveFilter('INCOMPLETOS')} className="bg-slate-900 p-5 rounded-2xl border border-red-950/40 cursor-pointer hover:border-red-500 transition-all">
                            <span className="text-red-400 text-xs font-medium block">Datos Incompletos</span>
                            <span className="text-3xl font-bold text-red-400 mt-1 block">{kpis.incompletos}</span>
                          </div>
                        </div>
                      </div>
                    )}

                    {activeTab === 'directorio' && (
                      <div>
                        <div className="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
                          <div className="w-full md:w-1/3 relative">
                            <i data-lucide="search" className="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400"></i>
                            <input 
                              type="text" 
                              className="w-full pl-9 pr-4 py-2.5 bg-slate-900 border border-slate-800 text-white rounded-xl text-sm outline-none focus:ring-2 focus:ring-amber-500" 
                              placeholder="Buscar en tiempo real por nombre, RUT, cargo..." 
                              value={searchTerm} 
                              onChange={(e) => setSearchTerm(e.target.value)} 
                            />
                          </div>

                          <div className="flex gap-3 w-full md:w-auto justify-end">
                            {activeFilter !== 'TODOS' && (
                              <button onClick={() => setActiveFilter('TODOS')} className="bg-slate-800 text-amber-400 px-3 py-2 rounded-xl text-xs font-bold border border-slate-700">
                                Limpiar Filtro ({activeFilter})
                              </button>
                            )}
                            <button 
                              onClick={() => {
                                setCurrentEmployee(null);
                                setFormData({nombre: '', rut: '', direccion: '', ciudad: 'Valdivia', cargo: '', telefono: '', correo: '', emergenciaNombre: '', emergenciaFono: ''});
                                setIsModalOpen(true);
                              }} 
                              className="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2.5 rounded-xl shadow font-bold text-sm flex items-center transition-all"
                            >
                              <i data-lucide="user-plus" className="w-4 h-4 mr-2"></i> Nuevo Trabajador
                            </button>
                          </div>
                        </div>

                        {/* TABLA DE REGISTROS */}
                        <div className="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-2xl">
                          <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                              <thead>
                                <tr className="bg-slate-950 border-b border-slate-800 text-slate-400 text-xs uppercase tracking-wider">
                                  <th className="p-4 font-semibold">Trabajador / RUT</th>
                                  <th className="p-4 font-semibold">Cargo y Ciudad</th>
                                  <th className="p-4 font-semibold">Contacto Directo</th>
                                  <th className="p-4 font-semibold">Emergencia</th>
                                  <th className="p-4 font-semibold text-center">Hoja de Vida</th>
                                  <th className="p-4 font-semibold text-right">Acciones</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-800/60">
                                {filteredEmployees.length === 0 ? (
                                  <tr>
                                    <td colSpan="6" className="p-8 text-center text-slate-500 text-sm">No se encontraron registros en la base de datos cloud.</td>
                                  </tr>
                                ) : (
                                  filteredEmployees.map(emp => (
                                    <tr key={emp.id} className="hover:bg-slate-800/30 transition-colors">
                                      <td className="p-4">
                                        <div className="font-bold text-white">{emp.nombre}</div>
                                        <div className="text-xs text-slate-400 font-mono mt-0.5">{emp.rut}</div>
                                      </td>
                                      <td className="p-4">
                                        <span className="px-2.5 py-1 rounded-full text-xs font-bold bg-amber-950/60 text-amber-300 border border-amber-900/50">{emp.cargo || 'Sin cargo'}</span>
                                        <div className="text-xs text-slate-400 mt-1">{emp.ciudad}</div>
                                      </td>
                                      <td className="p-4 text-sm">
                                        {emp.telefono ? (
                                          <div className="flex flex-col gap-1">
                                            <span className="text-slate-200 font-medium">{emp.telefono}</span>
                                            <div className="flex gap-2 text-xs">
                                              <a href={`tel:${emp.telefono}`} className="text-blue-400 bg-blue-950/40 px-2 py-0.5 rounded border border-blue-900">📞 Llamar</a>
                                              <a href={`https://wa.me/${emp.telefono.replace(/[^0-9]/g, '')}`} target="_blank" rel="noopener noreferrer" className="text-emerald-400 bg-emerald-950/40 px-2 py-0.5 rounded border border-emerald-900">💬 WhatsApp</a>
                                            </div>
                                          </div>
                                        ) : <span className="text-red-400 text-xs">Sin teléfono</span>}
                                      </td>
                                      <td className="p-4 text-sm">
                                        <div className="font-medium text-slate-200">{emp.emergenciaNombre || 'No asignado'}</div>
                                        <div className="text-xs text-slate-400">{emp.emergenciaFono}</div>
                                      </td>
                                      <td className="p-4 text-center">
                                        <button 
                                          onClick={() => { setSelectedEmpForHistory(emp); setIsHistoryModalOpen(true); }}
                                          className="bg-slate-800 hover:bg-slate-700 text-amber-400 px-3 py-1.5 rounded-xl text-xs font-bold border border-slate-700 flex items-center gap-1 mx-auto"
                                        >
                                          <i data-lucide="file-text" className="w-3.5 h-3.5"></i> 
                                          <span>({emp.historial ? emp.historial.length : 0}) Eventos</span>
                                        </button>
                                      </td>
                                      <td className="p-4 text-right">
                                        <div className="flex justify-end gap-1">
                                          <button onClick={() => { setCurrentEmployee(emp); setFormData(emp); setIsModalOpen(true); }} className="text-slate-400 hover:text-amber-400 p-2" title="Editar">
                                            <i data-lucide="edit-3" className="w-4 h-4"></i>
                                          </button>
                                          {userSession.rol === 'Administrativo' && (
                                            <button onClick={() => handleDeleteEmployee(emp.id)} className="text-slate-400 hover:text-red-400 p-2" title="Eliminar">
                                              <i data-lucide="trash-2" className="w-4 h-4"></i>
                                            </button>
                                          )}
                                        </div>
                                      </td>
                                    </tr>
                                  ))
                                )}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      </div>
                    )}
                  </>
                )}
              </main>

              {/* MODAL DE CREACIÓN / EDICIÓN */}
              {isModalOpen && (
                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                  <div className="bg-slate-900 rounded-3xl shadow-2xl w-full max-w-xl border border-slate-800 p-6">
                    <div className="flex justify-between items-center pb-4 border-b border-slate-800 mb-4">
                      <h3 className="text-lg font-bold text-white">{currentEmployee ? 'Editar Ficha de Trabajador' : 'Nuevo Registro de Trabajador'}</h3>
                      <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                    </div>
                    {formError && <div className="mb-4 p-3 bg-red-950/80 text-red-400 text-xs rounded-xl border border-red-900">{formError}</div>}
                    <form onSubmit={handleSaveEmployee} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="text-xs font-bold text-slate-300">Nombre Completo *</label>
                        <input required type="text" value={formData.nombre} onChange={(e) => setFormData({...formData, nombre: e.target.value})} className="w-full mt-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm outline-none focus:border-amber-500" placeholder="Ej: Pérez Soto Juan" />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-slate-300">RUT *</label>
                        <input required type="text" value={formData.rut} onChange={(e) => setFormData({...formData, rut: e.target.value})} className="w-full mt-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm outline-none focus:border-amber-500" placeholder="12.345.678-9" />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-slate-300">Cargo Operativo</label>
                        <input type="text" value={formData.cargo} onChange={(e) => setFormData({...formData, cargo: e.target.value})} className="w-full mt-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm outline-none focus:border-amber-500" placeholder="Ej: OPERADOR GRUA" />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-slate-300">Ciudad de Faena</label>
                        <select value={formData.ciudad} onChange={(e) => setFormData({...formData, ciudad: e.target.value})} className="w-full mt-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm outline-none focus:border-amber-500">
                          <option value="Valdivia">Valdivia</option>
                          <option value="Lanco">Lanco</option>
                          <option value="Loncoche">Loncoche</option>
                          <option value="San José de la Mariquina">San José de la Mariquina</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-xs font-bold text-slate-300">Teléfono Personal</label>
                        <input type="text" value={formData.telefono} onChange={(e) => setFormData({...formData, telefono: e.target.value})} className="w-full mt-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm outline-none focus:border-amber-500" placeholder="+56 9 ..." />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-slate-300">Correo Electrónico</label>
                        <input type="email" value={formData.correo} onChange={(e) => setFormData({...formData, correo: e.target.value})} className="w-full mt-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm outline-none focus:border-amber-500" placeholder="correo@mail.com" />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-slate-300">Contacto de Emergencia</label>
                        <input type="text" value={formData.emergenciaNombre} onChange={(e) => setFormData({...formData, emergenciaNombre: e.target.value})} className="w-full mt-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm outline-none focus:border-amber-500" placeholder="Nombre Familiar" />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-slate-300">Teléfono Emergencia</label>
                        <input type="text" value={formData.emergenciaFono} onChange={(e) => setFormData({...formData, emergenciaFono: e.target.value})} className="w-full mt-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm outline-none focus:border-amber-500" placeholder="+56 9 ..." />
                      </div>
                      <div className="md:col-span-2 flex justify-end gap-2 mt-4 pt-4 border-t border-slate-800">
                        <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 text-sm text-slate-300 hover:bg-slate-800 rounded-xl">Cancelar</button>
                        <button type="submit" className="px-5 py-2 text-sm bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl shadow-lg">Guardar en la Nube</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {/* MODAL DE HOJA DE VIDA / HISTORIAL */}
              {isHistoryModalOpen && selectedEmpForHistory && (
                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                  <div className="bg-slate-900 rounded-3xl shadow-2xl w-full max-w-2xl border border-slate-800 p-6">
                    <div className="flex justify-between items-center pb-4 border-b border-slate-800 mb-4">
                      <div>
                        <h3 className="text-lg font-bold text-white">Hoja de Vida: {selectedEmpForHistory.nombre}</h3>
                        <span className="text-xs text-slate-400 font-mono">RUT: {selectedEmpForHistory.rut}</span>
                      </div>
                      <button onClick={() => setIsHistoryModalOpen(false)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                    </div>

                    <div className="space-y-4 max-h-64 overflow-y-auto pr-2 mb-6">
                      {(!selectedEmpForHistory.historial || selectedEmpForHistory.historial.length === 0) ? (
                        <p className="text-slate-500 text-sm text-center py-4">No hay eventos registrados en la hoja de vida de este trabajador.</p>
                      ) : (
                        selectedEmpForHistory.historial.map((log) => (
                          <div key={log.id} className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-1">
                            <div className="flex justify-between items-center">
                              <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-950 text-amber-300 border border-amber-900">{log.tipo}</span>
                              <span className="text-xs text-slate-400 font-mono">{log.fechaInicio} {log.fechaTermino && ` al ${log.fechaTermino}`}</span>
                            </div>
                            <p className="text-sm text-slate-200 mt-2">{log.nota}</p>
                            <div className="text-[10px] text-slate-400 text-right mt-1">Registrado por: {log.autor} ({log.rolAutor})</div>
                          </div>
                        ))
                      )}
                    </div>

                    {/* FORMULARIO NUEVO EVENTO */}
                    <form onSubmit={handleAddLog} className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                      <h4 className="text-xs font-bold uppercase tracking-wider text-amber-400">Agregar Nuevo Evento / Bitácora</h4>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                          <label className="text-[10px] font-bold text-slate-400">Tipo de Evento</label>
                          <select value={newLog.tipo} onChange={(e) => setNewLog({...newLog, tipo: e.target.value})} className="w-full mt-1 px-2.5 py-1.5 bg-slate-900 border border-slate-800 rounded-xl text-white text-xs">
                            <option value="Licencia Médica">Licencia Médica</option>
                            <option value="Permiso sin goce">Permiso sin goce</option>
                            <option value="Incidente / Accidente">Incidente / Accidente</option>
                            <option value="Felicitación / Logro">Felicitación / Reconocimiento</option>
                            <option value="Observación de Campo">Observación de Campo</option>
                          </select>
                        </div>
                        <div>
                          <label className="text-[10px] font-bold text-slate-400">Fecha Inicio</label>
                          <input type="date" value={newLog.fechaInicio} onChange={(e) => setNewLog({...newLog, fechaInicio: e.target.value})} className="w-full mt-1 px-2.5 py-1.5 bg-slate-900 border border-slate-800 rounded-xl text-white text-xs" />
                        </div>
                        <div>
                          <label className="text-[10px] font-bold text-slate-400">Fecha Término</label>
                          <input type="date" value={newLog.fechaTermino} onChange={(e) => setNewLog({...newLog, fechaTermino: e.target.value})} className="w-full mt-1 px-2.5 py-1.5 bg-slate-900 border border-slate-800 rounded-xl text-white text-xs" />
                        </div>
                      </div>
                      <div>
                        <label className="text-[10px] font-bold text-slate-400">Detalle / Nota / Comentario</label>
                        <textarea required rows="2" value={newLog.nota} onChange={(e) => setNewLog({...newLog, nota: e.target.value})} className="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-white text-xs outline-none focus:border-amber-500" placeholder="Escriba el detalle del evento operativo..."></textarea>
                      </div>
                      <div className="flex justify-end">
                        <button type="submit" className="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow">Registrar en Historial Cloud</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
