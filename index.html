<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Base para que las rutas funcionen en el subdirectorio /Gestor-Dotaci-n/ -->
    <base href="/Gestor-Dotaci-n/">
    
    <title>BRAMAQ Enterprise</title>
    
    <!-- Scripts de carga -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <style>
        body { background-color: #020617; color: white; margin: 0; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // 1. Configuración de Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyD_ZlO3treRtz6ZkjY9Vr69wJz2vA...",
          authDomain: "bramaqcloud.firebaseapp.com",
          projectId: "bramaqcloud",
          storageBucket: "bramaqcloud.appspot.com",
          messagingSenderId: "369713509600",
          appId: "1:369713509600:web:b6d878c..."
        };

        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        } catch (e) { console.error("Firebase init:", e); }

        const db = firebase.firestore();

        // 2. Componente principal (Mantiene toda tu lógica original)
        function App() {
            const [hasEntered, setHasEntered] = React.useState(false);
            
            if (!hasEntered) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen p-4">
                        <h1 className="text-2xl font-bold mb-8">BRAMAQ Acceso</h1>
                        <button 
                            onClick={() => setHasEntered(true)} 
                            className="bg-amber-500 text-black px-8 py-4 rounded-xl font-bold"
                        >
                            INGRESAR AL SISTEMA
                        </button>
                    </div>
                );
            }

            return (
                <div className="p-4">
                    <h1 className="text-xl font-bold">Interfaz Cargada Correctamente</h1>
                    <p>Si ves este mensaje, la aplicación ya no está bloqueada por la pantalla azul.</p>
                    {/* AQUI VA TU DASHBOARD COMPLETO QUE YA TENIAS */}
                </div>
            );
        }

        // 3. Montaje seguro
        window.addEventListener('load', () => {
            const container = document.getElementById('root');
            if (container) {
                try {
                    const root = ReactDOM.createRoot(container);
                    root.render(<App />);
                } catch (e) {
                    console.error("Error al renderizar:", e);
                    container.innerHTML = '<div style="padding:20px;">Error al cargar la interfaz.</div>';
                }
            }
        });
    </script>
</body>
</html>
