        };

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return <div className="p-10 text-center text-red-400 font-sans">
                        <h2 className="text-2xl font-bold mb-4">El sistema evitó un colapso crítico.</h2>
                        <div className="bg-black p-4 rounded text-xs text-left overflow-auto mb-4">{this.state.error.toString()}</div>
                        <button onClick={()=>window.location.reload()} className="bg-amber-500 text-black px-6 py-2 rounded font-bold">Recargar Sistema</button>
                    </div>;
                }
                return this.props.children;
            }
        }

          }, []);

          // LISTAS DINÁMICAS EXTRÁIDAS DE LA BASE DE DATOS
          const cargosList = useMemo(() => {

            if (!phone) return '';
            let p = String(phone).replace(/\D/g, '');
            if (p.length === 8) p = '569' + p;
            if (p.length === 9 && p.startsWith('9')) p = '56' + p;
            return '+' + p;

                  ws[cellAddress].s = {
                      fill: { fgColor: { rgb: "0F172A" } }, 
                      font: { color: { rgb: "FFFFFF" }, bold: true }, 
                      alignment: { horizontal: "center", vertical: "center" }
                  };
              }
          };

          const createBar = (val, maxVal) => {

              const blocks = Math.ceil((val / Math.max(maxVal, 1)) * 20);
              return "█".repeat(blocks);
          };

                    row[key] = emp[key];
                  }
                });
                return row;
              });

              const wsData = XLSX.utils.json_to_sheet(exportData);

              wsData['!cols'] = [{wch: 35}, {wch: 15}, {wch: 25}, {wch: 15}, {wch: 30}, {wch: 15}, {wch: 25}, {wch: 25}, {wch: 15}, {wch: 60}];
              styleHeader(wsData);

              const maxVal = Math.max(kpis.adminContrato, kpis.supervisores, kpis.prevencionistas, kpis.administrativos, kpis.operadoresGrua, kpis.cargadorFrontal, kpis.mecanicos, ...Object.values(kpis.porCiudad), 1);
              
              const dashArr = [
                  ["RESUMEN EJECUTIVO DE DOTACIÓN BRAMAQ"], [],
                  ["INDICADORES GENERALES", "CANTIDAD", ""],
                  ["Dotación Total", kpis.total, ""],
                  ["Información Faltante", kpis.incompletos, ""],
                  ["Con Registros de Bitácora", kpis.conBitacora, ""], [],
                  ["DISTRIBUCIÓN POR CARGOS", "CANTIDAD", "PROPORCIÓN"],
                  ["Admin. Contrato", kpis.adminContrato, createBar(kpis.adminContrato, maxVal)],
                  ["Supervisores", kpis.supervisores, createBar(kpis.supervisores, maxVal)],
                  ["Prevencionistas", kpis.prevencionistas, createBar(kpis.prevencionistas, maxVal)],
                  ["Administrativos", kpis.administrativos, createBar(kpis.administrativos, maxVal)],
                  ["Operadores Grúa", kpis.operadoresGrua, createBar(kpis.operadoresGrua, maxVal)],
                  ["Cargadores Frontales", kpis.cargadorFrontal, createBar(kpis.cargadorFrontal, maxVal)],
                  ["Mecánicos", kpis.mecanicos, createBar(kpis.mecanicos, maxVal)], [],
                  ["DISTRIBUCIÓN POR CIUDAD", "CANTIDAD", "PROPORCIÓN"]
              ];
              Object.keys(kpis.porCiudad).forEach(city => { dashArr.push([city, kpis.porCiudad[city], createBar(kpis.porCiudad[city], maxVal)]); });
              
              const wsDash = XLSX.utils.aoa_to_sheet(dashArr);
              wsDash['!cols'] = [{wch: 40}, {wch: 15}, {wch: 25}];
              
              const rangeDash = XLSX.utils.decode_range(wsDash['!ref']);

                  ["Rango Exportado:", filterStartDate && filterEndDate ? `Desde ${filterStartDate} hasta ${filterEndDate}` : "Histórico Completo", ""],
                  ["Total de Eventos Registrados:", filteredGlobalLogs.length, ""], [],
                  ["DESGLOSE POR TIPO DE EVENTO", "CANTIDAD", "GRÁFICA"]
              ];

              Object.entries(eventCounts).sort((a,b)=>b[1]-a[1]).forEach(([tipo, cant]) => {
                  dashArr.push([tipo, cant, createBar(cant, maxVal)]);
              });

              const wsDash = XLSX.utils.aoa_to_sheet(dashArr);
              wsDash['!cols'] = [{wch: 45}, {wch: 15}, {wch: 25}];
              
              const rangeDash = XLSX.utils.decode_range(wsDash['!ref']);
              for(let R = rangeDash.s.r; R <= rangeDash.e.r; ++R) {
                  const cell = wsDash[XLSX.utils.encode_cell({r: R, c: 2})];
                  if(cell && typeof cell.v === 'string' && cell.v.includes("█")) {
                      cell.s = { font: { color: { rgb: "F59E0B" } } };
                  }
                  const cellA = wsDash[XLSX.utils.encode_cell({r: R, c: 0})];
                  if(cellA && cellA.v === "DESGLOSE POR TIPO DE EVENTO") {
                      wsDash[XLSX.utils.encode_cell({r: R, c: 0})].s = { font: { bold: true, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "0F172A" } } };
                      wsDash[XLSX.utils.encode_cell({r: R, c: 1})].s = { font: { bold: true, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "0F172A" } } };
                      wsDash[XLSX.utils.encode_cell({r: R, c: 2})].s = { font: { bold: true, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "0F172A" } } };
                  }
              }

              const wb = XLSX.utils.book_new();
              XLSX.utils.book_append_sheet(wb, wsDash, "Resumen Eventos");
              XLSX.utils.book_append_sheet(wb, wsData, "Bitácora Detallada");
              XLSX.writeFile(wb, `BRAMAQ_Bitacora_Global.xlsx`);
            } catch (error) { alert("Error: " + error.message); }
          };

          const handleDeleteAllData = async () => {
            if (userSession.rol !== 'Administrativo') { alert("Acción reservada para Administración."); return; }
            if (confirm("⚠️ ALERTA: ¿Deseas vaciar toda la base de datos de trabajadores?\nNo podrás recuperar los datos sin respaldo.")) {
              try {
                const snapshot = await db.collection('employees').get();
                const batch = db.batch();
                snapshot.docs.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
                alert("Base de datos vaciada con éxito.");
              } catch (err) { alert("Error: " + err.message); }
            }
          };

          const fileInputRef = useRef(null);
          const logFileRef = useRef(null);

          const handleUploadExcel = (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader(); reader.readAsArrayBuffer(file);
            reader.onload = async (event) => {
              try {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                let rawData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
                let headerIdx = 0;
                for (let i = 0; i < rawData.length; i++) {
                  const rowStr = JSON.stringify(rawData[i]).toLowerCase();
                  if (rowStr.includes('nombre') || rowStr.includes('rut')) { headerIdx = i; break; }
                }
                const jsonSheet = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { range: headerIdx, defval: "" });

                if (jsonSheet.length > 0) {
                  let addedCount = 0; let duplicateCount = 0;
                  let existingRuts = new Set(employees.map(emp => cleanRut(emp.rut)));
                  
                  if (confirm(`Se detectaron ${jsonSheet.length} filas.\nSe omitirán automáticamente los duplicados por RUT.\n¿Proceder?`)) {
                    for (let row of jsonSheet) {
                      const keys = Object.keys(row);
                      const findVal = (terms) => {
                        for (let t of terms) {
                          const k = keys.find(key => String(key).toLowerCase().includes(t));
                          if (k && row[k] !== undefined && row[k] !== "") return String(row[k]).trim();
                        } return '';
                      };
                      
                      const nombre = findVal(['nombre']); const rut = findVal(['rut']); const direccion = findVal(['direccion', 'calle', 'domicilio']); const numero = findVal(['numero', 'num']); const ciudad = findVal(['ciudad', 'comuna']); const cargo = findVal(['cargo', 'funcion']); const telefono = findVal(['telefon', 'fono', 'celular']); const correo = findVal(['correo', 'email']); const emergenciaNombre = findVal(['emergencia nom', 'contacto emer']); const emergenciaFono = findVal(['emergencia fono', 'emergencia tel']);
                      const cRut = cleanRut(rut);
                      
                      if ((nombre || rut) && cRut) {
                        if (!existingRuts.has(cRut)) {
                          let extras = {};
                          keys.forEach(k => {
                            const kl = String(k).toLowerCase();
                            if (!kl.includes('nombre') && !kl.includes('rut') && !kl.includes('direccion') && !kl.includes('numero') && !kl.includes('ciudad') && !kl.includes('cargo') && !kl.includes('telefon') && !kl.includes('correo') && !kl.includes('emergencia')) {
                              if (row[k]) extras[k] = row[k];
                            }
                          });

                          await db.collection('employees').add({
                            nombre: nombre ? nombre.toUpperCase() : 'SIN NOMBRE', rut: rut, direccion: direccion, numero: numero, ciudad: ciudad || 'Valdivia', cargo: cargo || 'OPERADOR', telefono: telefono, correo: correo, emergenciaNombre: emergenciaNombre, emergenciaFono: emergenciaFono,
                            historial: [], ...extras
                          });
                          existingRuts.add(cRut); addedCount++;
                        } else { duplicateCount++; }
                      }
                    }
                    alert(`✅ Carga masiva exitosa.\nNuevos: ${addedCount}\nDuplicados omitidos: ${duplicateCount}`);
                  }
                }
              } catch (err) { alert("Error de formato: " + err.message); }
            };
            fileInputRef.current.value = "";
          };

          const handleSave = async (e) => {
            e.preventDefault();
            if (!formData.nombre || !formData.rut) { setFormError("Nombre y RUT son obligatorios."); return; }
            try {
              if (currentEmployee) await db.collection('employees').doc(currentEmployee.id).update(formData);
              else await db.collection('employees').add({ ...formData, historial: [] });
              setIsModalOpen(false); setCurrentEmployee(null);
            } catch (err) { setFormError("Error base de datos: " + err.message); }
          };

          const handleDelete = async (id) => {
            if (userSession.rol !== 'Administrativo') { alert("Función restringida a Administración."); return; }
            if (confirm("⚠️ ¿Eliminar permanentemente este trabajador y toda su hoja de vida?")) await db.collection('employees').doc(id).delete();
          };

          const handleLogFileChange = (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;
            const newPending = [];
            files.forEach(file => newPending.push({ fileObj: file, nombre: file.name, tipo: file.type }));
            setLogForm(prev => ({ ...prev, archivos: [...prev.archivos, ...newPending] }));
            if (logFileRef.current) logFileRef.current.value = "";
          };

          const handleRemovePendingFile = (idx) => setLogForm(prev => ({ ...prev, archivos: prev.archivos.filter((_, i) => i !== idx) }));

          const handleDeleteSavedAttachment = async (logId, fileIdx) => {
            if (!selectedEmpForHistory) return;
            if (confirm("¿Estás seguro de eliminar este archivo adjunto?")) {
              try {
                const updatedHistorial = selectedEmpForHistory.historial.map(h => {
                  if (h.id === logId) return { ...h, archivos: h.archivos.filter((_, i) => i !== fileIdx) };
                  return h;
                });
                await db.collection('employees').doc(selectedEmpForHistory.id).update({ historial: updatedHistorial });
                setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: updatedHistorial });
              } catch (err) { alert("Error: " + err.message); }
            }
          };

          const handleDeleteLog = async (logId) => {
            if (!selectedEmpForHistory) return;

              try {
                const updatedHistorial = selectedEmpForHistory.historial.filter(h => h.id !== logId);
                await db.collection('employees').doc(selectedEmpForHistory.id).update({ historial: updatedHistorial });
                setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: updatedHistorial });
              } catch (err) { alert("Error: " + err.message); }
            }
          };

          const handleAddLog = async (e) => {
            e.preventDefault();
            if (!selectedEmpForHistory) return;
            setUploadingFiles(true);

            try {
              const finalFiles = [];
              for (const item of logForm.archivos) {
                 if (item.fileObj.size > 800000) {
                     throw new Error(`El archivo "${item.nombre}" supera el límite de 800KB. Redúzcalo para continuar.`);
                 }
                 const url = await new Promise((resolve, reject) => {
                     const reader = new FileReader();
                     reader.onload = (ev) => resolve(ev.target.result);
                     reader.onerror = (err) => reject(err);
                     reader.readAsDataURL(item.fileObj);
                 });
                 finalFiles.push({ nombre: item.nombre, tipo: item.tipo, url: url });
              }

              const logEntry = {
                id: String(Date.now()), tipo: logForm.tipo === 'Otro' ? (logForm.customTipo || 'Otro') : logForm.tipo, 
                modoFechas: logForm.modoFechas, fechaInicio: logForm.modoFechas === 'rango' ? logForm.fechaInicio : logForm.fechaUnica,
                fechaTermino: logForm.modoFechas === 'rango' ? logForm.fechaTermino : logForm.fechaUnica,
                nota: logForm.nota || '', archivos: finalFiles, 
                autor: userSession.autor, rolAutor: userSession.rol, createdAt: new Date().toISOString()
              };
              
              const updatedHistorial = [...(selectedEmpForHistory.historial || []), logEntry];
              await db.collection('employees').doc(selectedEmpForHistory.id).update({ historial: updatedHistorial });
              setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: updatedHistorial });
              
              setLogForm({ 
                tipo: userSession.rol === 'Administrativo' ? 'Licencia Médica' : 'Permiso Autorizado', 
                modoFechas: 'unica', fechaInicio: new Date().toISOString().split('T')[0], fechaTermino: new Date().toISOString().split('T')[0], fechaUnica: new Date().toISOString().split('T')[0], customTipo: '', nota: '', archivos: [] 
              });
              setUploadingFiles(false);
            } catch (error) { 
              alert(error.message); 
              setUploadingFiles(false); 
            }
          };

          const getMissingDataList = (emp) => {
            let missing = [];
            if (!emp.cargo) missing.push("Cargo");
            if (!emp.ciudad) missing.push("Ciudad Base");
            if (!emp.direccion) missing.push("Dirección");
            if (!emp.correo) missing.push("Correo");
            if (!emp.telefono) missing.push("Teléfono");
            if (!emp.emergenciaNombre || !emp.emergenciaFono) missing.push("Emergencia");
            return missing;
          };

          const filtered = useMemo(() => {
            const sorted = [...employees].sort((a, b) => String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es', { sensitivity: 'base' }));
            
            return sorted.filter(emp => {
              const s = String(searchTerm || '').toLowerCase();
              const matchSearch = String(emp.nombre||'').toLowerCase().includes(s) || String(emp.rut||'').toLowerCase().includes(s) || String(emp.cargo||'').toLowerCase().includes(s) || String(emp.ciudad||'').toLowerCase().includes(s);
              if (!matchSearch) return false;
              if (activeFilter === 'TODOS') return true;
              if (activeFilter === 'INCOMPLETOS') return getMissingDataList(emp).length > 0;
              if (activeFilter === 'CON_BITACORA') return emp.historial && emp.historial.length > 0;
              if (activeFilter === 'ADMIN_CONTRATO') return String(emp.cargo||'').toUpperCase().includes('CONTRATO');
              if (activeFilter === 'SUPERVISORES') return String(emp.cargo||'').toUpperCase().includes('SUPERVISOR');
              if (activeFilter === 'PREVENCIONISTAS') return String(emp.cargo||'').toUpperCase().includes('PREVENCION');
              if (activeFilter === 'ADMINISTRATIVOS') return String(emp.cargo||'').toUpperCase().includes('ADMINISTRATIVO') && !String(emp.cargo||'').toUpperCase().includes('CONTRATO');
              if (activeFilter === 'OPERADORES_GRUA') return String(emp.cargo||'').toUpperCase().includes('GRUA');
              if (activeFilter === 'CARGADOR_FRONTAL') return String(emp.cargo||'').toUpperCase().includes('CARGADOR FRONTAL');
              if (activeFilter === 'MECANICOS') return String(emp.cargo||'').toUpperCase().includes('MECANICO');
              if (citiesList.includes(activeFilter)) return String(emp.ciudad||'').toLowerCase() === String(activeFilter).toLowerCase();
              return true;
            });
          }, [employees, searchTerm, activeFilter, citiesList]);

          const kpis = useMemo(() => {
            const porCiudad = {}; citiesList.forEach(c => porCiudad[c] = employees.filter(e => String(e.ciudad||'').toLowerCase() === String(c).toLowerCase()).length);
            let faltas = 0, incidentes = 0, licencias = 0;
            employees.forEach(emp => {
               if(emp.historial && Array.isArray(emp.historial)) {
                   emp.historial.forEach(h => {
                       const t = String(h.tipo || '').toLowerCase();
                       if(t.includes('falta')) faltas++;
                       if(t.includes('incidente')) incidentes++;
                       if(t.includes('licencia')) licencias++;
                   });
               }
            });

            return {
              total: employees.length, 
              incompletos: employees.filter(e => getMissingDataList(e).length > 0).length,
              conBitacora: employees.filter(e => e.historial && e.historial.length > 0).length,
              supervisores: employees.filter(e => String(e.cargo||'').toUpperCase().includes('SUPERVISOR')).length,
              prevencionistas: employees.filter(e => String(e.cargo||'').toUpperCase().includes('PREVENCION')).length,
              administrativos: employees.filter(e => String(e.cargo||'').toUpperCase().includes('ADMINISTRATIVO') && !String(e.cargo||'').toUpperCase().includes('CONTRATO')).length,
              adminContrato: employees.filter(e => String(e.cargo||'').toUpperCase().includes('CONTRATO')).length,
              operadoresGrua: employees.filter(e => String(e.cargo||'').toUpperCase().includes('GRUA')).length,
              cargadorFrontal: employees.filter(e => String(e.cargo||'').toUpperCase().includes('CARGADOR FRONTAL')).length,
              mecanicos: employees.filter(e => String(e.cargo||'').toUpperCase().includes('MECANICO')).length,
              faltas, incidentes, licencias, porCiudad
            };
          }, [employees, citiesList]);

          const allGlobalLogs = useMemo(() => {
            let logs = [];
            const sortedEmployees = [...employees].sort((a, b) => String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es', { sensitivity: 'base' }));
            
            sortedEmployees.forEach(emp => { if (emp.historial && Array.isArray(emp.historial)) emp.historial.forEach(h => logs.push({ ...h, empleadoNombre: emp.nombre || 'Desconocido', empleadoRut: emp.rut || '', empleadoCargo: emp.cargo || '' })); });
            return logs.sort((a, b) => new Date(b.createdAt || b.fechaInicio || 0) - new Date(a.createdAt || a.fechaInicio || 0));
          }, [employees]);

          const filteredGlobalLogs = useMemo(() => {
              let filtered = allGlobalLogs;
              if (filterStartDate) { filtered = filtered.filter(log => log.fechaInicio >= filterStartDate); }
              if (filterEndDate) { filtered = filtered.filter(log => log.fechaInicio <= filterEndDate); }
              return filtered;
          }, [allGlobalLogs, filterStartDate, filterEndDate]);


          // ======================= PANTALLA LOGIN OBLIGATORIA =======================
          if (!hasEntered) {
            return (
              <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4 relative">
                <div className="absolute top-4 right-4 sm:top-6 sm:right-6">
                    <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="p-2.5 rounded-full bg-slate-800 text-amber-500 hover:bg-slate-700 transition-colors shadow-lg border border-slate-700" title={`Cambiar a Tema ${theme === 'dark' ? 'Claro' : 'Oscuro'}`}>
                        <Ico i={theme === 'dark' ? 'sun' : 'moon'} c="w-5 h-5" />
                    </button>
                </div>

                <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl w-full max-w-md shadow-2xl flex flex-col items-center fade-in">
                  
                  {/* LOGO MÁQUINA PESADA BRAMAQ */}
                  <div className="flex flex-col items-center mb-8">
                    <div className="w-24 h-24 bg-gradient-to-br from-amber-400 to-amber-600 rounded-2xl flex items-center justify-center text-slate-950 mb-4 shadow-[0_0_20px_rgba(245,158,11,0.3)]">
                      <Ico i="tractor" c="w-14 h-14" />
                    </div>
                    <h1 className="text-4xl font-extrabold text-white tracking-tight text-center">BRAMAQ</h1>
                    <h2 className="text-[10px] font-bold text-amber-500 uppercase tracking-[0.2em] mt-1 text-center">Gestor de Dotación Enterprise</h2>
                  </div>

                  <div className="w-full space-y-4">
                    <label className="text-[10px] text-slate-500 font-bold uppercase block mb-1">Seleccione Rol de Ingreso</label>
                    <select value={selectedRole} onChange={e => { setSelectedRole(e.target.value); setSelectedSupName(''); }} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-amber-400 font-bold outline-none focus:border-amber-500 cursor-pointer appearance-none">
                      <option value="" disabled>-- Perfil Operativo --</option>
                      <option value="Administrativo">Administrativo / RRHH</option>
                      <option value="AdminContrato">Administrador de Contrato</option>
                      <option value="Supervisor">Supervisor</option>
                      <option value="Prevencionista">Prevencionista</option>
                    </select>

                    {selectedRole === 'Supervisor' && (
                      <div className="fade-in">
                        <label className="text-[10px] text-slate-500 font-bold uppercase block mb-1 mt-2">Identificación de Supervisor</label>
                        <select value={selectedSupName} onChange={e => setSelectedSupName(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 outline-none focus:border-amber-500 cursor-pointer appearance-none">
                          <option value="" disabled>-- Nombre del Supervisor --</option>
                          {supervisorsList.map(name => <option key={name} value={name}>{name}</option>)}
                        </select>
                      </div>
                    )}

                    <button disabled={!selectedRole || (selectedRole === 'Supervisor' && !selectedSupName)} onClick={handleEnterApp} className={`w-full py-3.5 rounded-xl font-bold text-sm mt-4 transition-colors ${(!selectedRole || (selectedRole === 'Supervisor' && !selectedSupName)) ? 'bg-slate-800 text-slate-500 cursor-not-allowed' : 'bg-amber-500 text-slate-950 hover:bg-amber-400 shadow-[0_0_15px_rgba(245,158,11,0.2)]'}`}>
                      ACCEDER AL SISTEMA
                    </button>

                    {/* BOTÓN INSTALAR PWA ACTUALIZADO */}
                    {isInstallable && (
                      <button onClick={handleInstallClick} className="w-full py-3 mt-2 rounded-xl font-bold text-xs text-emerald-400 border border-emerald-500/30 flex items-center justify-center gap-2 hover:bg-emerald-500/10 transition-colors"><Ico i="download-cloud" c="w-4 h-4" /> Instalar Aplicación BRAMAQ</button>
                    )}
                    
                    {/* INSTRUCCIONES iOS Para Borrar Caché y Agregar a Inicio */}
                    {showInstallHelp && (
                      <div className="w-full py-3 px-4 rounded-xl text-xs text-slate-300 border border-slate-800 bg-slate-950 text-left fade-in mt-2">
                        {isIOS ? (
                            <div>
                                <strong className="text-amber-500 block mb-1">En iPhone / Safari:</strong>
                                1. Toca el botón <b>Compartir</b> (cuadrado con flecha hacia arriba).<br/>
                                2. Desliza hacia abajo y selecciona <b>"Agregar a inicio"</b>.<br/>
                                <i className="text-[9px] text-slate-500 mt-2 block">Nota: Si el ícono antiguo sigue saliendo, borra el historial de Safari en la configuración de tu iPhone.</i>
                            </div>
                        ) : "En el menú de tu navegador, selecciona 'Instalar aplicación'."}
                        <div className="text-center mt-3"><button onClick={()=>setShowInstallHelp(false)} className="text-[10px] text-slate-500 underline cursor-pointer">Cerrar</button></div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            );
          }

          // APLICACIÓN PRINCIPAL (GERENCIAL Y OPERATIVA)
          return (
            <div className="flex h-screen overflow-hidden bg-slate-950">
              {/* Sidebar Desktop */}

                <div className="h-20 flex items-center px-6 border-b border-slate-800 gap-3">
                  <div className="bg-amber-500 p-2.5 rounded-xl text-slate-950 shadow-lg shadow-amber-500/20"><Ico i="tractor" c="w-6 h-6" /></div>
                  <div><div className="font-extrabold text-white text-lg tracking-tight leading-none">BRAMAQ</div><div className="text-[9px] text-amber-500 uppercase font-bold tracking-wider mt-0.5">Enterprise</div></div>
                </div>
                <div className="p-4 space-y-2 flex-1">
                  <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition-colors ${activeTab === 'dashboard' ? 'bg-amber-500/10 text-amber-400' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}><Ico i="layout-dashboard" c="w-4 h-4" /> Panel Gerencial</button>
                  <button onClick={() => setActiveTab('directorio')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition-colors ${activeTab === 'directorio' ? 'bg-amber-500/10 text-amber-400' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}><Ico i="users" c="w-4 h-4" /> Directorio y Fichas</button>
                  
                  <div className="mt-8 pt-6 border-t border-slate-800">
                    <div className="flex items-center gap-2 px-2 mb-4">
                      <span className={`w-2 h-2 rounded-full ${onlineStatus ? 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]' : 'bg-red-500 animate-pulse'}`}></span>
                      <span className="text-xs text-slate-300">{onlineStatus ? 'Sincronizado en Nube' : 'Sin Conexión (Offline)'}</span>
                    </div>
                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs text-slate-400 mb-3">
                      <span className="block text-[9px] uppercase font-bold text-slate-500 mb-1">Sesión Autorizada</span>
                      <strong className="text-amber-400 block truncate">{userSession.autor}</strong>
                      <span>{userSession.rol}</span>
                    </div>
                    
                    <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="w-full bg-slate-800 hover:bg-slate-700 text-amber-500 border border-slate-700 py-2.5 rounded-lg text-xs font-bold transition-colors flex items-center justify-center gap-2 mb-2">
                      <Ico i={theme === 'dark' ? 'sun' : 'moon'} c="w-4 h-4" /> Tema {theme === 'dark' ? 'Claro' : 'Oscuro'}
                    </button>
                    <button onClick={() => setHasEntered(false)} className="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 py-2.5 rounded-lg text-xs font-bold transition-colors flex items-center justify-center gap-2">
                      <Ico i="log-out" c="w-4 h-4" /> Cambiar Perfil / Salir
                    </button>
                  </div>
                </div>
              </aside>

              <div className="flex-1 flex flex-col h-screen relative">
                {/* Header Mobile */}
                <header className="lg:hidden h-16 flex items-center justify-between px-4 bg-slate-900 border-b border-slate-800 z-30">

                               <input value={formData.numero} onChange={e=>setFormData({...formData, numero:e.target.value})} className="w-1/3 bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none focus:border-amber-500" placeholder="N°" />
                            </div>

                        </div>

                            <input value={formData.emergenciaNombre} onChange={e=>setFormData({...formData, emergenciaNombre:e.target.value})} placeholder="Nombre..." className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white mt-1 outline-none focus:border-red-500" />

                          <button type="submit" className="bg-amber-500 hover:bg-amber-400 text-slate-950 px-6 py-2.5 rounded-xl text-xs font-bold shadow-[0_0_15px_rgba(245,158,11,0.2)] flex items-center gap-2 transition-colors"><Ico i="save" c="w-4 h-4" /> Guardar Ficha</button>

                      </form>
                    </div>
                  </div>
                </div>

              {/* MODAL BITÁCORA INDIVIDUAL */}
              {isHistoryModalOpen && selectedEmpForHistory && (

                        {!selectedEmpForHistory.historial?.length ? <div className="text-center text-slate-500 py-32 text-sm"><div className="mb-3 opacity-30"><Ico i="folder-open" c="w-12 h-12 mx-auto" /></div>Expediente limpio. No hay observaciones.</div> : (
                          <div className="space-y-5">
                            {[...(selectedEmpForHistory.historial||[])].sort((a,b) => new Date(b.createdAt||b.fechaInicio||0) - new Date(a.createdAt||a.fechaInicio||0)).map(h => (
                              <div key={h.id} className="bg-slate-900 border border-slate-800 p-5 rounded-2xl relative group hover:border-slate-700 transition-colors">
                                <div className="flex justify-between items-start mb-3">
                                  <span className="bg-slate-950 text-amber-400 border border-amber-500/30 text-[10px] font-bold px-2.5 py-1 rounded uppercase tracking-wider">{h.tipo || 'Evento'}</span>
                                  <span className="text-[10px] text-slate-400 font-mono bg-slate-950 px-2 py-1 rounded border border-slate-800 flex items-center"><Ico i="calendar" c="w-3 h-3 mr-1.5" />{h.modoFechas === 'rango' ? `${h.fechaInicio} al ${h.fechaTermino}` : h.fechaInicio}</span>

                                        {((userSession.rol === 'Administrativo' || userSession.rol === 'AdminContrato') || userSession.autor === h.autor) && (
                                          <button onClick={() => handleDeleteSavedAttachment(h.id, i)} className="text-red-500 opacity-0 group-hover/file:opacity-100 p-1 hover:bg-red-500/10 rounded transition-opacity" title="Eliminar archivo de la base de datos"><Ico i="trash-2" c="w-3.5 h-3.5" /></button>

                                    <button onClick={() => handleDeleteLog(h.id)} className="text-red-500 font-bold opacity-0 group-hover:opacity-100 transition-opacity bg-red-500/10 px-2 py-1 rounded"><Ico i="trash" c="w-3 h-3 mr-1 inline" />Eliminar Evento</button>
                                  )}
                                </div>
                              </div>
                            ))}
                          </div>

                      {/* Formulario Crear Evento */}

                        <form onSubmit={handleAddLog} className="space-y-4 flex-1 flex flex-col">
                          <div>
                            <label className="text-[9px] text-slate-500 uppercase font-bold mb-1.5 block">Categoría de Evento *</label>
                            <select value={logForm.tipo} onChange={e=>setLogForm({...logForm, tipo:e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-white outline-none focus:border-amber-500 cursor-pointer appearance-none">
                              {(userSession.rol === 'Administrativo') && <option value="Licencia Médica">Licencia Médica</option>}
                              {(userSession.rol === 'Administrativo') && <option value="Extensión de Licencia">Extensión de Licencia</option>}
                              {(userSession.rol === 'Administrativo') && <option value="Enmendadura">Enmendadura de Asistencia</option>}

                              <option value="Permiso Autorizado">Permiso Autorizado</option>
                              <option value="Falta Injustificada">Falta Injustificada</option>
                              <option value="Atraso">Atraso</option>
                              <option value="Incidente">Incidente / Accidente</option>

                          <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                            <div className="flex gap-4 mb-3 border-b border-slate-800 pb-2">

                            </div>

                              {uploadingFiles ? <><Ico i="loader-2" c="w-4 h-4 animate-spin" /> Guardando Evento...</> : <><Ico i="save" c="w-4 h-4" /> Confirmar y Guardar Registro</>}
                            </button>

                        </form>
                      </div>
                    </div>
                  </div>

                      </div>
                      
                      {/* FILTRO DE RANGO DE FECHAS INTELIGENTE */}

                      <button onClick={() => setIsGlobalHistoryOpen(false)} className="text-slate-400 hover:text-white bg-slate-800 p-2 rounded-lg border border-slate-700 hidden sm:block shrink-0"><Ico i="x" c="w-4 h-4" /></button>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto p-5 sm:p-8 bg-slate-950/50">
                      {filteredGlobalLogs.length === 0 ? <div className="text-center py-32"><div className="mb-4"><Ico i="clipboard-list" c="w-16 h-16 text-slate-700 mx-auto" /></div><p className="text-slate-400 font-medium">No se encontraron observaciones en el rango de fechas seleccionado.</p></div> : (
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                          {filteredGlobalLogs.map((log, i) => (
                            <div key={i} className="bg-slate-900 p-5 rounded-2xl border border-slate-800 hover:border-slate-600 transition-colors flex flex-col h-full shadow-lg">
                              <div className="flex justify-between items-start mb-3 border-b border-slate-800 pb-3">
                                <div className="pr-2"><div className="font-bold text-sm text-white mb-0.5 leading-tight">{log.empleadoNombre}</div><span className="text-[9px] text-slate-400 font-mono bg-slate-950 px-1.5 py-0.5 rounded border border-slate-800">RUT: {log.empleadoRut}</span></div>
                                <span className="text-[9px] bg-amber-500/10 border border-amber-500/30 text-amber-400 px-2 py-1 rounded font-bold uppercase shrink-0 text-center">{log.tipo}</span>
                              </div>
                              <div className="flex-1 mb-3">
                                {log.nota ? <p className="text-xs text-slate-300 bg-slate-950 p-3 rounded-xl border border-slate-800/50 leading-relaxed italic">"{log.nota}"</p> : <p className="text-xs text-slate-500 italic">Sin observaciones.</p>}
                              </div>
                              <div className="text-[9px] text-slate-500 flex justify-between items-end border-t border-slate-800 pt-3">
                                <span className="font-mono flex items-center bg-slate-950 px-2 py-1 rounded border border-slate-800"><Ico i="calendar" c="w-3 h-3 mr-1" />{log.fechaInicio}</span>
                                <div className="text-right"><span>Autorizado:</span><br/><strong className="text-slate-300">{log.autor}</strong></div>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                    
                    <div className="p-5 border-t border-slate-800 flex justify-end gap-3 bg-slate-900 rounded-b-3xl shrink-0">
                      <button onClick={handleDownloadGlobalLogsExcel} className="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-3 rounded-xl font-bold text-xs flex items-center gap-2 shadow-[0_0_15px_rgba(16,185,129,0.2)] transition-colors"><Ico i="file-spreadsheet" c="w-4 h-4 mr-1" /> Generar Excel de este Rango</button>
                    </div>
                  </div>
                </div>
              )}

            </div>
          );
        }

        const container = document.getElementById('root');
        if (container) {
            try {
                const root = ReactDOM.createRoot(container);
                root.render(<ErrorBoundary><App /></ErrorBoundary>);
            } catch (e) {
                console.error("Fallo React DOM:", e);
                container.innerHTML = '<div style="color:#ef4444; padding:50px; text-align:center; font-family:sans-serif; font-weight:bold;">Error crítico en el renderizado. Verifique consola.</div>';
            }
        }
    </script>
    
    <!-- SCRIPT DE POP-UP PARA INSTALACIÓN EN iOS (NUEVO) -->
    <!-- ESTO DETECTA SI ES IPHONE Y MUESTRA LA TARJETA FLOTANTE DE INSTALACIÓN -->
    <!-- POP-UP DE INSTALACIÓN EXCLUSIVO PARA iOS -->
    <div id="ios-install-prompt" class="hidden">
        <div class="prompt-content">
            <button id="close-prompt" aria-label="Cerrar">✕</button>
            <p><strong class="text-amber-500">Instala BRAMAQ en tu iPhone</strong></p>
            <p>Toca el ícono Compartir <span class="icon-simulate">⍐</span> abajo y luego selecciona <br><strong>"Agregar a Inicio"</strong> <span class="icon-simulate">➕</span></p>
        </div>
    </div>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const isIOS = () => /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
            const isStandalone = () => ('standalone' in window.navigator && window.navigator.standalone) || window.matchMedia('(display-mode: standalone)').matches;
            
            const promptElement = document.getElementById('ios-install-prompt');
            const closeButton = document.getElementById('close-prompt');

            if (isIOS() && !isStandalone() && !localStorage.getItem('bramaq_ios_prompt_closed')) {
                promptElement.classList.remove('hidden');
            }

            if(closeButton) {
                closeButton.addEventListener('click', () => {
                    promptElement.classList.add('hidden');
                    localStorage.setItem('bramaq_ios_prompt_closed', 'true');
                });
            }
        });
    </script>
</body>
</html>
