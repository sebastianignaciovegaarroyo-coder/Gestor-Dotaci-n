<!DOCTYPE html>
<html lang="es" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/Gestor-Dotaci-n/">
    
    <!-- PWA & Mobile Optimization -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BRAMAQ">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3200/3200424.png">
    
    <title>Gestor de Dotación BRAMAQ - Enterprise Cloud</title>
    
    <!-- CDNs Empresariales -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f1f5f9; margin: 0; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(30, 41, 59, 0.8); }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        #root { min-height: 100vh; }
        .app-loader { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: #f59e0b; font-weight: bold; background: #020617; }
    </style>
</head>
<body class="antialiased selection:bg-amber-500/30 selection:text-amber-200" translate="no">
    <div id="root">
        <div class="app-loader">
            <div style="font-size: 24px; margin-bottom: 10px;">BRAMAQ Enterprise</div>
            <div style="font-size: 14px; color: #94a3b8; font-weight: normal;">Cargando núcleo de sincronización en tiempo real...</div>
        </div>
    </div>
    
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        
        // Credenciales de conexión centralizada en la nube
        const firebaseConfig = {
          apiKey: "AIzaSyD_ZlO3treRtz6ZkjY9Vr69wJz2vA...",
          authDomain: "bramaqcloud.firebaseapp.com",
          projectId: "bramaqcloud",
          storageBucket: "bramaqcloud.appspot.com",
          messagingSenderId: "369713509600",
          appId: "1:369713509600:web:b6d878c..."
        };

        let db;
        try {
          if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
          db = firebase.firestore();
        } catch (e) { console.error("Error crítico conectando a la nube:", e); }

        function App() {
          const [hasEntered, setHasEntered] = useState(false);
          const [gateProfile, setGateProfile] = useState('');
          const [userSession, setUserSession] = useState({ rol: "" });
          const [employees, setEmployees] = useState([]);
          const [loading, setLoading] = useState(true);
          const [onlineStatus, setOnlineStatus] = useState(navigator.onLine);
          const [searchTerm, setSearchTerm] = useState('');
          const [activeTab, setActiveTab] = useState('dashboard');
          const [activeFilter, setActiveFilter] = useState('TODOS');
          const [citiesList] = useState(['Loncoche', 'Lanco', 'Valdivia', 'San José de la Mariquina', 'Los Lagos', 'Malalhue', 'Ciruelos', 'Panguipulli', 'Mariquina']);
          
          const [isModalOpen, setIsModalOpen] = useState(false);
          const [currentEmployee, setCurrentEmployee] = useState(null);
          const [formError, setFormError] = useState('');
          const [isHistoryModalOpen, setIsHistoryModalOpen] = useState(false);
          const [selectedEmpForHistory, setSelectedEmpForHistory] = useState(null);
          const [selectedPhone, setSelectedPhone] = useState(null);

          const [formData, setFormData] = useState({
            nombre: '', rut: '', direccion: '', ciudad: 'Valdivia', cargo: 'OPERADOR GRUA HORQUILLA', telefono: '', correo: '', emergenciaNombre: '', emergenciaFono: '',
            documentos: { contrato: true, induccion: true, examenes: true, epp: true }
          });

          // Sincronización en Tiempo Real Multiusuario vía Cloud Firestore
          useEffect(() => {
            const on = () => setOnlineStatus(true), off = () => setOnlineStatus(false);
            window.addEventListener('online', on); window.addEventListener('offline', off);
            
            if (!hasEntered || !db) return;
            
            setLoading(true);
            const unsub = db.collection('employees').onSnapshot(snap => {
              const items = [];
              snap.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
              setEmployees(items); 
              setLoading(false);
            }, (error) => {
              console.error("Error en sincronización en tiempo real:", error);
              setLoading(false);
            });
            return () => { unsub(); window.removeEventListener('online', on); window.removeEventListener('offline', off); };
          }, [hasEntered]);

          useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

          const handleEnterApp = () => {
            if (!gateProfile) return;
            setUserSession({ rol: gateProfile });
            setHasEntered(true);
          };

          const handleSave = async (e) => {
            e.preventDefault();
            if (!formData.nombre || !formData.rut) { setFormError("El Nombre y RUT son obligatorios."); return; }
            try {
              if (currentEmployee) {
                await db.collection('employees').doc(currentEmployee.id).update(formData);
              } else {
                await db.collection('employees').add({ ...formData, historial: [] });
              }
              setIsModalOpen(false); setCurrentEmployee(null);
            } catch (err) { setFormError("Error al guardar en la nube: " + err.message); }
          };

          const handleDelete = async (id) => {
            if (userSession.rol !== 'Administrativo' && userSession.rol !== 'AdminContrato') {
              alert("Sin permisos suficientes para realizar esta acción."); 
              return;
            }
            if (confirm("¿Estás seguro de eliminar este registro permanentemente de la base de datos central?")) {
              await db.collection('employees').doc(id).delete();
            }
          };

          const filtered = useMemo(() => {
            return employees.filter(emp => {
              const s = searchTerm.toLowerCase();
              const matchSearch = (emp.nombre||'').toLowerCase().includes(s) || (emp.rut||'').toLowerCase().includes(s) || (emp.cargo||'').toLowerCase().includes(s);
              if (!matchSearch) return false;
              if (activeFilter === 'TODOS') return true;
              return true;
            });
          }, [employees, searchTerm, activeFilter]);

          if (!hasEntered) {
            return (
              <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4 relative overflow-hidden">
                <div className="bg-slate-900/90 border border-slate-800 p-8 sm:p-12 rounded-3xl w-full max-w-md shadow-2xl flex flex-col items-center fade-in z-10">
                  <div className="w-20 h-20 bg-gradient-to-br from-amber-400 to-amber-600 rounded-2xl flex items-center justify-center text-slate-950 shadow-lg mb-6">
                    <i data-lucide="hard-hat" className="w-10 h-10"></i>
                  </div>
                  <h1 className="text-2xl font-extrabold text-white mb-2">Gestor de Dotación</h1>
                  <h2 className="text-lg font-bold text-amber-400 mb-6 uppercase tracking-widest">BRAMAQ</h2>
                  
                  <div className="w-full space-y-4">
                    <select 
                      value={gateProfile}
                      onChange={e => setGateProfile(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3.5 text-sm font-semibold text-amber-400 focus:outline-none focus:border-amber-500"
                    >
                      <option value="" disabled>-- Seleccione su Perfil --</option>
                      <option value="Administrativo">Administrativo / RRHH</option>
                      <option value="AdminContrato">Administrador de Contrato</option>
                      <option value="Supervisor">Supervisor de Faena</option>
                      <option value="Prevencionista">Prevencionista de Riesgos</option>
                    </select>

                    <button 
                      disabled={!gateProfile}
                      onClick={handleEnterApp}
                      className={`w-full py-4 rounded-xl font-bold text-sm transition-all ${gateProfile ? 'bg-amber-500 hover:bg-amber-400 text-slate-950 cursor-pointer shadow-lg' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`}
                    >
                      INGRESAR AL SISTEMA
                    </button>
                  </div>
                </div>
              </div>
            );
          }

          return (
            <div className="flex h-screen overflow-hidden bg-slate-950">
              <div className="flex-1 flex flex-col h-screen relative">
                <header className="h-16 flex items-center justify-between px-6 bg-slate-900/80 backdrop-blur border-b border-slate-800">
                  <div className="flex items-center gap-3">
                    <div className="bg-amber-500 p-2 rounded-lg text-slate-950 font-bold"><i data-lucide="hard-hat" className="w-5 h-5"></i></div>
                    <span className="font-bold text-white tracking-tight text-lg">BRAMAQ Enterprise</span>
                  </div>
                  <div className="flex items-center gap-4">
                    <span className={`w-2.5 h-2.5 rounded-full ${onlineStatus ? 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]' : 'bg-red-500'}`} title={onlineStatus ? "Conectado a la nube" : "Sin conexión a internet"}></span>
                    <span className="text-xs text-slate-400 font-medium">Perfil: <strong className="text-amber-400">{userSession.rol}</strong></span>
                    <button onClick={() => setHasEntered(false)} className="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg font-bold">Cerrar Sesión</button>
                  </div>
                </header>

                <main className="flex-1 overflow-y-auto p-6 lg:p-8">
                  <div className="max-w-7xl mx-auto space-y-6">
                    <div className="flex justify-between items-center bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                      <div>
                        <h2 className="text-xl font-bold text-white">Directorio Central de Trabajadores</h2>
                        <p className="text-xs text-slate-400 mt-0.5">Sincronización bidireccional activa con Cloud Firestore.</p>
                      </div>
                      <button onClick={() => { setCurrentEmployee(null); setIsModalOpen(true); }} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs px-4 py-2.5 rounded-xl shadow-md">
                        + Nuevo Trabajador
                      </button>
                    </div>

                    {loading ? (
                      <div className="text-center py-20 text-slate-500">Sincronizando registros centralizados...</div>
                    ) : (
                      <div className="grid grid-cols-1 gap-3">
                        {filtered.map(emp => (
                          <div key={emp.id} className="bg-slate-900/80 border border-slate-800 p-4 rounded-xl flex justify-between items-center hover:border-slate-700 transition-all">
                            <div>
                              <h4 className="font-bold text-white text-sm">{emp.nombre}</h4>
                              <p className="text-xs text-slate-400">{emp.cargo} — <span className="text-amber-400">{emp.ciudad}</span> ({emp.rut})</p>
                            </div>
                            <div className="flex items-center gap-2">
                              <button onClick={() => handleDelete(emp.id)} className="bg-red-500/10 hover:bg-red-500/20 text-red-400 p-2 rounded-lg text-xs font-bold border border-red-500/20">Eliminar</button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </main>
              </div>

              {/* MODAL GESTIÓN DE TRABAJADOR */}
              {isModalOpen && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl">
                    <h3 className="font-bold text-lg text-white mb-4">Registrar / Editar Trabajador</h3>
                    <form onSubmit={handleSave} className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-400 mb-1">Nombre Completo</label>
                        <input required value={formData.nombre} onChange={e=>setFormData({...formData, nombre:e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-400 mb-1">RUT</label>
                        <input required value={formData.rut} onChange={e=>setFormData({...formData, rut:e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-400 mb-1">Cargo</label>
                        <input value={formData.cargo} onChange={e=>setFormData({...formData, cargo:e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white" />
                      </div>
                      <div className="flex justify-end gap-2 pt-4">
                        <button type="button" onClick={() => setIsModalOpen(false)} className="bg-slate-800 px-4 py-2 rounded-xl text-xs font-bold">Cancelar</button>
                        <button type="submit" className="bg-amber-500 text-slate-950 px-5 py-2 rounded-xl text-xs font-bold">Guardar en la Nube</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}
            </div>
          );
        }

        // Arranque Seguro de la Aplicación
        window.addEventListener('load', () => {
            const container = document.getElementById('root');
            if (container) {
                try {
                    const root = ReactDOM.createRoot(container);
                    root.render(<App />);
                } catch (e) {
                    console.error("Error crítico de renderizado React:", e);
                    container.innerHTML = '<div style="color:white; padding:40px; text-align:center;">Error al iniciar la interfaz. Compruebe la consola.</div>';
                }
            }
        });
    </script>
</body>
</html>
