<!DOCTYPE html>
<html lang="es" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/Gestor-Dotaci-n/">
    
    <!-- ETIQUETAS PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BRAMAQ">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3200/3200424.png">
    
    <title>Gestor de Dotación BRAMAQ - Enterprise Cloud</title>
    
    <!-- CDNs Empresariales -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <!-- REGISTRO SERVICE WORKER -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('PWA: Service Worker Registrado.', reg.scope))
            .catch(err => console.log('PWA: Error al registrar Service Worker.', err));
        });
      }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f1f5f9; margin: 0; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(30, 41, 59, 0.8); }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        #root { min-height: 100vh; }
        .app-loader { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: #f59e0b; font-weight: bold; background: #020617; }
    </style>
</head>
<body class="antialiased selection:bg-amber-500/30 selection:text-amber-200" translate="no">
    <div id="root">
        <div class="app-loader">
            <div style="font-size: 24px; margin-bottom: 10px;">BRAMAQ Enterprise</div>
            <div style="font-size: 14px; color: #94a3b8; font-weight: normal;">Cargando sistema de gestión...</div>
        </div>
    </div>
    
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        
        // CONFIGURACIÓN DE FIREBASE
        const firebaseConfig = {
          apiKey: "AIzaSyD_ZlO3treRtz6ZkjY9Vr69wJz2vA...",
          authDomain: "bramaqcloud.firebaseapp.com",
          projectId: "bramaqcloud",
          storageBucket: "bramaqcloud.appspot.com",
          messagingSenderId: "369713509600",
          appId: "1:369713509600:web:b6d878c..."
        };

        let db;
        try {
          if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
          db = firebase.firestore();
        } catch (e) { console.error("Error iniciando Firebase:", e); }

        function App() {
          const [deferredPrompt, setDeferredPrompt] = useState(null);
          const [isInstallable, setIsInstallable] = useState(false);
          const [isIOS, setIsIOS] = useState(false);

          const [hasEntered, setHasEntered] = useState(false);
          const [gateProfile, setGateProfile] = useState('');
          const [userSession, setUserSession] = useState({ rol: "" });

          const [employees, setEmployees] = useState([]);
          const [loading, setLoading] = useState(true);
          const [onlineStatus, setOnlineStatus] = useState(navigator.onLine);
          const [searchTerm, setSearchTerm] = useState('');
          const [activeTab, setActiveTab] = useState('dashboard');
          const [activeFilter, setActiveFilter] = useState('TODOS');
          const [citiesList, setCitiesList] = useState(['Loncoche', 'Lanco', 'Valdivia', 'San José de la Mariquina', 'Los Lagos', 'Malalhue', 'Ciruelos', 'Panguipulli', 'Mariquina']);
          const [newCityInput, setNewCityInput] = useState('');
          
          const [isModalOpen, setIsModalOpen] = useState(false);
          const [currentEmployee, setCurrentEmployee] = useState(null);
          const [formError, setFormError] = useState('');
          
          const [isHistoryModalOpen, setIsHistoryModalOpen] = useState(false);
          const [selectedEmpForHistory, setSelectedEmpForHistory] = useState(null);
          const [isGlobalHistoryOpen, setIsGlobalHistoryOpen] = useState(false);

          const [formData, setFormData] = useState({
            nombre: '', rut: '', direccion: '', ciudad: 'Valdivia', cargo: 'OPERADOR GRUA HORQUILLA', telefono: '', correo: '', emergenciaNombre: '', emergenciaFono: '',
            documentos: { contrato: true, induccion: true, examenes: true, epp: true }
          });

          const supervisorsList = useMemo(() => {
            const list = employees
              .filter(e => (e.cargo || '').toUpperCase().includes('SUPERVISOR'))
              .map(e => e.nombre);
            return list.length > 0 ? list : ['Briones Victor', 'Nahuelpan Nahuelpan Reinaldo Patricio', 'Rubilar Rubilar Daniel Joel'];
          }, [employees]);

          const [logForm, setLogForm] = useState({
            tipo: 'Licencia Médica', modoFechas: 'rango', fechaInicio: new Date().toISOString().split('T')[0], fechaTermino: new Date().toISOString().split('T')[0], fechaUnica: new Date().toISOString().split('T')[0],
            customTipo: '', nota: '', archivos: [], 
            autorBitacora: '', rolBitacora: ''
          });

          // PWA Install Event
          useEffect(() => {
            const userAgent = window.navigator.userAgent.toLowerCase();
            setIsIOS(/iphone|ipad|ipod/.test(userAgent));

            const handleBeforeInstallPrompt = (e) => {
              e.preventDefault();
              setDeferredPrompt(e);
              setIsInstallable(true);
            };

            window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
            return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
          }, []);

          const handleInstallClick = async () => {
            if (deferredPrompt) {
              deferredPrompt.prompt();
              const { outcome } = await deferredPrompt.userChoice;
              if (outcome === 'accepted') setIsInstallable(false);
              setDeferredPrompt(null);
            } else if (isIOS) {
              alert("En iOS: Toca 'Compartir' en la barra inferior y luego 'Agregar a Inicio'.");
            }
          };

          const syncProfileLogic = (rolActivo) => {
            if (rolActivo === 'Administrativo') {
              setLogForm(prev => ({ ...prev, autorBitacora: 'Administrativo / RRHH', rolBitacora: 'Administrativo' }));
            } else if (rolActivo === 'AdminContrato') {
              setLogForm(prev => ({ ...prev, autorBitacora: 'Administrador de Contrato', rolBitacora: 'AdminContrato' }));
            } else if (rolActivo === 'Prevencionista') {
              setLogForm(prev => ({ ...prev, autorBitacora: 'Prevencionista de Riesgos', rolBitacora: 'Prevencionista' }));
            } else if (rolActivo === 'Supervisor') {
              const defaultSup = supervisorsList[0] || 'Briones Victor';
              setLogForm(prev => ({ ...prev, autorBitacora: defaultSup, rolBitacora: 'Supervisor' }));
            }
          };

          useEffect(() => {
            if (hasEntered) syncProfileLogic(userSession.rol);
          }, [userSession.rol, supervisorsList, hasEntered]);

          const fileInputRef = useRef(null);
          const logFileRef = useRef(null);

          // Sincronización Tiempo Real
          useEffect(() => {
            const on = () => setOnlineStatus(true), off = () => setOnlineStatus(false);
            window.addEventListener('online', on); window.addEventListener('offline', off);
            
            if (!hasEntered || !db) return;
            
            setLoading(true);
            const unsub = db.collection('employees').onSnapshot(snap => {
              const items = [];
              snap.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
              setEmployees(items); 
              setLoading(false);
            }, (error) => {
              console.error("Error Firebase:", error);
              setLoading(false);
            });
            return () => { unsub(); window.removeEventListener('online', on); window.removeEventListener('offline', off); };
          }, [hasEntered]);

          useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

          const handleEnterApp = () => {
            if (!gateProfile) return;
            setUserSession({ rol: gateProfile });
            syncProfileLogic(gateProfile);
            setHasEntered(true);
          };

          // EXPORTACIÓN REAL (INCLUYE BITÁCORA)
          const handleDownloadExcel = () => {
            try {
              if (!employees || employees.length === 0) {
                alert("No hay trabajadores para exportar.");
                return;
              }
              const exportData = employees.map(emp => {
                const historialTxt = emp.historial && emp.historial.length > 0 
                  ? emp.historial.map(h => `[${h.fechaInicio}] ${h.tipo} - ${h.nota}`).join(" | ") 
                  : "Sin registros";

                return {
                  "Nombre": emp.nombre || "",
                  "RUT": emp.rut || "",
                  "Cargo": emp.cargo || "",
                  "Ciudad": emp.ciudad || "",
                  "Dirección": emp.direccion || "",
                  "Teléfono": emp.telefono || "",
                  "Correo": emp.correo || "",
                  "Contacto de Emergencia": emp.emergenciaNombre || "",
                  "Teléfono Emergencia": emp.emergenciaFono || "",
                  "Contrato": emp.documentos?.contrato ? "Completo" : "Pendiente",
                  "Inducción S.S.O.": emp.documentos?.induccion ? "Completo" : "Pendiente",
                  "Exámenes Ocupacionales": emp.documentos?.examenes ? "Completo" : "Pendiente",
                  "EPP": emp.documentos?.epp ? "Completo" : "Pendiente",
                  "Historial / Bitácora": historialTxt
                };
              });

              const ws = XLSX.utils.json_to_sheet(exportData);
              const wb = XLSX.utils.book_new();
              XLSX.utils.book_append_sheet(wb, ws, "Dotacion Completa");
              const dateStr = new Date().toISOString().split('T')[0];
              XLSX.writeFile(wb, `BRAMAQ_Dotacion_Completa_${dateStr}.xlsx`);
              alert("Descarga realizada correctamente.");
            } catch (error) {
              alert("Error al generar Excel: " + error.message);
            }
          };

          const handleDownloadGlobalLogsExcel = () => {
            try {
              let logsToExport = [];
              employees.forEach(emp => {
                if (emp.historial && emp.historial.length > 0) {
                  emp.historial.forEach(h => {
                    let attachmentsText = "Ninguno";
                    if (h.archivos && h.archivos.length > 0) attachmentsText = h.archivos.map(a => a.nombre).join(", ");
                    logsToExport.push({
                      "Trabajador": emp.nombre || "Desconocido",
                      "RUT": emp.rut || "",
                      "Cargo": emp.cargo || "",
                      "Tipo de Evento": h.tipo || "",
                      "Fecha Inicio": h.fechaInicio || "",
                      "Fecha Término": h.fechaTermino || "",
                      "Observación": h.nota || "",
                      "Autor": h.autor || "",
                      "Perfil": h.rolAutor || "",
                      "Adjunto": attachmentsText
                    });
                  });
                }
              });

              if (logsToExport.length === 0) { alert("No hay registros en la bitácora."); return; }
              logsToExport.sort((a, b) => new Date(b["Fecha Inicio"]) - new Date(a["Fecha Inicio"]));
              const ws = XLSX.utils.json_to_sheet(logsToExport);
              const wb = XLSX.utils.book_new();
              XLSX.utils.book_append_sheet(wb, ws, "Hoja de Vida");
              XLSX.writeFile(wb, `BRAMAQ_Bitacora_Global.xlsx`);
            } catch (error) { alert("Error Excel: " + error.message); }
          };

          const handleDeleteAllData = async () => {
            if (userSession.rol !== 'Administrativo' && userSession.rol !== 'AdminContrato') {
              alert("Sin permisos para borrado masivo."); return;
            }
            if (confirm("⚠️ ACCIÓN CRÍTICA: ¿Vaciar toda la base de datos?")) {
              try {
                const batchSize = 400;
                let snapshot = await db.collection('employees').limit(batchSize).get();
                while (!snapshot.empty) {
                  const batch = db.batch();
                  snapshot.docs.forEach(doc => batch.delete(doc.ref));
                  await batch.commit();
                  snapshot = await db.collection('employees').limit(batchSize).get();
                }
                alert("Base de datos vaciada.");
              } catch (err) { alert("Error: " + err.message); }
            }
          };

          // IMPORTACIÓN EXCEL
          const handleUploadExcel = (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader(); reader.readAsArrayBuffer(file);
            reader.onload = async (event) => {
              try {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const jsonSheet = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: "", range: 1 });

                if (jsonSheet.length > 0) {
                  let addedCount = 0; let duplicateCount = 0;
                  let existingRuts = new Set(employees.map(emp => (emp.rut || '').trim().toLowerCase().replace(/[^0-9kK]/g, '')));

                  if (confirm(`Se detectaron ${jsonSheet.length} registros. ¿Importar omitiendo duplicados por RUT?`)) {
                    for (let row of jsonSheet) {
                      const keys = Object.keys(row);
                      const findVal = (terms) => {
                        for (let t of terms) {
                          const foundKey = keys.find(k => k.toLowerCase().includes(t));
                          if (foundKey && row[foundKey] !== undefined) return String(row[foundKey]).trim();
                        } return '';
                      };
                      const nombre = findVal(['nombre']); const rut = findVal(['rut']); const direccion = findVal(['direccion']); const ciudad = findVal(['ciudad']) || 'Valdivia'; const cargo = findVal(['cargo']); const telefono = findVal(['telefon', 'fono', 'celular']); const correo = findVal(['correo', 'email']); const emergenciaNombre = findVal(['emergencia', 'contacto']); const emergenciaFono = findVal(['emergencia fono', 'emergencia tel']);
                      const cleanRut = (rut || '').trim().toLowerCase().replace(/[^0-9kK]/g, '');

                      if ((nombre || rut) && cleanRut) {
                        if (!existingRuts.has(cleanRut)) {
                          await db.collection('employees').add({
                            nombre: nombre || 'Sin Nombre', rut: rut || 'Sin RUT', direccion: direccion || '', ciudad: ciudad, cargo: cargo || 'OPERADOR GRUA HORQUILLA', telefono: telefono, correo: correo, emergenciaNombre: emergenciaNombre, emergenciaFono: emergenciaFono,
                            documentos: { contrato: true, induccion: true, examenes: true, epp: true }, historial: []
                          });
                          existingRuts.add(cleanRut); addedCount++;
                        } else { duplicateCount++; }
                      }
                    }
                    alert(`¡Importación completada!\nAgregados: ${addedCount}\nDuplicados omitidos: ${duplicateCount}`);
                  }
                }
              } catch (err) { alert("Error: " + err.message); }
            };
          };

          // CRUD Trabajadores
          const handleSave = async (e) => {
            e.preventDefault();
            if (!formData.nombre || !formData.rut) { setFormError("Nombre y RUT obligatorios."); return; }
            try {
              if (currentEmployee) {
                await db.collection('employees').doc(currentEmployee.id).update(formData);
              } else {
                await db.collection('employees').add({ ...formData, historial: [] });
              }
              setIsModalOpen(false); setCurrentEmployee(null);
            } catch (err) { setFormError("Error: " + err.message); }
          };

          const handleDelete = async (id) => {
            if (userSession.rol !== 'Administrativo' && userSession.rol !== 'AdminContrato') { alert("Sin permisos."); return; }
            if (confirm("¿Eliminar este trabajador permanentemente?")) await db.collection('employees').doc(id).delete();
          };

          // Bitácora Funciones
          const handleLogFileChange = (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;
            const newArchivos = [];
            let processed = 0;
            files.forEach(file => {
              const reader = new FileReader();
              reader.onload = (uploadEvent) => {
                newArchivos.push({ nombre: file.name, tipo: file.type, url: uploadEvent.target.result, fechaCarga: new Date().toISOString() });
                processed++;
                if (processed === files.length) setLogForm(prev => ({ ...prev, archivos: [...(prev.archivos || []), ...newArchivos] }));
              };
              reader.readAsDataURL(file);
            });
            if (logFileRef.current) logFileRef.current.value = "";
          };

          const handleRemovePendingFile = (indexToRemove) => setLogForm(prev => ({ ...prev, archivos: prev.archivos.filter((_, idx) => idx !== indexToRemove) }));

          const handleDeleteSavedAttachment = async (logId, attachmentIndex) => {
            if (!selectedEmpForHistory) return;
            if (confirm("¿Eliminar este archivo adjunto?")) {
              try {
                const updatedHistorial = selectedEmpForHistory.historial.map(h => {
                  if (h.id === logId) return { ...h, archivos: h.archivos.filter((_, i) => i !== attachmentIndex) };
                  return h;
                });
                await db.collection('employees').doc(selectedEmpForHistory.id).update({ historial: updatedHistorial });
                setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: updatedHistorial });
              } catch (err) { alert("Error al eliminar archivo: " + err.message); }
            }
          };

          const handleDeleteLog = async (logId) => {
            if (!selectedEmpForHistory) return;
            if (confirm("¿Eliminar completamente esta observación?")) {
              try {
                const updatedHistorial = (selectedEmpForHistory.historial || []).filter(h => h.id !== logId);
                await db.collection('employees').doc(selectedEmpForHistory.id).update({ historial: updatedHistorial });
                setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: updatedHistorial });
              } catch (err) { alert("Error al eliminar bitácora: " + err.message); }
            }
          };

          const handleAddLog = async (e) => {
            e.preventDefault();
            if (!selectedEmpForHistory) return;
            const logEntry = {
              id: String(Date.now()), 
              tipo: logForm.tipo === 'Otro' ? (logForm.customTipo || 'Otro') : logForm.tipo, 
              modoFechas: logForm.modoFechas,
              fechaInicio: logForm.modoFechas === 'rango' ? logForm.fechaInicio : logForm.fechaUnica,
              fechaTermino: logForm.modoFechas === 'rango' ? logForm.fechaTermino : logForm.fechaUnica,
              nota: logForm.nota || '', archivos: logForm.archivos || [], 
              autor: logForm.autorBitacora, rolAutor: logForm.rolBitacora, createdAt: new Date().toISOString()
            };
            try {
              const updatedHistorial = [...(selectedEmpForHistory.historial || []), logEntry];
              await db.collection('employees').doc(selectedEmpForHistory.id).update({ historial: updatedHistorial });
              setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: updatedHistorial });
              setLogForm({ tipo: 'Licencia Médica', modoFechas: 'rango', fechaInicio: new Date().toISOString().split('T')[0], fechaTermino: new Date().toISOString().split('T')[0], fechaUnica: new Date().toISOString().split('T')[0], customTipo: '', nota: '', archivos: [], autorBitacora: userSession.rol === 'Supervisor' ? (supervisorsList[0] || '') : logForm.autorBitacora, rolBitacora: userSession.rol });
              alert("Bitácora registrada.");
            } catch (error) { alert("Error: " + error.message); }
          };

          const getMissingDataList = (emp) => {
            let missing = [];
            if (!emp.telefono) missing.push("Teléfono");
            if (!emp.correo) missing.push("Correo");
            if (!emp.emergenciaNombre || !emp.emergenciaFono) missing.push("Emergencia");
            if (emp.documentos) {
              if (!emp.documentos.contrato) missing.push("Contrato");
              if (!emp.documentos.induccion) missing.push("Inducción");
              if (!emp.documentos.examenes) missing.push("Exámenes");
              if (!emp.documentos.epp) missing.push("EPP");
            }
            return missing;
          };

          const filtered = useMemo(() => {
            return employees.filter(emp => {
              const s = searchTerm.toLowerCase();
              const matchSearch = (emp.nombre||'').toLowerCase().includes(s) || (emp.rut||'').toLowerCase().includes(s) || (emp.cargo||'').toLowerCase().includes(s) || (emp.ciudad||'').toLowerCase().includes(s);
              if (!matchSearch) return false;
              if (activeFilter === 'TODOS') return true;
              if (activeFilter === 'INCOMPLETOS') return getMissingDataList(emp).length > 0;
              if (activeFilter === 'ADMIN_CONTRATO') return (emp.cargo||'').toUpperCase().includes('CONTRATO');
              if (activeFilter === 'SUPERVISORES') return (emp.cargo||'').toUpperCase().includes('SUPERVISOR');
              if (activeFilter === 'PREVENCIONISTAS') return (emp.cargo||'').toUpperCase().includes('PREVENCION');
              if (activeFilter === 'ADMINISTRATIVOS') return (emp.cargo||'').toUpperCase().includes('ADMINISTRATIVO') && !(emp.cargo||'').toUpperCase().includes('CONTRATO');
              if (activeFilter === 'OPERADORES_GRUA') return (emp.cargo||'').toUpperCase().includes('GRUA');
              if (activeFilter === 'CARGADOR_FRONTAL') return (emp.cargo||'').toUpperCase().includes('CARGADOR FRONTAL');
              if (activeFilter === 'MECANICOS') return (emp.cargo||'').toUpperCase().includes('MECANICO');
              if (citiesList.includes(activeFilter)) return (emp.ciudad||'').toLowerCase() === activeFilter.toLowerCase();
              return true;
            }).sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es', { sensitivity: 'base' }));
          }, [employees, searchTerm, activeFilter, citiesList]);

          const kpis = useMemo(() => {
            const porCiudad = {}; citiesList.forEach(c => porCiudad[c] = employees.filter(e => (e.ciudad||'').toLowerCase() === c.toLowerCase()).length);
            return {
              total: employees.length, incompletos: employees.filter(e => getMissingDataList(e).length > 0).length,
              supervisores: employees.filter(e => (e.cargo||'').toUpperCase().includes('SUPERVISOR')).length,
              prevencionistas: employees.filter(e => (e.cargo||'').toUpperCase().includes('PREVENCION')).length,
              administrativos: employees.filter(e => (e.cargo||'').toUpperCase().includes('ADMINISTRATIVO') && !(e.cargo||'').toUpperCase().includes('CONTRATO')).length,
              adminContrato: employees.filter(e => (e.cargo||'').toUpperCase().includes('CONTRATO')).length,
              operadoresGrua: employees.filter(e => (e.cargo||'').toUpperCase().includes('GRUA')).length,
              cargadorFrontal: employees.filter(e => (e.cargo||'').toUpperCase().includes('CARGADOR FRONTAL')).length,
              mecanicos: employees.filter(e => (e.cargo||'').toUpperCase().includes('MECANICO')).length,
              porCiudad
            };
          }, [employees, citiesList]);

          const allGlobalLogs = useMemo(() => {
            let logs = [];
            employees.forEach(emp => { if (emp.historial) emp.historial.forEach(h => logs.push({ ...h, empleadoNombre: emp.nombre, empleadoRut: emp.rut })); });
            return logs.sort((a, b) => new Date(b.createdAt || b.fechaInicio) - new Date(a.createdAt || a.fechaInicio));
          }, [employees]);

          const RequisitoToggle = ({ label, icon, checked, onChange }) => (
            <label className={`flex items-center gap-3 p-3.5 rounded-xl border cursor-pointer ${checked ? 'bg-emerald-500/10 border-emerald-500/30' : 'bg-slate-900/60 border-slate-800'}`}>
                <input type="checkbox" checked={checked} onChange={onChange} className="hidden" />
                <div className={`w-5 h-5 rounded flex items-center justify-center ${checked ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 border border-slate-700'}`}>{checked && <i data-lucide="check" className="w-3 h-3"></i>}</div>

                            {selectedEmpForHistory.historial.map(h => (
                              <div key={h.id} className="bg-slate-950 border border-slate-800 p-4 rounded-xl">
                                <div className="flex justify-between mb-2">
                                  <span className="bg-slate-800 text-white text-xs font-bold px-2 py-1 rounded">{h.tipo}</span>
                                  <span className="text-xs text-slate-400 font-mono">{h.fechaInicio}</span>
                                </div>
                                {h.nota && <p className="text-sm text-slate-300 mb-3">{h.nota}</p>}
                                {h.archivos?.length > 0 && (
                                  <div className="grid grid-cols-2 gap-2 mb-3">
                                    {h.archivos.map((a, i) => (
                                      <div key={i} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                                        <a href={a.url} target="_blank" className="text-[10px] text-blue-400 truncate w-3/4"><i data-lucide="paperclip" className="w-3 h-3 inline"></i> {a.nombre}</a>
                                        <button onClick={() => handleDeleteSavedAttachment(h.id, i)} className="text-red-400"><i data-lucide="trash-2" className="w-3 h-3"></i></button>
                                      </div>
                                    ))}
                                  </div>
                                )}
                                <div className="flex justify-between items-center text-[10px] text-slate-500 border-t border-slate-800 pt-2">
                                  <span>Por: {h.autor} ({h.rolAutor})</span>
                                  <button onClick={() => handleDeleteLog(h.id)} className="text-red-500 hover:text-red-400 flex items-center gap-1"><i data-lucide="trash" className="w-3 h-3"></i> Borrar Todo</button>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                      <div className="w-full lg:w-96 p-6 bg-slate-900/50">
                        <h4 className="text-xs font-bold text-amber-500 uppercase mb-4">Nueva Observación</h4>
                        <form onSubmit={handleAddLog} className="space-y-4">
                          <select value={logForm.tipo} onChange={e=>setLogForm({...logForm, tipo:e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white"><option value="Licencia Médica">Licencia Médica</option><option value="Extensión de Licencia">Extensión de Licencia</option><option value="Permiso">Permiso</option><option value="Falta">Falta a Reunión</option><option value="Incidente">Incidente</option><option value="Otro">Otro...</option></select>
                          {logForm.tipo === 'Otro' && <input required placeholder="Especificar..." value={logForm.customTipo} onChange={e=>setLogForm({...logForm, customTipo:e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white" />}
                          <div className="grid grid-cols-2 gap-2"><input type="date" value={logForm.fechaInicio} onChange={e=>setLogForm({...logForm, fechaInicio:e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-white" /><input type="date" value={logForm.fechaTermino} onChange={e=>setLogForm({...logForm, fechaTermino:e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-white" /></div>
                          <textarea placeholder="Observaciones..." value={logForm.nota} onChange={e=>setLogForm({...logForm, nota:e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white h-24"></textarea>
                          <div>
                            <input type="file" multiple ref={logFileRef} onChange={handleLogFileChange} className="hidden" />
                            <button type="button" onClick={() => logFileRef.current.click()} className="w-full bg-slate-800 border border-slate-700 text-slate-300 py-2 rounded-lg text-xs font-bold"><i data-lucide="paperclip" className="w-4 h-4 inline"></i> Adjuntar Archivos</button>
                            {logForm.archivos.length > 0 && <div className="mt-2 space-y-1">{logForm.archivos.map((a,i) => <div key={i} className="text-[10px] text-emerald-400 flex justify-between"><span>{a.nombre}</span><button type="button" onClick={()=>handleRemovePendingFile(i)} className="text-red-400"><i data-lucide="x" className="w-3 h-3"></i></button></div>)}</div>}
                          </div>
                          <button type="submit" className="w-full bg-amber-500 text-black py-3 rounded-lg font-bold text-sm">Guardar Observación</button>
                        </form>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* MODAL HOJA DE VIDA GLOBAL */}
              {isGlobalHistoryOpen && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-sm fade-in">
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-5xl h-[90vh] flex flex-col shadow-2xl">
                    <div className="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-900 rounded-t-2xl">
                      <h3 className="font-bold text-white text-lg">Consolidado Global de Bitácoras</h3>
                      <button onClick={() => setIsGlobalHistoryOpen(false)} className="text-slate-400 hover:text-white bg-slate-800 p-2 rounded-lg"><i data-lucide="x" className="w-5 h-5"></i></button>
                    </div>
                    <div className="flex-1 overflow-y-auto p-6 bg-slate-950/50">
                      {allGlobalLogs.length === 0 ? <p className="text-center text-slate-500 py-10">No hay registros globales.</p> : (
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                          {allGlobalLogs.map((log, i) => (
                            <div key={i} className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                              <div className="font-bold text-sm text-white mb-1">{log.empleadoNombre}</div>
                              <div className="flex justify-between items-center mb-2"><span className="text-[10px] text-slate-400 font-mono">{log.empleadoRut}</span><span className="text-[10px] bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded">{log.tipo}</span></div>
                              <p className="text-xs text-slate-300 bg-slate-950 p-2 rounded mb-2">{log.nota}</p>
                              <div className="text-[10px] text-slate-500 flex justify-between"><span>{log.fechaInicio}</span><span>Autor: {log.autor}</span></div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                    <div className="p-5 border-t border-slate-800 flex justify-end gap-3 bg-slate-900 rounded-b-2xl">
                      <button onClick={handleDownloadGlobalLogsExcel} className="bg-emerald-600 text-white px-5 py-2.5 rounded-xl font-bold text-sm flex items-center gap-2"><i data-lucide="file-spreadsheet" className="w-4 h-4"></i> Descargar Consolidado (Excel)</button>
                    </div>
                  </div>
                </div>
              )}

            </div>
          );
        }

        // CARGA SEGURA SIN PANTALLAS AZULES NI BLANCAS
        window.addEventListener('load', () => {
            const container = document.getElementById('root');
            if (container) {
                try {
                    const root = ReactDOM.createRoot(container);
                    root.render(<App />);
                } catch (e) {
                    console.error("Error crítico UI:", e);
                    container.innerHTML = '<div style="color:white; padding:40px; text-align:center;">Error al iniciar la interfaz.</div>';
                }
            }
        });
    </script>
</body>
</html>
