<!DOCTYPE html>
<html lang="es" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/Gestor-Dotaci-n/">
    
    <!-- PWA & Mobile Optimization -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BRAMAQ">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3200/3200424.png">
    
    <title>Gestor de Dotación BRAMAQ - Enterprise Cloud</title>
    
    <!-- CDNs Empresariales -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    
    <!-- REGISTRO SERVICE WORKER -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => console.warn('PWA SW offline.'));
        });
      }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f1f5f9; margin: 0; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(30, 41, 59, 0.8); }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        #root { min-height: 100vh; }
        .app-loader { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: #f59e0b; font-weight: bold; background: #020617; }
    </style>
</head>
<body class="antialiased selection:bg-amber-500/30 selection:text-amber-200" translate="no">
    <!-- CARGADOR INICIAL -->
    <div id="loader-estatico" class="app-loader">
        <div style="font-size: 24px; margin-bottom: 10px;">BRAMAQ Enterprise</div>
        <div style="font-size: 14px; color: #94a3b8; font-weight: normal;">Iniciando sistema...</div>
    </div>

    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        
        // =====================================================================
        // RENDERIZADOR INFALIBLE DE ÍCONOS
        // =====================================================================
        const Ico = ({ i, c, title }) => {
            const spanRef = useRef(null);
            useEffect(() => {
                if (spanRef.current && window.lucide) {
                    spanRef.current.innerHTML = `<i data-lucide="${i}" class="${c || ''}"></i>`;
                    window.lucide.createIcons({ root: spanRef.current });
                }
            }, [i, c]);
            return <span ref={spanRef} title={title||''} className="inline-flex items-center justify-center pointer-events-none" style={{lineHeight: 0}}></span>;
        };

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return <div className="p-10 text-center text-red-400 font-sans">
                        <h2 className="text-2xl font-bold mb-4">El sistema evitó un colapso crítico.</h2>
                        <div className="bg-black p-4 rounded text-xs text-left overflow-auto mb-4">{this.state.error.toString()}</div>
                        <button onClick={()=>window.location.reload()} className="bg-amber-500 text-black px-6 py-2 rounded font-bold">Recargar Sistema</button>
                    </div>;
                }
                return this.props.children;
            }
        }
        
        // CONFIGURACIÓN CENTRAL FIREBASE
        const firebaseConfig = {
          apiKey: "AIzaSyD_ZlO3treRtz6ZkjY9Vr69wJz2vA...",
          authDomain: "bramaqcloud.firebaseapp.com",
          projectId: "bramaqcloud",
          storageBucket: "bramaqcloud.appspot.com",
          messagingSenderId: "369713509600",
          appId: "1:369713509600:web:b6d878c..."
        };

        let db, storage;
        try {
          if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
          db = firebase.firestore();
          db.enablePersistence({ synchronizeTabs: true }).catch(() => console.warn('Caché offline limitada'));
          try { storage = firebase.storage(); } catch(e) { storage = null; }
        } catch (e) { console.error("Error iniciando base de datos:", e); }

        function App() {
          const [deferredPrompt, setDeferredPrompt] = useState(null);
          const [isInstallable, setIsInstallable] = useState(false);
          const [isIOS, setIsIOS] = useState(false);
          const [showInstallHelp, setShowInstallHelp] = useState(false);

          const [hasEntered, setHasEntered] = useState(false);
          const [selectedRole, setSelectedRole] = useState('');
          const [selectedSupName, setSelectedSupName] = useState('');
          const [userSession, setUserSession] = useState({ rol: "", autor: "" });

          const [employees, setEmployees] = useState([]);
          const [loading, setLoading] = useState(false); 
          const [onlineStatus, setOnlineStatus] = useState(navigator.onLine);
          const [searchTerm, setSearchTerm] = useState('');
          const [activeTab, setActiveTab] = useState('dashboard');
          const [activeFilter, setActiveFilter] = useState('TODOS');
          const [citiesList, setCitiesList] = useState([]);
          
          const [isModalOpen, setIsModalOpen] = useState(false);
          const [currentEmployee, setCurrentEmployee] = useState(null);
          const [formError, setFormError] = useState('');
          
          const [isHistoryModalOpen, setIsHistoryModalOpen] = useState(false);
          const [selectedEmpForHistory, setSelectedEmpForHistory] = useState(null);
          const [isGlobalHistoryOpen, setIsGlobalHistoryOpen] = useState(false);
          const [selectedPhone, setSelectedPhone] = useState(null);
          const [uploadingFiles, setUploadingFiles] = useState(false);

          const [formData, setFormData] = useState({
            nombre: '', rut: '', direccion: '', ciudad: '', cargo: '', telefono: '', correo: '', emergenciaNombre: '', emergenciaFono: '',
            documentos: { contrato: true, induccion: true, examenes: true, epp: true }
          });

          const [logForm, setLogForm] = useState({
            tipo: 'Licencia Médica', modoFechas: 'unica', fechaInicio: new Date().toISOString().split('T')[0], fechaTermino: new Date().toISOString().split('T')[0], fechaUnica: new Date().toISOString().split('T')[0],
            customTipo: '', nota: '', archivos: []
          });

          // Ocultar loader estático
          useEffect(() => {
              const loader = document.getElementById('loader-estatico');
              if (loader) loader.style.display = 'none';
          }, []);

          // PWA Install Logic
          useEffect(() => {
            setIsIOS(/iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase()));
            const handleBeforeInstallPrompt = (e) => { e.preventDefault(); setDeferredPrompt(e); setIsInstallable(true); };
            window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
            return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
          }, []);

          const handleInstallClick = async () => {
            if (deferredPrompt) {
              deferredPrompt.prompt();
              const { outcome } = await deferredPrompt.userChoice;
              if (outcome === 'accepted') setIsInstallable(false);
              setDeferredPrompt(null);
            } else {
              setShowInstallHelp(true);
            }
          };

          // SINCRONIZACIÓN FIREBASE EN TIEMPO REAL
          useEffect(() => {
            const on = () => setOnlineStatus(true), off = () => setOnlineStatus(false);
            window.addEventListener('online', on); window.addEventListener('offline', off);
            
            if (!db) return; 
            
            setLoading(true);
            const unsub = db.collection('employees').onSnapshot(snap => {
              const items = [];
              const cities = new Set(['Valdivia', 'Loncoche', 'San José de la Mariquina', 'Lanco', 'Panguipulli']);
              snap.forEach(doc => {
                const data = doc.data() || {};
                items.push({ id: doc.id, ...data });
                if (data.ciudad) cities.add(String(data.ciudad).trim());
              });
              setCitiesList(Array.from(cities).sort());
              setEmployees(items); 
              setLoading(false);
            }, (error) => { console.error("Error DB:", error); setLoading(false); });
            
            return () => { unsub(); window.removeEventListener('online', on); window.removeEventListener('offline', off); };
          }, []);

          const supervisorsList = useMemo(() => {
            return employees.filter(e => String(e.cargo || '').toUpperCase().includes('SUPERVISOR')).map(e => String(e.nombre || 'Sin Nombre')).sort();
          }, [employees]);

          const handleEnterApp = () => {
            if (!selectedRole) return;
            if (selectedRole === 'Supervisor' && !selectedSupName) return;
            let autorNombre = selectedRole;
            if (selectedRole === 'Administrativo') autorNombre = 'Administrativo / RRHH';
            if (selectedRole === 'AdminContrato') autorNombre = 'Administrador de Contrato';
            if (selectedRole === 'Prevencionista') autorNombre = 'Prevencionista de Riesgos';
            if (selectedRole === 'Supervisor') autorNombre = selectedSupName;
            setUserSession({ rol: selectedRole, autor: autorNombre });
            setHasEntered(true);
          };

          // NORMALIZACIÓN DE TELÉFONO
          const normalizePhone = (phone) => {
            if (!phone) return '';
            let p = String(phone).replace(/\D/g, '');
            if (p.length === 8) p = '569' + p;
            if (p.length === 9 && p.startsWith('9')) p = '56' + p;
            return '+' + p;
          };

          const cleanRut = (rut) => String(rut || '').trim().toLowerCase().replace(/[^0-9kK]/g, '');

          // EXPORTACIÓN TOTAL A EXCEL
          const handleDownloadExcel = () => {
            try {
              if (employees.length === 0) { alert("Base de datos vacía."); return; }
              const exportData = employees.map(emp => {
                const historialTxt = emp.historial?.length > 0 
                  ? emp.historial.map(h => `[${h.fechaInicio || ''}] ${h.tipo || ''}: ${h.nota || ''}`).join(" | ") 
                  : "Sin registros";
                
                const row = {
                  "RUT": emp.rut || "", "Nombre": emp.nombre || "", "Cargo": emp.cargo || "", "Ciudad": emp.ciudad || "",
                  "Dirección": emp.direccion || "", "Teléfono": emp.telefono ? normalizePhone(emp.telefono) : "",
                  "Correo": emp.correo || "", "Contacto Emergencia": emp.emergenciaNombre || "",
                  "Teléfono Emergencia": emp.emergenciaFono ? normalizePhone(emp.emergenciaFono) : "",
                  "Contrato": emp.documentos?.contrato ? "Sí" : "No", "Inducción SSO": emp.documentos?.induccion ? "Sí" : "No",
                  "Exámenes": emp.documentos?.examenes ? "Sí" : "No", "EPP": emp.documentos?.epp ? "Sí" : "No",
                  "Historial (Bitácora)": historialTxt
                };
                
                Object.keys(emp).forEach(key => {
                  if (!['id', 'historial', 'documentos', 'rut', 'nombre', 'cargo', 'ciudad', 'direccion', 'telefono', 'correo', 'emergenciaNombre', 'emergenciaFono'].includes(key)) {
                    row[key] = emp[key];
                  }
                });
                return row;
              });

              const ws = XLSX.utils.json_to_sheet(exportData);
              const wb = XLSX.utils.book_new();
              XLSX.utils.book_append_sheet(wb, ws, "Dotacion Completa");
              XLSX.writeFile(wb, `BRAMAQ_Dotacion_${new Date().toISOString().split('T')[0]}.xlsx`);
            } catch (error) { alert("Error al exportar: " + error.message); }
          };

          const handleDownloadGlobalLogsExcel = () => {
            try {
              let logs = [];
              employees.forEach(emp => {
                if (emp.historial && Array.isArray(emp.historial)) {
                  emp.historial.forEach(h => {
                    logs.push({
                      "RUT": emp.rut || '', "Trabajador": emp.nombre || '', "Cargo": emp.cargo || '', "Tipo Evento": h.tipo || '',
                      "Fecha": h.modoFechas === 'rango' ? `${h.fechaInicio || ''} a ${h.fechaTermino || ''}` : (h.fechaInicio || ''),
                      "Observación": h.nota || '', "Autor": h.autor || '', "Perfil": h.rolAutor || '',
                      "Tiene Archivos": h.archivos?.length > 0 ? "SÍ" : "NO"
                    });
                  });
                }
              });
              if (logs.length === 0) { alert("No hay bitácoras registradas."); return; }
              logs.sort((a, b) => new Date(b["Fecha"] || 0) - new Date(a["Fecha"] || 0));
              const ws = XLSX.utils.json_to_sheet(logs);
              const wb = XLSX.utils.book_new();
              XLSX.utils.book_append_sheet(wb, ws, "Bitacora Global");
              XLSX.writeFile(wb, `BRAMAQ_Bitacora_Global.xlsx`);
            } catch (error) { alert("Error: " + error.message); }
          };

          const handleDeleteAllData = async () => {
            if (userSession.rol !== 'Administrativo') { alert("Acción reservada para Administración."); return; }
            if (confirm("⚠️ ALERTA: ¿Deseas vaciar toda la base de datos de trabajadores?\nNo podrás recuperar los datos sin respaldo.")) {
              try {
                const snapshot = await db.collection('employees').get();
                const batch = db.batch();
                snapshot.docs.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
                alert("Base de datos vaciada con éxito.");
              } catch (err) { alert("Error: " + err.message); }
            }
          };

          // IMPORTACIÓN INTELIGENTE DE EXCEL
          const fileInputRef = useRef(null);
          const logFileRef = useRef(null);

          const handleUploadExcel = (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader(); reader.readAsArrayBuffer(file);
            reader.onload = async (event) => {
              try {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                let rawData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
                let headerIdx = 0;
                for (let i = 0; i < rawData.length; i++) {
                  const rowStr = JSON.stringify(rawData[i]).toLowerCase();
                  if (rowStr.includes('nombre') || rowStr.includes('rut')) { headerIdx = i; break; }
                }
                const jsonSheet = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { range: headerIdx, defval: "" });

                if (jsonSheet.length > 0) {
                  let addedCount = 0; let duplicateCount = 0;
                  let existingRuts = new Set(employees.map(emp => cleanRut(emp.rut)));
                  
                  if (confirm(`Se detectaron ${jsonSheet.length} filas.\nSe omitirán automáticamente los duplicados por RUT.\n¿Proceder?`)) {
                    for (let row of jsonSheet) {
                      const keys = Object.keys(row);
                      const findVal = (terms) => {
                        for (let t of terms) {
                          const k = keys.find(key => String(key).toLowerCase().includes(t));
                          if (k && row[k] !== undefined && row[k] !== "") return String(row[k]).trim();
                        } return '';
                      };
                      
                      const nombre = findVal(['nombre']); const rut = findVal(['rut']); const direccion = findVal(['direccion', 'domicilio']); const ciudad = findVal(['ciudad', 'comuna']) || 'Valdivia'; const cargo = findVal(['cargo', 'funcion']); const telefono = findVal(['telefon', 'fono', 'celular']); const correo = findVal(['correo', 'email']); const emergenciaNombre = findVal(['emergencia nom', 'contacto emer']); const emergenciaFono = findVal(['emergencia fono', 'emergencia tel']);
                      const cRut = cleanRut(rut);
                      
                      if ((nombre || rut) && cRut) {
                        if (!existingRuts.has(cRut)) {
                          let extras = {};
                          keys.forEach(k => {
                            const kl = String(k).toLowerCase();
                            if (!kl.includes('nombre') && !kl.includes('rut') && !kl.includes('direccion') && !kl.includes('ciudad') && !kl.includes('cargo') && !kl.includes('telefon') && !kl.includes('correo') && !kl.includes('emergencia')) {
                              if (row[k]) extras[k] = row[k];
                            }
                          });

                          await db.collection('employees').add({
                            nombre: nombre || 'Sin Nombre', rut: rut, direccion: direccion, ciudad: ciudad, cargo: cargo || 'OPERADOR', telefono: telefono, correo: correo, emergenciaNombre: emergenciaNombre, emergenciaFono: emergenciaFono,
                            documentos: { contrato: true, induccion: true, examenes: true, epp: true }, historial: [], ...extras
                          });
                          existingRuts.add(cRut); addedCount++;
                        } else { duplicateCount++; }
                      }
                    }
                    alert(`✅ Carga masiva exitosa.\nNuevos: ${addedCount}\nDuplicados omitidos: ${duplicateCount}`);
                  }
                }
              } catch (err) { alert("Error de formato: " + err.message); }
            };
            fileInputRef.current.value = "";
          };

          const handleSave = async (e) => {
            e.preventDefault();
            if (!formData.nombre || !formData.rut) { setFormError("Nombre y RUT son obligatorios."); return; }
            try {
              if (currentEmployee) await db.collection('employees').doc(currentEmployee.id).update(formData);
              else await db.collection('employees').add({ ...formData, historial: [] });
              setIsModalOpen(false); setCurrentEmployee(null);
            } catch (err) { setFormError("Error base de datos: " + err.message); }
          };

          const handleDelete = async (id) => {
            if (userSession.rol !== 'Administrativo') { alert("Función restringida a Administración."); return; }
            if (confirm("⚠️ ¿Eliminar permanentemente este trabajador y toda su hoja de vida?")) await db.collection('employees').doc(id).delete();
          };

          // MULTIARCHIVO BITÁCORA
          const handleLogFileChange = (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;
            const newPending = [];
            files.forEach(file => newPending.push({ fileObj: file, nombre: file.name, tipo: file.type }));
            setLogForm(prev => ({ ...prev, archivos: [...prev.archivos, ...newPending] }));
            if (logFileRef.current) logFileRef.current.value = "";
          };

          const handleRemovePendingFile = (idx) => setLogForm(prev => ({ ...prev, archivos: prev.archivos.filter((_, i) => i !== idx) }));

          const handleDeleteSavedAttachment = async (logId, fileIdx) => {
            if (!selectedEmpForHistory) return;
            if (confirm("¿Estás seguro de eliminar este archivo adjunto?")) {
              try {
                const updatedHistorial = selectedEmpForHistory.historial.map(h => {
                  if (h.id === logId) return { ...h, archivos: h.archivos.filter((_, i) => i !== fileIdx) };
                  return h;
                });
                await db.collection('employees').doc(selectedEmpForHistory.id).update({ historial: updatedHistorial });
                setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: updatedHistorial });
              } catch (err) { alert("Error: " + err.message); }
            }
          };

          const handleDeleteLog = async (logId) => {
            if (!selectedEmpForHistory) return;
            if (confirm("⚠️ ¿Eliminar permanentemente esta observación del historial?")) {
              try {
                const updatedHistorial = selectedEmpForHistory.historial.filter(h => h.id !== logId);
                await db.collection('employees').doc(selectedEmpForHistory.id).update({ historial: updatedHistorial });
                setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: updatedHistorial });
              } catch (err) { alert("Error: " + err.message); }
            }
          };

          const handleAddLog = async (e) => {
            e.preventDefault();
            if (!selectedEmpForHistory) return;
            setUploadingFiles(true);

            try {
              const finalFiles = [];
              for (const item of logForm.archivos) {
                 if(storage) {
                     const path = `bitacora/${selectedEmpForHistory.id}/${Date.now()}_${item.nombre}`;
                     const ref = storage.ref(path);
                     await ref.put(item.fileObj);
                     const url = await ref.getDownloadURL();
                     finalFiles.push({ nombre: item.nombre, tipo: item.tipo, url: url, path: path });
                 } else {
                     const reader = new FileReader();
                     const url = await new Promise((res) => { reader.onload = (ev) => res(ev.target.result); reader.readAsDataURL(item.fileObj); });
                     finalFiles.push({ nombre: item.nombre, tipo: item.tipo, url: url });
                 }
              }

              const logEntry = {
                id: String(Date.now()), tipo: logForm.tipo === 'Otro' ? (logForm.customTipo || 'Otro') : logForm.tipo, 
                modoFechas: logForm.modoFechas, fechaInicio: logForm.modoFechas === 'rango' ? logForm.fechaInicio : logForm.fechaUnica,
                fechaTermino: logForm.modoFechas === 'rango' ? logForm.fechaTermino : logForm.fechaUnica,
                nota: logForm.nota || '', archivos: finalFiles, 
                autor: userSession.autor, rolAutor: userSession.rol, createdAt: new Date().toISOString()
              };
              
              const updatedHistorial = [...(selectedEmpForHistory.historial || []), logEntry];
              await db.collection('employees').doc(selectedEmpForHistory.id).update({ historial: updatedHistorial });
              setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: updatedHistorial });
              setLogForm({ tipo: 'Licencia Médica', modoFechas: 'unica', fechaInicio: new Date().toISOString().split('T')[0], fechaTermino: new Date().toISOString().split('T')[0], fechaUnica: new Date().toISOString().split('T')[0], customTipo: '', nota: '', archivos: [] });
              setUploadingFiles(false);
            } catch (error) { 
              alert("Error guardando observación: " + error.message); 
              setUploadingFiles(false); 
            }
          };

          const getMissingDataList = (emp) => {
            let missing = [];
            if (!emp.telefono) missing.push("Teléfono");
            if (!emp.correo) missing.push("Correo");
            if (!emp.emergenciaNombre || !emp.emergenciaFono) missing.push("Emergencia");
            if (emp.documentos) {
              if (!emp.documentos.contrato) missing.push("Contrato");
              if (!emp.documentos.induccion) missing.push("Inducción");
              if (!emp.documentos.examenes) missing.push("Exámenes");
              if (!emp.documentos.epp) missing.push("EPP");
            }
            return missing;
          };

          const filtered = useMemo(() => {
            return employees.filter(emp => {
              const s = String(searchTerm || '').toLowerCase();
              const matchSearch = String(emp.nombre||'').toLowerCase().includes(s) || String(emp.rut||'').toLowerCase().includes(s) || String(emp.cargo||'').toLowerCase().includes(s) || String(emp.ciudad||'').toLowerCase().includes(s);
              if (!matchSearch) return false;
              if (activeFilter === 'TODOS') return true;
              if (activeFilter === 'INCOMPLETOS') return getMissingDataList(emp).length > 0;
              if (activeFilter === 'ADMIN_CONTRATO') return String(emp.cargo||'').toUpperCase().includes('CONTRATO');
              if (activeFilter === 'SUPERVISORES') return String(emp.cargo||'').toUpperCase().includes('SUPERVISOR');
              if (activeFilter === 'PREVENCIONISTAS') return String(emp.cargo||'').toUpperCase().includes('PREVENCION');
              if (activeFilter === 'ADMINISTRATIVOS') return String(emp.cargo||'').toUpperCase().includes('ADMINISTRATIVO') && !String(emp.cargo||'').toUpperCase().includes('CONTRATO');
              if (activeFilter === 'OPERADORES_GRUA') return String(emp.cargo||'').toUpperCase().includes('GRUA');
              if (activeFilter === 'CARGADOR_FRONTAL') return String(emp.cargo||'').toUpperCase().includes('CARGADOR FRONTAL');
              if (activeFilter === 'MECANICOS') return String(emp.cargo||'').toUpperCase().includes('MECANICO');
              if (citiesList.includes(activeFilter)) return String(emp.ciudad||'').toLowerCase() === String(activeFilter).toLowerCase();
              return true;
            }).sort((a, b) => String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es', { sensitivity: 'base' }));
          }, [employees, searchTerm, activeFilter, citiesList]);

          const kpis = useMemo(() => {
            const porCiudad = {}; citiesList.forEach(c => porCiudad[c] = employees.filter(e => String(e.ciudad||'').toLowerCase() === String(c).toLowerCase()).length);
            let faltas = 0, incidentes = 0, licencias = 0;
            employees.forEach(emp => {
               if(emp.historial && Array.isArray(emp.historial)) {
                   emp.historial.forEach(h => {
                       const t = String(h.tipo || '').toLowerCase();
                       if(t.includes('falta')) faltas++;
                       if(t.includes('incidente')) incidentes++;
                       if(t.includes('licencia')) licencias++;
                   });
               }
            });

            return {
              total: employees.length, incompletos: employees.filter(e => getMissingDataList(e).length > 0).length,
              supervisores: employees.filter(e => String(e.cargo||'').toUpperCase().includes('SUPERVISOR')).length,
              prevencionistas: employees.filter(e => String(e.cargo||'').toUpperCase().includes('PREVENCION')).length,
              administrativos: employees.filter(e => String(e.cargo||'').toUpperCase().includes('ADMINISTRATIVO') && !String(e.cargo||'').toUpperCase().includes('CONTRATO')).length,
              adminContrato: employees.filter(e => String(e.cargo||'').toUpperCase().includes('CONTRATO')).length,
              operadoresGrua: employees.filter(e => String(e.cargo||'').toUpperCase().includes('GRUA')).length,
              cargadorFrontal: employees.filter(e => String(e.cargo||'').toUpperCase().includes('CARGADOR FRONTAL')).length,
              mecanicos: employees.filter(e => String(e.cargo||'').toUpperCase().includes('MECANICO')).length,
              faltas, incidentes, licencias, porCiudad
            };
          }, [employees, citiesList]);

          const allGlobalLogs = useMemo(() => {
            let logs = [];
            employees.forEach(emp => { if (emp.historial && Array.isArray(emp.historial)) emp.historial.forEach(h => logs.push({ ...h, empleadoNombre: emp.nombre || 'Desconocido', empleadoRut: emp.rut || '' })); });
            return logs.sort((a, b) => new Date(b.createdAt || b.fechaInicio || 0) - new Date(a.createdAt || a.fechaInicio || 0));
          }, [employees]);

          const RequisitoToggle = ({ label, icon, checked, onChange }) => (
            <label className={`flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-colors ${checked ? 'bg-emerald-500/10 border-emerald-500/30' : 'bg-slate-900/60 border-slate-800'}`}>
                <input type="checkbox" checked={checked} onChange={onChange} className="hidden" />
                <div className={`w-4 h-4 rounded flex items-center justify-center ${checked ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 border border-slate-700'}`}>{checked && <Ico i="check" c="w-3 h-3" />}</div>
                <div className="flex items-center gap-2"><Ico i={icon} c={`w-4 h-4 ${checked ? 'text-emerald-400' : 'text-slate-500'}`} /><span className={`text-xs font-medium ${checked ? 'text-emerald-400' : 'text-slate-400'}`}>{label}</span></div>
            </label>
          );

          // PANTALLA LOGIN OBLIGATORIA
          if (!hasEntered) {

                  <div className="w-20 h-20 bg-gradient-to-br from-amber-400 to-amber-600 rounded-2xl flex items-center justify-center text-slate-950 mb-4"><Ico i="shield-check" c="w-10 h-10" /></div>
                  <h1 className="text-xl font-extrabold text-white">Gestor de Dotación</h1>
                  <h2 className="text-sm font-bold text-amber-400 mb-8 uppercase tracking-widest">BRAMAQ Enterprise</h2>

                  <div className="w-full space-y-4">
                    <label className="text-[10px] text-slate-500 font-bold uppercase block mb-1">Seleccione Rol de Ingreso</label>
                    <select value={selectedRole} onChange={e => { setSelectedRole(e.target.value); setSelectedSupName(''); }} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-amber-400 font-bold outline-none focus:border-amber-500">
                      <option value="" disabled>-- Perfil Operativo --</option>
                      <option value="Administrativo">Administrativo / RRHH</option>
                      <option value="AdminContrato">Administrador de Contrato</option>
                      <option value="Supervisor">Supervisor</option>
                      <option value="Prevencionista">Prevencionista</option>
                    </select>

                    {selectedRole === 'Supervisor' && (
                      <div className="fade-in">
                        <label className="text-[10px] text-slate-500 font-bold uppercase block mb-1 mt-2">Identificación de Supervisor</label>

                          <option value="" disabled>-- Nombre del Supervisor --</option>
                          {supervisorsList.map(name => <option key={name} value={name}>{name}</option>)}
                        </select>
                      </div>

                    <button disabled={!selectedRole || (selectedRole === 'Supervisor' && !selectedSupName)} onClick={handleEnterApp} className={`w-full py-3.5 rounded-xl font-bold text-sm mt-4 ${(!selectedRole || (selectedRole === 'Supervisor' && !selectedSupName)) ? 'bg-slate-800 text-slate-500' : 'bg-amber-500 text-slate-950 hover:bg-amber-400'}`}>
                      ACCEDER AL SISTEMA
                    </button>

                    {isInstallable && (
                      <button onClick={handleInstallClick} className="w-full py-3 mt-2 rounded-xl font-bold text-xs text-emerald-400 border border-emerald-500/30 flex items-center justify-center gap-2 hover:bg-emerald-500/10"><Ico i="download-cloud" c="w-4 h-4" /> Instalar Aplicación</button>
                    )}
                    {showInstallHelp && (
                      <div className="w-full py-3 px-4 rounded-xl text-xs text-slate-300 border border-slate-800 bg-slate-950 text-center fade-in mt-2">
                        {isIOS ? "En iPhone: Toca 'Compartir' (icono con flecha) y selecciona 'Agregar a inicio'." : "En el menú de tu navegador, selecciona 'Instalar aplicación'."}
                        <br/><button onClick={()=>setShowInstallHelp(false)} className="text-[10px] text-slate-500 mt-2 underline">Cerrar</button>
                      </div>
                    )}
                  </div>
                </div>

                                <div className="text-[9px] text-slate-400 font-bold uppercase">{item.label}</div>
                                <div className={`text-xl font-extrabold ${item.color}`}>{item.val}</div>
                              </div>
                            ))}
                          </div>

                          <div className="glass-panel p-6 rounded-2xl mt-4">
                            <h3 className="font-bold text-white mb-4 text-sm">Distribución por Ciudad (Operaciones)</h3>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                              {citiesList.map(city => kpis.porCiudad[city] > 0 && (

                                </div>
                              ))}
                            </div>
                          </div>
                        </>
                      )}

                      {/* ======================= DIRECTORIO DE DOTACIÓN ======================= */}
                      {activeTab === 'directorio' && (
                        <>
                          <div className="glass-panel p-4 rounded-xl flex flex-col md:flex-row items-center justify-between gap-3 sticky top-0 z-20 shadow-xl">
                            <div className="flex items-center gap-2 w-full md:w-auto flex-1">
                              <div className="relative w-full max-w-md">
                                <Ico i="search" c="absolute left-3 top-2.5 w-4 h-4 text-slate-500" />
                                <input type="text" placeholder="Buscar empleado por nombre, RUT, cargo o ciudad..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="w-full bg-slate-950 border border-slate-700 text-white text-sm rounded-lg pl-9 pr-3 py-2 outline-none focus:border-amber-500" />
                              </div>
                              {activeFilter !== 'TODOS' && <button onClick={() => setActiveFilter('TODOS')} className="bg-amber-500/10 border border-amber-500/20 text-amber-400 px-3 py-2 rounded-lg text-[10px] font-bold shrink-0 uppercase tracking-widest">Limpiar Filtros</button>}
                            </div>

                            <div className="flex flex-wrap items-center gap-2 w-full md:w-auto justify-end">
                              <button onClick={() => setIsGlobalHistoryOpen(true)} className="bg-indigo-600 px-3 py-2 rounded-lg text-white text-xs font-bold flex items-center gap-1 hover:bg-indigo-500"><Ico i="file-clock" c="w-3.5 h-3.5" /> Ver Hoja Global</button>
                              <button onClick={handleDownloadExcel} className="bg-emerald-600 px-3 py-2 rounded-lg text-white text-xs font-bold flex items-center gap-1 hover:bg-emerald-500"><Ico i="download" c="w-3.5 h-3.5" /> Exportar Todo</button>
                              
                              {(userSession.rol === 'Administrativo' || userSession.rol === 'AdminContrato') && (
                                <>

                                  <button onClick={() => fileInputRef.current.click()} className="bg-slate-800 border border-slate-700 px-3 py-2 rounded-lg text-white text-xs font-bold flex items-center gap-1 hover:bg-slate-700"><Ico i="upload" c="w-3.5 h-3.5" /> Carga Masiva (Excel)</button>

                              <button onClick={() => { setCurrentEmployee(null); setFormData({nombre: '', rut: '', direccion: '', ciudad: citiesList[0] || 'Valdivia', cargo: 'OPERADOR GRUA HORQUILLA', telefono: '', correo: '', emergenciaNombre: '', emergenciaFono: '', documentos: { contrato: true, induccion: true, examenes: true, epp: true }}); setIsModalOpen(true); }} className="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-lg text-xs font-extrabold flex items-center gap-1 shadow-lg"><Ico i="user-plus" c="w-4 h-4" /> Crear Ficha</button>

                            {filtered.map(emp => (

                                    <div>

                  <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-6xl h-[90vh] flex flex-col shadow-2xl overflow-hidden">
                    <div className="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-900 rounded-t-3xl shrink-0">
                      <div className="flex items-center gap-3"><div className="bg-indigo-500/20 p-2 rounded-xl text-indigo-400"><Ico i="file-clock" c="w-5 h-5" /></div><div><h3 className="font-bold text-white text-base">Consolidado Global de Bitácoras</h3><p className="text-[10px] text-slate-400">Todos los trabajadores con observaciones registradas.</p></div></div>
                      <button onClick={() => setIsGlobalHistoryOpen(false)} className="text-slate-400 hover:text-white bg-slate-800 p-2 rounded-lg border border-slate-700"><Ico i="x" c="w-4 h-4" /></button>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto p-5 sm:p-8 bg-slate-950/50">
                      {allGlobalLogs.length === 0 ? <div className="text-center py-32"><div className="mb-4"><Ico i="clipboard-list" c="w-16 h-16 text-slate-700 mx-auto" /></div><p className="text-slate-400 font-medium">El sistema no posee observaciones registradas a nivel global.</p></div> : (
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                          {allGlobalLogs.map((log, i) => (
                            <div key={i} className="bg-slate-900 p-5 rounded-2xl border border-slate-800 hover:border-slate-600 transition-colors flex flex-col h-full shadow-lg">
                              <div className="flex justify-between items-start mb-3 border-b border-slate-800 pb-3">
                                <div className="pr-2"><div className="font-bold text-sm text-white mb-0.5 leading-tight">{log.empleadoNombre}</div><span className="text-[9px] text-slate-400 font-mono bg-slate-950 px-1.5 py-0.5 rounded border border-slate-800">RUT: {log.empleadoRut}</span></div>
                                <span className="text-[9px] bg-amber-500/10 border border-amber-500/30 text-amber-400 px-2 py-1 rounded font-bold uppercase shrink-0 text-center">{log.tipo}</span>
                              </div>
                              <div className="flex-1 mb-3">
                                {log.nota ? <p className="text-xs text-slate-300 bg-slate-950 p-3 rounded-xl border border-slate-800/50 leading-relaxed italic">"{log.nota}"</p> : <p className="text-xs text-slate-500 italic">Sin observaciones.</p>}
                              </div>
                              <div className="text-[9px] text-slate-500 flex justify-between items-end border-t border-slate-800 pt-3">
                                <span className="font-mono flex items-center bg-slate-950 px-2 py-1 rounded border border-slate-800"><Ico i="calendar" c="w-3 h-3 mr-1" />{log.fechaInicio}</span>
                                <div className="text-right"><span>Autorizado:</span><br/><strong className="text-slate-300">{log.autor}</strong></div>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                    
                    <div className="p-5 border-t border-slate-800 flex justify-end gap-3 bg-slate-900 rounded-b-3xl shrink-0">
                      <button onClick={handleDownloadGlobalLogsExcel} className="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-3 rounded-xl font-bold text-xs flex items-center gap-2 shadow-[0_0_15px_rgba(16,185,129,0.2)]"><Ico i="file-spreadsheet" c="w-4 h-4" /> Generar Excel Consolidado</button>
                    </div>
                  </div>
                </div>
              )}

            </div>
          );
        }

        // CARGA DIRECTA Y SEGURA
        const container = document.getElementById('root');
        if (container) {
            try {
                const root = ReactDOM.createRoot(container);
                root.render(<ErrorBoundary><App /></ErrorBoundary>);
            } catch (e) {
                console.error("Fallo React DOM:", e);
                container.innerHTML = '<div style="color:#ef4444; padding:50px; text-align:center; font-family:sans-serif; font-weight:bold;">Error crítico en el renderizado de la aplicación. Verifique la consola o contacte al administrador.</div>';
            }
        }
    </script>
</body>
</html>
