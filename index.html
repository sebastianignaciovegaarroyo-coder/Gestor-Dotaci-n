<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAMAQ Enterprise - Gestor de Dotación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f1f5f9; }
        
        /* Custom Scrollbar for Enterprise feel */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* Smooth transitions */
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(30, 41, 59, 0.8); }
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const firebaseConfig = {
          apiKey: "AIzaSyD_ZlO3treRtz6ZkjY9V...",
          authDomain: "bramaqcloud.firebaseapp.com",
          projectId: "bramaqcloud",
          storageBucket: "bramaqcloud.appspot.com",
          messagingSenderId: "369713509600",
          appId: "1:369713509600:web:b6d878c..."
        };
        let db;
        try {
          if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
          db = firebase.firestore();
        } catch (e) { console.error(e); }

        function App() {
          const [employees, setEmployees] = useState([]);
          const [loading, setLoading] = useState(true);
          const [onlineStatus, setOnlineStatus] = useState(navigator.onLine);
          const [searchTerm, setSearchTerm] = useState('');
          const [activeTab, setActiveTab] = useState('dashboard');
          const [activeFilter, setActiveFilter] = useState('TODOS');
          const [citiesList] = useState(['Loncoche', 'Lanco', 'Valdivia', 'San José de la Mariquina', 'Los Lagos', 'Malalhue', 'Ciruelos', 'Panguipulli', 'Mariquina']);
          const [newCityInput, setNewCityInput] = useState('');
          
          const [isModalOpen, setIsModalOpen] = useState(false);
          const [currentEmployee, setCurrentEmployee] = useState(null);
          const [formError, setFormError] = useState('');
          
          const [isHistoryModalOpen, setIsHistoryModalOpen] = useState(false);
          const [selectedEmpForHistory, setSelectedEmpForHistory] = useState(null);
          const [isGlobalHistoryOpen, setIsGlobalHistoryOpen] = useState(false);

          const [selectedPhone, setSelectedPhone] = useState(null);
          
          // LÓGICA DE PERFIL INTACTA
          const [userSession, setUserSession] = useState({ rol: "Administrativo" });

          const [formData, setFormData] = useState({
            nombre: '', rut: '', direccion: '', ciudad: 'Valdivia', cargo: 'OPERADOR GRUA HORQUILLA', telefono: '', correo: '', emergenciaNombre: '', emergenciaFono: '',
            documentos: { contrato: true, induccion: true, examenes: true, epp: true }
          });

          const supervisorsList = useMemo(() => {
            const list = employees
              .filter(e => (e.cargo || '').toUpperCase().includes('SUPERVISOR'))
              .map(e => e.nombre);
            return list.length > 0 ? list : ['Briones Victor', 'Nahuelpan Nahuelpan Reinaldo Patricio', 'Rubilar Rubilar Daniel Joel'];
          }, [employees]);

          const [logForm, setLogForm] = useState({
            tipo: 'Licencia Médica', modoFechas: 'rango', fechaInicio: new Date().toISOString().split('T')[0], fechaTermino: new Date().toISOString().split('T')[0], fechaUnica: new Date().toISOString().split('T')[0],
            customTipo: '', nota: '', archivoNombre: '', archivoUrl: '', autorBitacora: 'Administrativo / RRHH', rolBitacora: 'Administrativo'
          });

          // AISLAMIENTO ESTRICTO DE AUTORÍA EN BITÁCORA (Lógica Intacta)
          useEffect(() => {
            if (userSession.rol === 'Administrativo') {
              setLogForm(prev => ({ ...prev, autorBitacora: 'Administrativo / RRHH', rolBitacora: 'Administrativo' }));
            } else if (userSession.rol === 'AdminContrato') {
              setLogForm(prev => ({ ...prev, autorBitacora: 'Administrador de Contrato', rolBitacora: 'AdminContrato' }));
            } else if (userSession.rol === 'Prevencionista') {
              setLogForm(prev => ({ ...prev, autorBitacora: 'Prevencionista de Riesgos', rolBitacora: 'Prevencionista' }));
            } else if (userSession.rol === 'Supervisor') {
              const defaultSup = supervisorsList[0] || 'Briones Victor';
              setLogForm(prev => ({ ...prev, autorBitacora: defaultSup, rolBitacora: 'Supervisor' }));
            }
          }, [userSession.rol, supervisorsList]);

          const fileInputRef = useRef(null);
          const logFileRef = useRef(null);

          useEffect(() => {
            const on = () => setOnlineStatus(true), off = () => setOnlineStatus(false);
            window.addEventListener('online', on); window.addEventListener('offline', off);
            if (!db) { setLoading(false); return; }
            const unsub = db.collection('employees').onSnapshot(snap => {
              const items = [];
              snap.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
              setEmployees(items); setLoading(false);
            }, () => setLoading(false));
            return () => { unsub(); window.removeEventListener('online', on); window.removeEventListener('offline', off); };
          }, []);

          // Renderizador constante de iconos Lucide
          useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

          const handleDownloadExcel = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(employees, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr); downloadAnchor.setAttribute("download", `bramaq_dotacion_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor); downloadAnchor.click(); downloadAnchor.remove();
          };

          const handleDownloadGlobalLogsExcel = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allGlobalLogs, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr); downloadAnchor.setAttribute("download", `bramaq_hoja_de_vida_global_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor); downloadAnchor.click(); downloadAnchor.remove();
          };

          const handleDeleteAllData = async () => {
            if (userSession.rol !== 'Administrativo' && userSession.rol !== 'AdminContrato') {
              alert("Sin permisos suficientes para realizar borrado masivo."); return;
            }
            if (confirm("⚠️ ACCIÓN CRÍTICA: ¿Estás seguro de vaciar toda la base de datos para cargar desde cero?")) {
              try {
                const batchSize = 400;
                let snapshot = await db.collection('employees').limit(batchSize).get();
                while (!snapshot.empty) {
                  const batch = db.batch();
                  snapshot.docs.forEach(doc => batch.delete(doc.ref));
                  await batch.commit();
                  snapshot = await db.collection('employees').limit(batchSize).get();
                }
                alert("Base de datos vaciada con éxito.");
              } catch (err) { alert("Error: " + err.message); }
            }
          };

          const handleUploadExcel = (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader(); reader.readAsArrayBuffer(file);
            reader.onload = async (event) => {
              try {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                const jsonSheet = XLSX.utils.sheet_to_json(worksheet, { defval: "", range: 1 });

                if (jsonSheet.length > 0) {
                  let addedCount = 0; let duplicateCount = 0;
                  let existingRuts = new Set(employees.map(emp => (emp.rut || '').trim().toLowerCase().replace(/[^0-9kK]/g, '')));

                  if (confirm(`Se leyeron ${jsonSheet.length} registros. ¿Importar omitiendo duplicados por RUT?`)) {
                    for (let row of jsonSheet) {
                      const keys = Object.keys(row);
                      const findVal = (terms) => {
                        for (let t of terms) {
                          const foundKey = keys.find(k => k.toLowerCase().includes(t));
                          if (foundKey && row[foundKey] !== undefined) return String(row[foundKey]).trim();
                        } return '';
                      };
                      const nombre = findVal(['nombre']); const rut = findVal(['rut']); const direccion = findVal(['direccion']); const ciudad = findVal(['ciudad']) || 'Valdivia'; const cargo = findVal(['cargo']); const telefono = findVal(['n telefonico', 'telefono', 'fono', 'celular']); const correo = findVal(['correo', 'email']); const emergenciaNombre = findVal(['nombre emergencia', 'emergencia', 'contacto emergencia']); const emergenciaFono = findVal(['fono emergencia', 'telefono emergencia', 'emergencia fono']);
                      const cleanRut = (rut || '').trim().toLowerCase().replace(/[^0-9kK]/g, '');

                      if ((nombre || rut) && cleanRut) {
                        if (!existingRuts.has(cleanRut)) {
                          await db.collection('employees').add({
                            nombre: nombre || 'Sin Nombre', rut: rut || 'Sin RUT', direccion: direccion || '', ciudad: ciudad, cargo: cargo || 'OPERADOR GRUA HORQUILLA', telefono: telefono, correo: correo, emergenciaNombre: emergenciaNombre, emergenciaFono: emergenciaFono,
                            documentos: { contrato: true, induccion: true, examenes: true, epp: true }, historial: []
                          });
                          existingRuts.add(cleanRut); addedCount++;
                        } else { duplicateCount++; }
                      }
                    }
                    alert(`¡Importación completada!\n- Agregados: ${addedCount}\n- Duplicados omitidos: ${duplicateCount}`);
                  }
                }
              } catch (err) { alert("Error: " + err.message); }
            };
          };

          const handleSave = async (e) => {
            e.preventDefault();
            if (!formData.nombre || !formData.rut) { setFormError("El Nombre y RUT son obligatorios."); return; }
            try {
              if (currentEmployee) {
                await db.collection('employees').doc(currentEmployee.id).update(formData);
              } else {
                await db.collection('employees').add({ ...formData, historial: [] });
              }
              setIsModalOpen(false); setCurrentEmployee(null);
            } catch (err) { setFormError("Error: " + err.message); }
          };

          const handleDelete = async (id) => {
            if (userSession.rol !== 'Administrativo' && userSession.rol !== 'AdminContrato') { alert("Sin permisos suficientes."); return; }
            if (confirm("¿Eliminar este trabajador permanentemente del sistema?")) await db.collection('employees').doc(id).delete();
          };

          const handleDeleteLog = async (logId) => {
            if (!selectedEmpForHistory) return;
            if (confirm("¿Estás seguro de eliminar esta observación del historial?")) {
              try {
                const updatedHistorial = (selectedEmpForHistory.historial || []).filter(h => h.id !== logId);
                await db.collection('employees').doc(selectedEmpForHistory.id).update({ historial: updatedHistorial });
                setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: updatedHistorial });
              } catch (err) { alert("Error: " + err.message); }
            }
          };

          const handleLogFileChange = (e) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = (uploadEvent) => { setLogForm({ ...logForm, archivoNombre: file.name, archivoUrl: uploadEvent.target.result }); };
              reader.readAsDataURL(file);
            }
          };

          const handleAddLog = async (e) => {
            e.preventDefault();
            if (!selectedEmpForHistory) return;
            const tipoFinal = logForm.tipo === 'Otro' ? (logForm.customTipo || 'Otro evento') : logForm.tipo;
            const logEntry = {
              id: String(Date.now()), tipo: String(tipoFinal), modoFechas: String(logForm.modoFechas),
              fechaInicio: String(logForm.modoFechas === 'rango' ? logForm.fechaInicio : logForm.fechaUnica),
              fechaTermino: String(logForm.modoFechas === 'rango' ? logForm.fechaTermino : logForm.fechaUnica),
              nota: String(logForm.nota || ''), archivoNombre: String(logForm.archivoNombre || ''), archivoUrl: String(logForm.archivoUrl || ''),
              autor: String(logForm.autorBitacora), rolAutor: String(logForm.rolBitacora), createdAt: new Date().toISOString()
            };

            try {
              const updatedHistorial = [...(selectedEmpForHistory.historial || []), logEntry];
              await db.collection('employees').doc(selectedEmpForHistory.id).update({ historial: updatedHistorial });
              setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: updatedHistorial });
              setLogForm({
                tipo: 'Licencia Médica', modoFechas: 'rango', fechaInicio: new Date().toISOString().split('T')[0], fechaTermino: new Date().toISOString().split('T')[0], fechaUnica: new Date().toISOString().split('T')[0],
                customTipo: '', nota: '', archivoNombre: '', archivoUrl: '',
                autorBitacora: userSession.rol === 'Supervisor' ? (supervisorsList[0] || '') : logForm.autorBitacora,
                rolBitacora: userSession.rol
              });
            } catch (error) { alert("Error al registrar: " + error.message); }
          };

          const getMissingDataList = (emp) => {
            let missing = [];
            if (!emp.telefono) missing.push("Teléfono");
            if (!emp.correo) missing.push("Correo");
            if (!emp.emergenciaNombre || !emp.emergenciaFono) missing.push("Emergencia");
            if (emp.documentos) {
              if (!emp.documentos.contrato) missing.push("Contrato");
              if (!emp.documentos.induccion) missing.push("Inducción");
              if (!emp.documentos.examenes) missing.push("Exámenes");
              if (!emp.documentos.epp) missing.push("EPP");
            }
            return missing;
          };

          const filtered = useMemo(() => {
            const seenRuts = new Set(); const uniqueEmployees = [];
            for (const emp of employees) {
              const cleanR = (emp.rut || '').trim().toLowerCase().replace(/[^0-9kK]/g, '');
              if (cleanR) { if (!seenRuts.has(cleanR)) { seenRuts.add(cleanR); uniqueEmployees.push(emp); } } 
              else { uniqueEmployees.push(emp); }
            }
            const list = uniqueEmployees.filter(emp => {
              const s = searchTerm.toLowerCase();
              const matchSearch = (emp.nombre||'').toLowerCase().includes(s) || (emp.rut||'').toLowerCase().includes(s) || (emp.cargo||'').toLowerCase().includes(s) || (emp.ciudad||'').toLowerCase().includes(s);
              if (!matchSearch) return false;
              if (activeFilter === 'TODOS') return true;
              if (activeFilter === 'INCOMPLETOS') return getMissingDataList(emp).length > 0;
              if (activeFilter === 'ADMIN_CONTRATO') { const c = (emp.cargo || '').toUpperCase(); return c.includes('ADMINISTRADOR DE CONTRATO') || c.includes('ADMIN. CONTRATO') || c.includes('ADMINISTRADOR'); }
              if (activeFilter === 'SUPERVISORES') return (emp.cargo||'').toUpperCase().includes('SUPERVISOR');
              if (activeFilter === 'PREVENCIONISTAS') return (emp.cargo||'').toUpperCase().includes('PREVENCION');
              if (activeFilter === 'ADMINISTRATIVOS') return (emp.cargo||'').toUpperCase().includes('ADMINISTRATIVO') && !(emp.cargo||'').toUpperCase().includes('CONTRATO');
              if (activeFilter === 'OPERADORES_GRUA') return (emp.cargo||'').toUpperCase().includes('GRUA');
              if (activeFilter === 'CARGADOR_FRONTAL') return (emp.cargo||'').toUpperCase().includes('CARGADOR FRONTAL');
              if (activeFilter === 'MECANICOS') return (emp.cargo||'').toUpperCase().includes('MECANICO');
              if (citiesList.includes(activeFilter)) return (emp.ciudad||'').toLowerCase() === activeFilter.toLowerCase();
              return true;
            });
            return list.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es', { sensitivity: 'base' }));
          }, [employees, searchTerm, activeFilter, citiesList]);

          const kpis = useMemo(() => {
            const total = filtered.length;
            const supervisores = employees.filter(e => (e.cargo||'').toUpperCase().includes('SUPERVISOR')).length;
            const prevencionistas = employees.filter(e => (e.cargo||'').toUpperCase().includes('PREVENCION')).length;
            const administrativos = employees.filter(e => (e.cargo||'').toUpperCase().includes('ADMINISTRATIVO') && !(e.cargo||'').toUpperCase().includes('CONTRATO')).length;
            const adminContrato = employees.filter(e => { const c = (e.cargo || '').toUpperCase(); return c.includes('ADMINISTRADOR DE CONTRATO') || c.includes('ADMIN. CONTRATO') || c.includes('ADMINISTRADOR'); }).length;
            const operadoresGrua = employees.filter(e => (e.cargo||'').toUpperCase().includes('GRUA')).length;
            const cargadorFrontal = employees.filter(e => (e.cargo||'').toUpperCase().includes('CARGADOR FRONTAL')).length;
            const mecanicos = employees.filter(e => (e.cargo||'').toUpperCase().includes('MECANICO')).length;
            const incompletos = employees.filter(e => getMissingDataList(e).length > 0).length;
            const porCiudad = {};
            citiesList.forEach(c => { porCiudad[c] = employees.filter(e => (e.ciudad||'').toLowerCase() === c.toLowerCase()).length; });
            return { total: employees.length, supervisores, prevencionistas, administrativos, adminContrato, operadoresGrua, cargadorFrontal, mecanicos, incompletos, porCiudad };
          }, [employees, citiesList, filtered]);

          const allGlobalLogs = useMemo(() => {
            let logs = [];
            employees.forEach(emp => {
              if (emp.historial && emp.historial.length > 0) { emp.historial.forEach(h => { logs.push({ ...h, empleadoNombre: emp.nombre, empleadoRut: emp.rut }); }); }
            });
            return logs.sort((a, b) => new Date(b.fechaInicio || b.createdAt) - new Date(a.fechaInicio || a.createdAt));
          }, [employees]);

          // Componente de Panel de Requisitos (Visual Toggle)
          const RequisitoToggle = ({ label, icon, checked, onChange }) => (
            <label className={`flex items-center gap-3 p-3 rounded-xl border transition-all cursor-pointer ${checked ? 'bg-emerald-500/10 border-emerald-500/30' : 'bg-slate-900/60 border-slate-800 hover:border-slate-700'}`}>
                <input type="checkbox" checked={checked} onChange={onChange} className="hidden" />
                <div className={`w-5 h-5 rounded flex items-center justify-center transition-colors ${checked ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 border border-slate-700'}`}>
                    {checked && <i data-lucide="check" className="w-3.5 h-3.5"></i>}
                </div>
                <div className="flex items-center gap-2">
                  <i data-lucide={icon} className={`w-4 h-4 ${checked ? 'text-emerald-400' : 'text-slate-500'}`}></i>
                  <span className={`text-sm font-medium ${checked ? 'text-emerald-400' : 'text-slate-400'}`}>{label}</span>
                </div>
            </label>
          );

          return (
            <div className="flex h-screen overflow-hidden bg-slate-950">
              
              {/* SIDEBAR DESKTOP */}
              <aside className="hidden lg:flex flex-col w-64 bg-slate-900/50 backdrop-blur border-r border-slate-800 h-full z-10">
                <div className="h-16 flex items-center px-6 border-b border-slate-800">
                  <div className="flex items-center gap-2.5">
                    <div className="bg-gradient-to-br from-amber-400 to-amber-600 p-2 rounded-lg text-slate-950 shadow-lg shadow-amber-500/20">
                      <i data-lucide="hard-hat" className="w-5 h-5"></i>
                    </div>
                    <span className="font-bold tracking-tight text-white text-lg">BRAMAQ</span>
                  </div>
                </div>
                
                <div className="p-4 space-y-1.5 flex-1 overflow-y-auto">
                  <div className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-3 px-2">Menú Principal</div>
                  
                  <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm transition-all font-medium ${activeTab === 'dashboard' ? 'bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'}`}>
                    <i data-lucide="layout-dashboard" className="w-4 h-4"></i> Panel Gerencial
                  </button>
                  <button onClick={() => setActiveTab('directorio')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm transition-all font-medium ${activeTab === 'directorio' ? 'bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'}`}>
                    <i data-lucide="users" className="w-4 h-4"></i> Directorio y Bitácora
                  </button>
                  
                  <div className="mt-8">
                    <div className="bg-slate-900/80 rounded-2xl p-4 border border-slate-800 space-y-3">
                      <div className="flex items-center gap-2">
                        <span className={`w-2 h-2 rounded-full ${onlineStatus ? 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]' : 'bg-red-500 animate-pulse'}`}></span>
                        <span className="text-xs font-semibold text-slate-300">{onlineStatus ? 'Conectado a Cloud' : 'Sin Conexión'}</span>
                      </div>
                      <div className="space-y-1.5 pt-2 border-t border-slate-800">
                        <label className="text-[10px] font-bold text-slate-500 uppercase">Perfil Activo</label>
                        <div className="relative">
                          <select 
                            value={userSession.rol} 
                            onChange={e => setUserSession({ rol: e.target.value })} 
                            className="w-full appearance-none bg-slate-950 border border-slate-700 text-amber-400 font-semibold text-xs py-2 pl-3 pr-8 rounded-lg outline-none focus:border-amber-500 transition-colors cursor-pointer"
                          >
                            <option value="Administrativo">Administrativo / RRHH</option>
                            <option value="AdminContrato">Administrador de Contrato</option>
                            <option value="Supervisor">Supervisor de Faena</option>
                            <option value="Prevencionista">Prevencionista</option>
                          </select>
                          <i data-lucide="chevron-down" className="w-4 h-4 text-slate-500 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </aside>

              {/* MAIN CONTENT AREA */}
              <div className="flex-1 flex flex-col h-screen relative">
                
                {/* HEADER (Mobile & General) */}
                <header className="lg:hidden h-16 flex items-center justify-between px-4 sm:px-6 bg-slate-900/80 backdrop-blur border-b border-slate-800 z-30 sticky top-0">
                  <div className="flex items-center gap-2">
                    <div className="bg-gradient-to-br from-amber-400 to-amber-600 p-1.5 rounded-md text-slate-950">
                      <i data-lucide="hard-hat" className="w-4 h-4"></i>
                    </div>
                    <span className="font-bold text-white tracking-tight">BRAMAQ</span>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className={`w-2 h-2 rounded-full ${onlineStatus ? 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]' : 'bg-red-500'}`}></span>
                    <select 
                      value={userSession.rol} 
                      onChange={e => setUserSession({ rol: e.target.value })} 
                      className="bg-slate-950 border border-slate-700 text-amber-400 font-semibold text-[10px] py-1.5 px-2 rounded outline-none"
                    >
                      <option value="Administrativo">Administrativo</option>
                      <option value="AdminContrato">Admin. Contrato</option>
                      <option value="Supervisor">Supervisor</option>

                                {log.nota && <p className="text-sm text-slate-300 leading-relaxed bg-slate-950 p-3 rounded-xl border border-slate-800/50 mb-3">{log.nota}</p>}
                              </div>
                              <div className="flex items-end justify-between mt-auto pt-3 border-t border-slate-800/80">
                                <div className="text-[11px] text-slate-500 font-medium">
                                  <i data-lucide="calendar" className="w-3 h-3 inline mr-1"></i> {log.fechaInicio}
                                </div>
                                <div className="text-right">
                                  <p className="text-[10px] text-slate-500 uppercase tracking-wider">Autorizado por</p>
                                  <p className="text-xs font-semibold text-indigo-400">{log.autor}</p>
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    <div className="px-6 py-4 border-t border-slate-800 bg-slate-900/50 flex justify-between items-center">
                      <button onClick={handleDownloadGlobalLogsExcel} className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm flex items-center gap-2 shadow-lg transition-colors">
                        <i data-lucide="download" className="w-4 h-4"></i> Exportar Auditoría JSON
                      </button>
                      <button onClick={() => setIsGlobalHistoryOpen(false)} className="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl text-sm transition-colors">Cerrar</button>
                    </div>
                  </div>
                </div>
              )}

            </div>
          );
        }
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
