<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAMAQ - Gestor Master Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-16">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const firebaseConfig = {
          apiKey: "AIzaSyD_ZlO3treRtz6ZkjY9V...",
          authDomain: "bramaqcloud.firebaseapp.com",
          projectId: "bramaqcloud",
          storageBucket: "bramaqcloud.appspot.com",
          messagingSenderId: "369713509600",
          appId: "1:369713509600:web:b6d878c..."
        };
        let db;
        try {
          if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
          db = firebase.firestore();
        } catch (e) { console.error(e); }

        function App() {
          const [employees, setEmployees] = useState([]);
          const [loading, setLoading] = useState(true);
          const [onlineStatus, setOnlineStatus] = useState(navigator.onLine);
          const [searchTerm, setSearchTerm] = useState('');
          const [activeFilter, setActiveFilter] = useState('TODOS');
          const [activeTab, setActiveTab] = useState('directorio');
          const [citiesList, setCitiesList] = useState(['Valdivia', 'Lanco', 'Loncoche', 'San José de la Mariquina']);
          const [newCityInput, setNewCityInput] = useState('');
          const [isModalOpen, setIsModalOpen] = useState(false);
          const [currentEmployee, setCurrentEmployee] = useState(null);
          const [formError, setFormError] = useState('');
          const [isHistoryModalOpen, setIsHistoryModalOpen] = useState(false);
          const [selectedEmpForHistory, setSelectedEmpForHistory] = useState(null);
          const [userSession, setUserSession] = useState({ nombre: "Admin General", rol: "Administrativo" });
          const [formData, setFormData] = useState({ nombre: '', rut: '', direccion: '', ciudad: 'Valdivia', cargo: '', telefono: '', correo: '', emergenciaNombre: '', emergenciaFono: '' });
          const [newLog, setNewLog] = useState({ tipo: 'Licencia Médica', fechaInicio: new Date().toISOString().split('T')[0], fechaTermino: new Date().toISOString().split('T')[0], nota: '' });

          useEffect(() => {
            const on = () => setOnlineStatus(true), off = () => setOnlineStatus(false);
            window.addEventListener('online', on); window.addEventListener('offline', off);
            if (!db) { setLoading(false); return; }
            const unsub = db.collection('employees').onSnapshot(snap => {
              const items = [];
              snap.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
              setEmployees(items); setLoading(false);
            }, () => setLoading(false));
            return () => { unsub(); window.removeEventListener('online', on); window.removeEventListener('offline', off); };
          }, []);

          useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

          const handleSave = async (e) => {
            e.preventDefault();
            if (!formData.nombre || !formData.rut) { setFormError("Nombre y RUT obligatorios."); return; }
            try {
              if (currentEmployee) {
                await db.collection('employees').doc(currentEmployee.id).update(formData);
              } else {
                await db.collection('employees').add({ ...formData, historial: [] });
              }
              setIsModalOpen(false); setCurrentEmployee(null);
            } catch (err) { setFormError("Error: " + err.message); }
          };

          const handleDelete = async (id) => {
            if (userSession.rol !== 'Administrativo') { alert("Sin permisos de Administrador."); return; }
            if (confirm("¿Eliminar trabajador?")) await db.collection('employees').doc(id).delete();
          };

          const handleLog = async (e) => {
            e.preventDefault();
            if (!selectedEmpForHistory) return;
            const log = { id: Date.now().toString(), ...newLog, autor: userSession.nombre, rolAutor: userSession.rol };
            const hist = [...(selectedEmpForHistory.historial || []), log];
            await db.collection('employees').doc(selectedEmpForHistory.id).update({ historial: hist });
            setSelectedEmpForHistory({ ...selectedEmpForHistory, historial: hist });
            setNewLog({ tipo: 'Licencia Médica', fechaInicio: new Date().toISOString().split('T')[0], fechaTermino: new Date().toISOString().split('T')[0], nota: '' });
          };

          const filtered = useMemo(() => employees.filter(emp => {
            const s = searchTerm.toLowerCase();
            const match = (emp.nombre||'').toLowerCase().includes(s) || (emp.rut||'').toLowerCase().includes(s) || (emp.cargo||'').toLowerCase().includes(s) || (emp.ciudad||'').toLowerCase().includes(s);
            if (activeFilter === 'INCOMPLETOS') return match && (!emp.telefono || !emp.emergenciaNombre);
            if (activeFilter === 'SUPERVISORES') return match && (emp.cargo||'').toUpperCase().includes('SUPERVISOR');
            if (activeFilter === 'PREVENCION') return match && (emp.cargo||'').toUpperCase().includes('PREVENCION');
            return match;
          }), [employees, searchTerm, activeFilter]);

          const kpis = useMemo(() => ({
            total: employees.length,
            supervisores: employees.filter(e => (e.cargo||'').toUpperCase().includes('SUPERVISOR')).length,
            prevencionistas: employees.filter(e => (e.cargo||'').toUpperCase().includes('PREVENCION')).length,
            incompletos: employees.filter(e => !e.telefono || !e.emergenciaNombre).length
          }), [employees]);

          return (
            <div className="min-h-screen bg-slate-950 text-slate-100 pb-20">
              <div className={`text-center text-xs py-1.5 font-bold ${onlineStatus ? 'bg-emerald-950 text-emerald-400' : 'bg-red-950 text-red-400 animate-pulse'}`}>
                {onlineStatus ? '🟢 Conectado a la Nube (Tiempo Real)' : '🔴 Sin Conexión'}
              </div>
              <nav className="bg-slate-900 border-b border-slate-800 sticky top-0 z-20 p-4 flex justify-between items-center">
                <div className="flex items-center gap-2">
                  <span className="bg-amber-600 p-2 rounded-xl text-white font-bold text-xs">🏗️ BRAMAQ</span>
                  <h1 className="font-bold text-sm">Gestor Master Cloud</h1>
                </div>
                <div className="flex gap-2">
                  <select value={userSession.rol} onChange={e=>setUserSession({...userSession, rol: e.target.value})} className="bg-slate-950 text-amber-400 text-xs px-2 py-1 rounded border border-slate-700">
                    <option value="Administrativo">Admin</option>
                    <option value="Supervisor">Supervisor</option>
                    <option value="Prevencionista">Prevención</option>
                  </select>
                  <button onClick={()=>setActiveTab('dashboard')} className={`px-3 py-1 rounded text-xs ${activeTab==='dashboard'?'bg-amber-600 text-white':'bg-slate-800'}`}>Panel</button>
                  <button onClick={()=>setActiveTab('directorio')} className={`px-3 py-1 rounded text-xs ${activeTab==='directorio'?'bg-amber-600 text-white':'bg-slate-800'}`}>Directorio</button>
                </div>
              </nav>

              <main className="max-w-7xl mx-auto px-4 mt-6">
                {loading ? <div className="text-center py-24">Cargando...</div> : (
                  <>
                    {activeTab === 'dashboard' && (
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <div onClick={()=>{setActiveFilter('TODOS');setActiveTab('directorio');}} className="bg-slate-900 p-4 rounded-xl border border-slate-800 cursor-pointer">
                          <span className="text-slate-400 text-xs">Total Dotación</span>
                          <span className="text-3xl font-bold text-white">{kpis.total}</span>
                        </div>
                        <div onClick={()=>{setActiveFilter('SUPERVISORES');setActiveTab('directorio');}} className="bg-slate-900 p-4 rounded-xl border border-slate-800 cursor-pointer">
                          <span className="text-slate-400 text-xs">Supervisores</span>
                          <span className="text-3xl font-bold text-indigo-400">{kpis.supervisores}</span>
                        </div>
                        <div onClick={()=>{setActiveFilter('PREVENCION');setActiveTab('directorio');}} className="bg-slate-900 p-4 rounded-xl border border-slate-800 cursor-pointer">
                          <span className="text-slate-400 text-xs">Prevención</span>
                          <span className="text-3xl font-bold text-emerald-400">{kpis.prevencionistas}</span>
                        </div>
                        <div onClick={()=>{setActiveFilter('INCOMPLETOS');setActiveTab('directorio');}} className="bg-slate-900 p-4 rounded-xl border border-red-950 cursor-pointer">
                          <span className="text-red-400 text-xs">Incompletos</span>
                          <span className="text-3xl font-bold text-red-400">{kpis.incompletos}</span>
                        </div>
                      </div>
                    )}

                    {activeTab === 'directorio' && (
                      <div className="space-y-4">
                        <div className="flex flex-col md:flex-row gap-3 justify-between">
                          <input type="text" placeholder="Buscar trabajador..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} className="w-full md:w-1/3 px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm" />
                          <button onClick={()=>{setCurrentEmployee(null);setFormData({nombre:'',rut:'',direccion:'',ciudad:citiesList[0],cargo:'',telefono:'',correo:'',emergenciaNombre:'',emergenciaFono:''});setIsModalOpen(true);}} className="bg-amber-600 text-white px-4 py-2 rounded-xl text-sm font-bold">Nuevo Trabajador</button>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                          {filtered.map(emp => (
                            <div key={emp.id} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
                              <div>
                                <h3 className="font-bold text-base">{emp.nombre}</h3>
                                <span className="text-xs text-slate-400 font-mono">{emp.rut}</span>
                                <div className="mt-2 text-xs bg-slate-950 p-2 rounded-xl border border-slate-800">
                                  <div><b>Cargo:</b> {emp.cargo || 'Sin cargo'}</div>
                                  <div><b>Ciudad:</b> {emp.ciudad}</div>
                                </div>
                              </div>
                              <div className="space-y-1 text-xs">
                                <div className="flex justify-between items-center bg-slate-950 p-2 rounded-xl border border-slate-800">
                                  <span>{emp.telefono || 'Sin teléfono'}</span>
                                  {emp.telefono && (
                                    <div className="flex gap-1">
                                      <a href={`tel:${emp.telefono}`} className="bg-blue-950 text-blue-400 px-2 py-0.5 rounded text-[10px]">Llamar</a>
                                      <a href={`https://wa.me/${emp.telefono.replace(/[^0-9]/g,'')}`} target="_blank" rel="noopener noreferrer" className="bg-emerald-950 text-emerald-400 px-2 py-0.5 rounded text-[10px]">WhatsApp</a>
                                    </div>
                                  )}
                                </div>
                              </div>
                              <div className="pt-2 border-t border-slate-800 flex justify-between">
                                <button onClick={()=>{setSelectedEmpForHistory(emp);setIsHistoryModalOpen(true);}} className="bg-slate-800 text-amber-400 px-2.5 py-1 rounded text-xs">Hoja de Vida ({emp.historial?.length || 0})</button>
                                <div className="flex gap-1">
                                  <button onClick={()=>{setCurrentEmployee(emp);setFormData(emp);setIsModalOpen(true);}} className="bg-slate-800 text-slate-300 px-2 py-1 rounded text-xs">Editar</button>
                                  {userSession.rol === 'Administrativo' && <button onClick={()=>handleDelete(emp.id)} className="bg-slate-800 text-red-400 px-2 py-1 rounded text-xs">Eliminar</button>}
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </>
                )}
              </main>

              {isModalOpen && (
                <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
                  <div className="bg-slate-900 p-6 rounded-2xl w-full max-w-lg border border-slate-800 space-y-4">
                    <h3 className="font-bold text-base">{currentEmployee ? 'Editar' : 'Nuevo'} Trabajador</h3>
                    {formError && <div className="text-red-400 text-xs">{formError}</div>}
                    <form onSubmit={handleSave} className="space-y-3 text-xs">
                      <input required placeholder="Nombre completo" value={formData.nombre} onChange={e=>setFormData({...formData, nombre:e.target.value})} className="w-full p-2 bg-slate-950 border border-slate-800 rounded-xl" />
                      <input required placeholder="RUT" value={formData.rut} onChange={e=>setFormData({...formData, rut:e.target.value})} className="w-full p-2 bg-slate-950 border border-slate-800 rounded-xl" />
                      <input placeholder="Cargo" value={formData.cargo} onChange={e=>setFormData({...formData, cargo:e.target.value})} className="w-full p-2 bg-slate-950 border border-slate-800 rounded-xl" />
                      <select value={formData.ciudad} onChange={e=>setFormData({...formData, ciudad:e.target.value})} className="w-full p-2 bg-slate-950 border border-slate-800 rounded-xl">
                        {citiesList.map(c=><option key={c} value={c}>{c}</option>)}
                      </select>
                      <div className="flex gap-2">
                        <input placeholder="Otra ciudad" value={newCityInput} onChange={e=>setNewCityInput(e.target.value)} className="w-full p-1 bg-slate-950 border border-slate-800 rounded-lg text-xs" />
                        <button type="button" onClick={()=>{if(newCityInput){setCitiesList([...citiesList, newCityInput]);setFormData({...formData, ciudad:newCityInput});setNewCityInput('');}}} className="bg-slate-800 px-3 py-1 rounded text-xs">Añadir</button>
                      </div>
                      <input placeholder="Teléfono" value={formData.telefono} onChange={e=>setFormData({...formData, telefono:e.target.value})} className="w-full p-2 bg-slate-950 border border-slate-800 rounded-xl" />
                      <input placeholder="Correo" value={formData.correo} onChange={e=>setFormData({...formData, correo:e.target.value})} className="w-full p-2 bg-slate-950 border border-slate-800 rounded-xl" />
                      <input placeholder="Emergencia (Nombre)" value={formData.emergenciaNombre} onChange={e=>setFormData({...formData, emergenciaNombre:e.target.value})} className="w-full p-2 bg-slate-950 border border-slate-800 rounded-xl" />
                      <input placeholder="Emergencia (Teléfono)" value={formData.emergenciaFono} onChange={e=>setFormData({...formData, emergenciaFono:e.target.value})} className="w-full p-2 bg-slate-950 border border-slate-800 rounded-xl" />
                      <div className="flex justify-end gap-2 pt-2">
                        <button type="button" onClick={()=>setIsModalOpen(false)} className="px-3 py-1 bg-slate-800 rounded">Cancelar</button>
                        <button type="submit" className="px-4 py-1 bg-amber-600 text-white font-bold rounded">Guardar</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {isHistoryModalOpen && selectedEmpForHistory && (
                <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
                  <div className="bg-slate-900 p-6 rounded-2xl w-full max-w-lg border border-slate-800 space-y-4">
                    <h3 className="font-bold text-base">Hoja de Vida: {selectedEmpForHistory.nombre}</h3>
                    <div className="space-y-2 max-h-48 overflow-y-auto text-xs">
                      {selectedEmpForHistory.historial?.length === 0 ? <p className="text-slate-500">Sin eventos registrados.</p> :
                        selectedEmpForHistory.historial?.map(h=>(
                          <div key={h.id} className="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                            <span className="font-bold text-amber-400">{h.tipo}</span> ({h.fechaInicio})<p className="text-slate-300">{h.nota}</p>
                          </div>
                        ))
                      }
                    </div>
                    <form onSubmit={handleLog} className="space-y-2 text-xs pt-2 border-t border-slate-800">
                      <select value={newLog.tipo} onChange={e=>setNewLog({...newLog, tipo:e.target.value})} className="w-full p-2 bg-slate-950 border border-slate-800 rounded">
                        <option value="Licencia Médica">Licencia Médica</option>
                        <option value="Permiso">Permiso</option>
                        <option value="Incidente">Incidente</option>
                        <option value="Felicitación">Felicitación</option>
                      </select>
                      <div className="flex gap-2">
                        <input type="date" value={newLog.fechaInicio} onChange={e=>setNewLog({...newLog, fechaInicio:e.target.value})} className="w-1/2 p-1 bg-slate-950 border border-slate-800 rounded" />
                        <input type="date" value={newLog.fechaTermino} onChange={e=>setNewLog({...newLog, fechaTermino:e.target.value})} className="w-1/2 p-1 bg-slate-950 border border-slate-800 rounded" />
                      </div>
                      <textarea placeholder="Detalle..." value={newLog.nota} onChange={e=>setNewLog({...newLog, nota:e.target.value})} className="w-full p-2 bg-slate-950 border border-slate-800 rounded" rows="2"></textarea>
                      <div className="flex justify-end gap-2">
                        <button type="button" onClick={()=>setIsHistoryModalOpen(false)} className="px-3 py-1 bg-slate-800 rounded">Cerrar</button>
                        <button type="submit" className="px-4 py-1 bg-amber-600 text-white font-bold rounded">Registrar</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}
            </div>
          );
        }
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
