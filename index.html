<!DOCTYPE html>
<html lang="es" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/Gestor-Dotaci-n/">
    <title>Gestor de Dotación BRAMAQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body { background-color: #020617; color: #f1f5f9; font-family: sans-serif; margin: 0; }
    </style>
</head>
<body translate="no">
    <div id="root">
        <div style="display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; color:#f59e0b; font-weight:bold;">
            Iniciando BRAMAQ...
        </div>
    </div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const firebaseConfig = {
          apiKey: "AIzaSyD_ZlO3treRtz6ZkjY9Vr69wJz2vA...",
          authDomain: "bramaqcloud.firebaseapp.com",
          projectId: "bramaqcloud",
          storageBucket: "bramaqcloud.appspot.com",
          messagingSenderId: "369713509600",
          appId: "1:369713509600:web:b6d878c..."
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function App() {
          const [hasEntered, setHasEntered] = useState(false);
          const [gateProfile, setGateProfile] = useState('');
          const [employees, setEmployees] = useState([]);
          const [loading, setLoading] = useState(false);

          const handleEnterApp = () => {
            if(!gateProfile) return;
            setHasEntered(true);
            setLoading(true);
            db.collection('employees').onSnapshot(snap => {
              const items = [];
              snap.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
              setEmployees(items);
              setLoading(false);
            });
          };

          if (!hasEntered) {
            return (
              <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4">
                <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl w-full max-w-sm text-center shadow-2xl">
                  <h1 className="text-xl font-bold text-white mb-2">BRAMAQ</h1>
                  <p className="text-xs text-slate-400 mb-6">Selecciona tu perfil de acceso</p>
                  <select value={gateProfile} onChange={e => setGateProfile(e.target.value)} className="w-full bg-slate-950 border border-slate-700 text-amber-400 p-3 rounded-xl mb-4 font-bold">
                    <option value="">-- Elige perfil --</option>
                    <option value="Administrativo">Administrativo / RRHH</option>
                    <option value="Supervisor">Supervisor</option>
                  </select>
                  <button onClick={handleEnterApp} disabled={!gateProfile} className="w-full bg-amber-500 text-slate-950 py-3 rounded-xl font-bold">INGRESAR</button>
                </div>
              </div>
            );
          }

          return (
            <div className="p-6 max-w-4xl mx-auto min-h-screen bg-slate-950 text-white">
              <div className="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
                <h1 className="text-xl font-bold text-amber-400">Panel BRAMAQ ({gateProfile})</h1>
                <button onClick={() => setHasEntered(false)} className="bg-slate-800 px-4 py-2 rounded-lg text-xs font-bold">Cambiar Perfil</button>
              </div>
              {loading ? <p className="text-center text-slate-500">Cargando trabajadores...</p> : (
                <div className="space-y-3">
                  <p className="text-xs text-slate-400">Total trabajadores en base de datos: <strong className="text-white">{employees.length}</strong></p>
                  {employees.map(e => (
                    <div key={e.id} className="bg-slate-900 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                      <div>
                        <h4 className="font-bold text-white text-sm">{e.nombre}</h4>
                        <p className="text-xs text-slate-400">{e.cargo} - {e.ciudad}</p>
                      </div>
                      <span className="text-xs font-mono text-amber-400">{e.rut}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        }

        window.addEventListener('load', () => {
          const container = document.getElementById('root');
          if (container) {
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
          }
        });
    </script>
</body>
</html>
